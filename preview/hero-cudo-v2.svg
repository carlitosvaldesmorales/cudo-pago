<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 1100" role="img" aria-labelledby="title desc">
<title id="title">C.U.D.O. — El club es de todos</title><desc id="desc">Campaña de socios del Club Unión Orilla sobre fotografía del estadio.</desc>
<defs><linearGradient id="topShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#071d52" stop-opacity=".99"/><stop offset=".46" stop-color="#0b4f99" stop-opacity=".92"/><stop offset=".69" stop-color="#0b4f99" stop-opacity=".36"/><stop offset="1" stop-color="#07152d" stop-opacity=".08"/></linearGradient><radialGradient id="brandGlow" cx="24%" cy="12%" r="44%"><stop offset="0" stop-color="#2588de" stop-opacity=".45"/><stop offset="1" stop-color="#08316d" stop-opacity="0"/></radialGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#00102e" flood-opacity=".35"/></filter></defs>
<image href="../assets/estadio-v2.webp" x="0" y="0" width="620" height="1100" preserveAspectRatio="xMidYMid slice"/><rect width="620" height="800" fill="url(#topShade)"/><rect width="620" height="520" fill="url(#brandGlow)"/>
<image href="../assets/logo-cudo.png" x="50" y="42" width="118" height="171" preserveAspectRatio="xMidYMid meet" filter="url(#shadow)"/><line x1="187" y1="78" x2="187" y2="205" stroke="#fff" stroke-width="2" opacity=".8"/>
<text x="214" y="104" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#fff">CLUB UNIÓN ORILLA</text><text x="214" y="167" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="900" fill="#fff">C.U.D.O.</text>
<rect x="50" y="253" width="250" height="48" rx="10" fill="#d92332"/><text x="70" y="285" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="900" letter-spacing="4" fill="#fff">C.U.D.O. INFORMA</text>
<text x="50" y="375" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="900" letter-spacing="-2" fill="#fff">EL CLUB ES</text><text x="50" y="432" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="900" letter-spacing="-2" fill="#fff">DE TODOS</text>
<text x="50" y="483" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#fff"><tspan x="50">Como club queremos hablarles con claridad.</tspan><tspan x="50" dy="31">Mantener nuestro estadio, la cancha y toda la</tspan><tspan x="50" dy="31">infraestructura que usa la comunidad genera un</tspan><tspan x="50" dy="31">gasto constante durante todo el año.</tspan></text>
<text x="50" y="626" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="800" fill="#fff"><tspan x="50">Riego, mantención, implementos y</tspan><tspan x="50" dy="30">funcionamiento general del club.</tspan></text><rect x="50" y="686" width="116" height="7" rx="3.5" fill="#e3b843"/>
</svg>
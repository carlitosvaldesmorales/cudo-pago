name: CUDO Review Observer Certify Run 35097612969

on:
  push:
    paths:
      - '.github/workflows/cudo-review-observer-certify-run-35097612969.yml'

permissions:
  actions: read
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: '35097612969'
      SOURCE_CREATED_AT: '2026-09-16T12:44:40Z'
      SOURCE_HEAD_SHA: 'b7ee097d35632d5674b79840542f7d56a3566dda'
      SOURCE_TITLE: 'CUDO Review Engine · workflow_dispatch · apps_script_form_submit'
      CUDO_REVIEW_RUN_LOG: /tmp/review-run.log
      CUDO_REVIEW_EVENT_EVIDENCE_DIR: /tmp/cudo-review-event-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/review-event-no-prod-20260915
          fetch-depth: 1
          persist-credentials: false
      - name: Download exact successful Review Engine logs
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/logs" \
            -o /tmp/review-run-logs.zip
          unzip -p /tmp/review-run-logs.zip > "$CUDO_REVIEW_RUN_LOG"
          grep -F 'CUDO_REVIEW_TRIGGER_SOURCE=apps_script_form_submit' "$CUDO_REVIEW_RUN_LOG" >/dev/null
      - name: Certify real event with passive observer
        run: node qa-v8-google/tools/review_event_observer.mjs
      - name: Validate evidence and no polling contract
        shell: bash
        run: |
          set -euo pipefail
          test -s "$CUDO_REVIEW_EVENT_EVIDENCE_DIR/event-driven-latest.json"
          test -s "$CUDO_REVIEW_EVENT_EVIDENCE_DIR/event-driven-latest.md"
          ! grep -Eq '^\s*schedule\s*:' .github/workflows/cudo-review-engine.yml
          ! grep -Eq '\bcron\s*:' .github/workflows/cudo-review-engine.yml
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/cudo-review-event-evidence/event-driven-latest.json'))
          print(json.dumps(d,indent=2,ensure_ascii=False))
          assert d.get('ok') is True, d
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cudo-review-event-driven-35097612969
          path: /tmp/cudo-review-event-evidence/
          if-no-files-found: error
          retention-days: 30

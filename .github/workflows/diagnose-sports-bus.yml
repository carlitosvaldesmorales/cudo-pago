name: Diagnose Sports Event Bus
on:
  workflow_dispatch:
  push:
    branches: [feature/sports-event-bus-v1]
    paths: ['.github/workflows/diagnose-sports-bus.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install Wrangler
        run: npm install --no-save wrangler@latest
      - name: Worker and Telegram runtime health
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cudo-sports-event-bus.carlos-valdes-morales.workers.dev'
          curl -fsS "$BASE/health" | tee /tmp/health.json
          node -e 'const h=require("/tmp/health.json");if(!h.ok)process.exit(1)'
          ok=0
          for i in $(seq 1 20); do
            curl -fsS "$BASE/health/telegram" -o /tmp/telegram.json
            cat /tmp/telegram.json
            if node - <<'NODE'
          const t=require('/tmp/telegram.json');
          const baseOk=t.ok&&t.bot_token_configured&&t.webhook_secret_configured&&t.bot_api_ok&&t.webhook_configured;
          if(!baseOk) process.exit(1);
          if(Number(t.pending_update_count||0)!==0) process.exit(2);
          NODE
            then ok=1; break; fi
            sleep 3
          done
          test "$ok" = "1"
      - name: D1 reporter and club mapping health
        shell: bash
        run: |
          set -euo pipefail
          SQL="SELECT club_id,role,trust_level,active,COUNT(*) AS n FROM reporters GROUP BY club_id,role,trust_level,active ORDER BY club_id,role; SELECT team_id,canonical_name,group_id FROM teams WHERE team_id IN ('CUDO','UNION-ORILLA') ORDER BY team_id; SELECT COUNT(*) AS cudo_matches FROM matches WHERE home_id='UNION-ORILLA' OR away_id='UNION-ORILLA'; SELECT COUNT(*) AS legacy_cudo_reporters FROM reporters WHERE club_id='CUDO'; SELECT COUNT(*) AS canonical_admins FROM reporters WHERE club_id='UNION-ORILLA' AND active=1 AND trust_level='VERIFIED' AND role IN ('SUPER_ADMIN','CLUB_ADMIN');"
          npx wrangler d1 execute cudo-sports-event-bus --remote --json --command "$SQL" > /tmp/d1.json
          cat /tmp/d1.json
          node <<'NODE'
          const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8'));
          const rows=x.flatMap(v=>v.results||[]);
          const canonical=rows.find(r=>r.team_id==='UNION-ORILLA');
          const matches=rows.find(r=>Object.prototype.hasOwnProperty.call(r,'cudo_matches'));
          const legacy=rows.find(r=>Object.prototype.hasOwnProperty.call(r,'legacy_cudo_reporters'));
          const admins=rows.find(r=>Object.prototype.hasOwnProperty.call(r,'canonical_admins'));
          console.log(JSON.stringify({canonical_team_detected:!!canonical,cudo_fixture_matches:matches?.cudo_matches??null,legacy_cudo_reporters:legacy?.legacy_cudo_reporters??null,canonical_admins:admins?.canonical_admins??null},null,2));
          if(!canonical || Number(matches?.cudo_matches||0)!==5 || Number(legacy?.legacy_cudo_reporters||0)!==0 || Number(admins?.canonical_admins||0)<1) process.exit(3);
          NODE

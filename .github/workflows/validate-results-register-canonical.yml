name: Validate Canonical Results Register

on:
  pull_request:
    branches: [feature/sports-event-bus-v1]
  push:
    branches:
      - feature/results-register-canonical-stream-v1
      - feature/sports-event-bus-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          set -euo pipefail
          node --check sports-bus/canonical-entry.js
          node --check sports-bus/worker/results-register-entry.js
          node --check sports-bus/worker/results-stream-entry.js
          node --check qa/telegram/results-register-canonical-harness.mjs
      - name: Canonical vertical
        run: node qa/telegram/results-register-canonical-harness.mjs
      - name: Contract assertions
        run: |
          set -euo pipefail
          grep -q 'RESULT: PASS' <(node qa/telegram/results-register-canonical-harness.mjs)
          grep -q 'EVENT_DRIVEN_PRIMARY_PROPAGATION' docs/product/module-registry.json
          ! grep -q 'Escribe el marcador LOCAL-VISITA' sports-bus/worker/results-register-entry.js

name: CUDO Hosted Failover Plane Probe

on:
  push:
    branches:
      - ops/cudo-hosted-failover-probe-20260923
    paths:
      - '.github/workflows/cudo-hosted-failover-plane-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/cudo-hosted-failover-probe-20260923
          fetch-depth: 0

      - name: Probe hosted runtime and deterministic CUDO contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/hosted-failover-plane
          node --version
          python3 --version
          git --version
          node qa-v8-google/tools/certify_work_item_engine.mjs
          node qa-v8-google/tools/certify_attention_signal_contract.mjs
          node preview-v8/tools/validate_pwa_shell.mjs
          python3 - <<'PY'
          import json,os,platform,subprocess
          from datetime import datetime,timezone
          out={
            "schema_version":"CUDO_HOSTED_FAILOVER_PLANE_PROBE_V1",
            "generated_at":datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00","Z"),
            "repository":os.environ.get("GITHUB_REPOSITORY"),
            "runner_name":os.environ.get("RUNNER_NAME"),
            "runner_os":os.environ.get("RUNNER_OS"),
            "runner_arch":os.environ.get("RUNNER_ARCH"),
            "github_run_id":os.environ.get("GITHUB_RUN_ID"),
            "execution_plane":"GITHUB_HOSTED",
            "contracts":{
              "work_item_engine":"PASS",
              "attention_signal_contract":"PASS",
              "pwa_shell":"PASS"
            },
            "tooling":{
              "python":platform.python_version(),
              "node":subprocess.check_output(["node","--version"],text=True).strip(),
              "git":subprocess.check_output(["git","--version"],text=True).strip()
            },
            "production_write":False,
            "real_club_data_write":False
          }
          open("evidence/hosted-failover-plane/latest.json","w",encoding="utf-8").write(json.dumps(out,indent=2,ensure_ascii=False)+"\n")
          print(json.dumps(out,indent=2,ensure_ascii=False))
          PY

      - name: Persist branch-local failover evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cudo-hosted-failover[bot]'
          git config user.email 'actions@users.noreply.github.com'
          git add evidence/hosted-failover-plane/latest.json
          git commit -m 'evidence(cudo): certify GitHub-hosted failover plane' || exit 0
          git pull --rebase origin ops/cudo-hosted-failover-probe-20260923
          git push origin HEAD:ops/cudo-hosted-failover-probe-20260923

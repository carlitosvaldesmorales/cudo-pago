name: Certify CUDO Adaptive Control Web Mock

on:
  pull_request:
    branches: [qa-v8-mock]
    paths:
      - 'preview-v8/data/adaptive-control-mock.json'
      - 'preview-v8/shared/adaptive-control-projection.mjs'
      - 'preview-v8/tools/certify_adaptive_control_web_projection.mjs'
      - '.github/workflows/certify-cudo-adaptive-control-web-mock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate projection syntax
        run: node --check preview-v8/shared/adaptive-control-projection.mjs
      - name: Validate certifier syntax
        run: node --check preview-v8/tools/certify_adaptive_control_web_projection.mjs
      - name: Certify adaptive control Web projection
        run: node preview-v8/tools/certify_adaptive_control_web_projection.mjs

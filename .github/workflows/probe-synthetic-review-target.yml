name: CUDO QA Synthetic Review Target Probe

on:
  push:
    paths:
      - '.github/workflows/probe-synthetic-review-target.yml'
      - 'qa-v8-google/tools/probe_synthetic_review_target.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CUDO_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_ID }}
      CUDO_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_SECRET }}
      CUDO_GOOGLE_REFRESH_TOKEN: ${{ secrets.CUDO_GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validar sintaxis
        run: node --check qa-v8-google/tools/probe_synthetic_review_target.mjs
      - name: Resolver objetivo sintético QA sin escrituras
        run: node qa-v8-google/tools/probe_synthetic_review_target.mjs
      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cudo-qa-review-target-${{ github.run_id }}
          path: qa-review-target/report.json
          if-no-files-found: warn
          retention-days: 14

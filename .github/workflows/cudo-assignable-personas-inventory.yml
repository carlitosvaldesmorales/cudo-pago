name: CUDO Assignable Personas Inventory

on:
  push:
    branches:
      - agent/match-full-club-day-roundtrip-20260921
    paths:
      - '.github/workflows/cudo-assignable-personas-inventory.yml'
      - 'qa-v8-google/tools/inventory_assignable_personas.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CUDO_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_ID }}
      CUDO_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_SECRET }}
      CUDO_GOOGLE_REFRESH_TOKEN: ${{ secrets.CUDO_GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inventory assignable PERSONA identities read-only
        run: node qa-v8-google/tools/inventory_assignable_personas.mjs
      - name: Persist minimal non-sensitive evidence
        run: |
          set -euo pipefail
          git config user.name 'cudo-personas-inventory[bot]'
          git config user.email 'actions@users.noreply.github.com'
          git add evidence/event-work-real-people/personas-inventory.json
          git commit -m 'evidence(cudo): inventory assignable approved personas' || true
          git push origin HEAD:refs/heads/agent/match-full-club-day-roundtrip-20260921

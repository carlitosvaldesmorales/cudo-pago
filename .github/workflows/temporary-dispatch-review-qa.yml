name: Temporary Dispatch CUDO Review QA

on:
  push:
    paths:
      - '.github/workflows/temporary-dispatch-review-qa.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch canonical Review Engine on current QA branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/cudo-review-engine.yml/dispatches" \
            -d '{"ref":"qa/review-event-no-prod-20260915","inputs":{"apply_changes":"true","source":"apps_script_form_submit"}}'
          echo 'DISPATCH_ACCEPTED'

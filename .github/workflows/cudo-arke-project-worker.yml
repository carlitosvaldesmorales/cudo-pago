name: CUDO ARKE Project Worker

on:
  repository_dispatch:
    types:
      - arke_cudo_handoff

permissions:
  contents: write
  statuses: write

concurrency:
  group: cudo-arke-project-worker-${{ github.event.client_payload.handoff_id }}
  cancel-in-progress: false

jobs:
  reconcile-handoff:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'arke_cudo_handoff'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HANDOFF_ID: ${{ github.event.client_payload.handoff_id }}
      OPERATION: ${{ github.event.client_payload.operation }}
      TARGET_REPOSITORY: ${{ github.event.client_payload.target_repository }}
      TARGET_BRANCH: ${{ github.event.client_payload.target_branch }}
      EXPECTED_HEAD: ${{ github.event.client_payload.expected_head }}
      PATCH_SHA256: ${{ github.event.client_payload.patch_sha256 }}
      PATCH_B64: ${{ github.event.client_payload.patch_b64 }}
      PRODUCTION_WRITE: ${{ github.event.client_payload.production_write }}
      TARGET_MAIN_ALLOWED: ${{ github.event.client_payload.target_main_allowed }}

    steps:
      - name: Checkout CUDO repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Validate bounded event handoff
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HANDOFF_ID"
          test "$OPERATION" = "APPLY_BUILDER_PATCH_TO_EXISTING_AGENT_BRANCH"
          test "$TARGET_REPOSITORY" = "$GITHUB_REPOSITORY"
          case "$TARGET_BRANCH" in
            agent/*) ;;
            *) echo "::error::Only agent/* branches are allowed"; exit 2 ;;
          esac
          test "$TARGET_BRANCH" != "main"
          test "$PRODUCTION_WRITE" = "false"
          test "$TARGET_MAIN_ALLOWED" = "false"
          test -n "$PATCH_SHA256"
          test -n "$PATCH_B64"

      - name: Decode and verify builder patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 --decode > /tmp/arke-builder.patch
          ACTUAL="$(sha256sum /tmp/arke-builder.patch | awk '{print $1}')"
          test "$ACTUAL" = "$PATCH_SHA256"
          echo "CUDO_ARKE_PATCH_SHA256=$ACTUAL"

      - name: Apply and certify bounded builder patch
        id: apply
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="$TARGET_BRANCH"
          EXPECTED="$EXPECTED_HEAD"
          STATUS_CONTEXT="arke-handoff/$HANDOFF_ID"

          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          CURRENT="$(git rev-parse HEAD)"

          fail_status() {
            local description="$1"
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$(git rev-parse HEAD)"               -f state=failure               -f context="$STATUS_CONTEXT"               -f description="$description" >/dev/null
            echo "::error::$description"
            exit 0
          }

          ALREADY=false
          if git apply --reverse --check /tmp/arke-builder.patch >/dev/null 2>&1; then
            ALREADY=true
          else
            if [ -n "$EXPECTED" ] && [ "$CURRENT" != "$EXPECTED" ]; then
              fail_status "ARKE patch stale against target branch"
            fi
            git apply --check /tmp/arke-builder.patch || fail_status "ARKE patch no longer applies"
            git apply /tmp/arke-builder.patch
            git diff --check || fail_status "ARKE patch introduced diff errors"
          fi

          python3 -m pip install --disable-pip-version-check 'playwright==1.44.0'
          python3 -m playwright install --with-deps chromium

          nohup python3 -m http.server 4178 --bind 127.0.0.1 >/tmp/cudo-arke-worker-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4178/preview-v8/eventos/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4178/preview-v8/eventos/ >/dev/null

          TESTS=(preview-v8/tools/certify_match_full_day_roundtrip.py)
          for test in "${TESTS[@]}"; do
            python3 "$test"
          done

          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

          if [ "$ALREADY" = "false" ]; then
            git config user.name 'cudo-arke-project-worker[bot]'
            git config user.email 'actions@users.noreply.github.com'
            git add -A
            git commit -m "agent(cudo): apply ARKE handoff $HANDOFF_ID"
            git push origin "HEAD:$BRANCH"
          fi

          FINAL_SHA="$(git rev-parse HEAD)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$FINAL_SHA"             -f state=success             -f context="$STATUS_CONTEXT"             -f description="ARKE handoff applied and certified" >/dev/null

          echo "applied_sha=$FINAL_SHA" >> "$GITHUB_OUTPUT"
          echo "already_applied=$ALREADY" >> "$GITHUB_OUTPUT"
          echo "CUDO_ARKE_HANDOFF_APPLIED id=$HANDOFF_ID sha=$FINAL_SHA already=$ALREADY"

name: CUDO Apps Script Deployments Readonly

on:
  push:
    paths:
      - '.github/workflows/cudo-apps-script-deployments-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CUDO_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_ID }}
      CUDO_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_SECRET }}
      CUDO_GOOGLE_REFRESH_TOKEN: ${{ secrets.CUDO_GOOGLE_REFRESH_TOKEN }}
    steps:
      - name: Inspect deployment entry-point types only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          sid='1NI73jgr_PFvrsHy27ejE_kLbTWwLbM1Y8Nyc6mRaWlcCaLlZrpEB3Ud8'
          body=urllib.parse.urlencode({'client_id':os.environ['CUDO_GOOGLE_OAUTH_CLIENT_ID'],'client_secret':os.environ['CUDO_GOOGLE_OAUTH_CLIENT_SECRET'],'refresh_token':os.environ['CUDO_GOOGLE_REFRESH_TOKEN'],'grant_type':'refresh_token'}).encode()
          with urllib.request.urlopen(urllib.request.Request('https://oauth2.googleapis.com/token',data=body,headers={'Content-Type':'application/x-www-form-urlencoded'})) as r: access=json.load(r)['access_token']
          req=urllib.request.Request(f'https://script.googleapis.com/v1/projects/{sid}/deployments',headers={'Authorization':'Bearer '+access})
          with urllib.request.urlopen(req) as r: d=json.load(r)
          out=[]
          for dep in d.get('deployments',[]):
            eps=[]
            for ep in dep.get('entryPoints',[]):
              if 'executionApi' in ep: eps.append({'type':'EXECUTION_API','access':ep.get('executionApi',{}).get('access')})
              if 'webApp' in ep: eps.append({'type':'WEB_APP','access':ep.get('webApp',{}).get('access'),'executeAs':ep.get('webApp',{}).get('executeAs')})
              if 'addOn' in ep: eps.append({'type':'ADD_ON'})
            out.append({'deploymentId':dep.get('deploymentId'),'description':dep.get('deploymentConfig',{}).get('description'),'versionNumber':dep.get('deploymentConfig',{}).get('versionNumber'),'entryPoints':eps})
          print(json.dumps({'ok':True,'deployments':out},indent=2))
          PY

# second push intentionally runs the registered read-only inspection

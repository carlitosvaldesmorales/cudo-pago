name: CUDO Agent Self-Hosted Probe

on:
  push:
    paths:
      - '.github/workflows/cudo-agent-selfhosted-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 5
    env:
      CUDO_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_ID }}
      CUDO_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_SECRET }}
      CUDO_GOOGLE_REFRESH_TOKEN: ${{ secrets.CUDO_GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify execution plane and secret availability without exposing values
        shell: bash
        run: |
          set -euo pipefail
          echo "hostname=$(hostname)"
          echo "user=$(id -un)"
          echo "rootless_podman=$(podman info --format '{{.Host.Security.Rootless}}' 2>/dev/null || echo unavailable)"
          for name in CUDO_GOOGLE_OAUTH_CLIENT_ID CUDO_GOOGLE_OAUTH_CLIENT_SECRET CUDO_GOOGLE_REFRESH_TOKEN; do
            if [ -n "${!name:-}" ]; then echo "$name=PRESENT"; else echo "$name=ABSENT"; fi
          done
          command -v node >/dev/null && echo "node=PRESENT"
          command -v curl >/dev/null && echo "curl=PRESENT"

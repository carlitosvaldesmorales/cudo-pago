name: CUDO Review Certify Recovered E2E

on:
  push:
    paths:
      - '.github/workflows/cudo-review-certify-recovered-e2e.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CUDO_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_ID }}
      CUDO_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_SECRET }}
      CUDO_GOOGLE_REFRESH_TOKEN: ${{ secrets.CUDO_GOOGLE_REFRESH_TOKEN }}
      EXPECTED_REVIEW_ID: CUDO-REV-40396BF2809BACAC
      EXPECTED_TARGET: CUDO-QA-SYNTH-TABLA-35027786202
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify APLICADO in review ledger and absent from Tabla PUBLICO_EXPORT
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.parse,urllib.request
          body=urllib.parse.urlencode({
            'client_id':os.environ['CUDO_GOOGLE_OAUTH_CLIENT_ID'],
            'client_secret':os.environ['CUDO_GOOGLE_OAUTH_CLIENT_SECRET'],
            'refresh_token':os.environ['CUDO_GOOGLE_REFRESH_TOKEN'],
            'grant_type':'refresh_token'
          }).encode()
          with urllib.request.urlopen(urllib.request.Request(
            'https://oauth2.googleapis.com/token',data=body,
            headers={'Content-Type':'application/x-www-form-urlencoded'}
          )) as r:
            token=json.load(r)['access_token']
          headers={'Authorization':'Bearer '+token}
          def read(sid,tab,rng):
            q=urllib.parse.quote(f"'{tab}'!{rng}",safe='')
            with urllib.request.urlopen(urllib.request.Request(
              f'https://sheets.googleapis.com/v4/spreadsheets/{sid}/values/{q}?majorDimension=ROWS&valueRenderOption=FORMATTED_VALUE',
              headers=headers
            )) as r:
              return json.load(r).get('values',[])
          review_sid='1KnC56IWf2hRxrGU4ksdO-JlzWyl2XJbhbOHKkdx4vms'
          tabla_sid='1evGNco6Si1BYUAdwsBxLGiSMsYEmmojVWlx04NgPodY'
          audit=read(review_sid,'AUDITORIA_REVISION','A:P')
          matches=[]
          for n,row in enumerate(audit[1:],start=2):
            vals=(row+['']*16)[:16]
            vals=[str(x).strip() for x in vals]
            if vals[0]==os.environ['EXPECTED_REVIEW_ID']:
              matches.append((n,vals))
          assert len(matches)==1, {'audit_match_count':len(matches)}
          rownum,vals=matches[0]
          assert vals[2]=='Tabla de posiciones', vals
          assert vals[3]==os.environ['EXPECTED_TARGET'], vals
          assert vals[4]=='Rechazar publicación', vals
          assert vals[9]=='APLICADO', {'row':rownum,'estado_proceso':vals[9],'resultado':vals[12]}
          public=read(tabla_sid,'PUBLICO_EXPORT','A:Z')
          public_matches=sum(1 for row in public if os.environ['EXPECTED_TARGET'] in [str(v).strip() for v in row])
          assert public_matches==0, {'public_matches':public_matches}
          print('audit_aplicado=PASS')
          print('tabla_public_export_target_absent=PASS')
          PY
      - name: Rebuild public projection locally and require zero V8 diff
        shell: bash
        run: |
          set -euo pipefail
          node preview-v8/tools/sync_google_publico.mjs
          python3 preview-v8/tools/validate_data.py preview-v8/data
          git diff --exit-code -- preview-v8/data preview-v8/media
          echo 'v8_public_projection_zero_diff=PASS'

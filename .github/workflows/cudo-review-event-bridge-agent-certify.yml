name: CUDO Review Event Bridge Agent Certify

on:
  push:
    paths:
      - '.github/workflows/cudo-review-event-bridge-agent-certify.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CUDO_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_ID }}
      CUDO_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_SECRET }}
      CUDO_GOOGLE_REFRESH_TOKEN: ${{ secrets.CUDO_GOOGLE_REFRESH_TOKEN }}
      CUDO_SCRIPT_ID: 1NI73jgr_PFvrsHy27ejE_kLbTWwLbM1Y8Nyc6mRaWlcCaLlZrpEB3Ud8
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy bridge source preserving the existing Apps Script project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          sid=os.environ['CUDO_SCRIPT_ID']
          bridge=pathlib.Path('qa-v8-google/apps-script/CudoReviewEventBridge.gs').read_text()
          token_req=urllib.request.Request(
            'https://oauth2.googleapis.com/token',
            data=urllib.parse.urlencode({
              'client_id':os.environ['CUDO_GOOGLE_OAUTH_CLIENT_ID'],
              'client_secret':os.environ['CUDO_GOOGLE_OAUTH_CLIENT_SECRET'],
              'refresh_token':os.environ['CUDO_GOOGLE_REFRESH_TOKEN'],
              'grant_type':'refresh_token'
            }).encode(),
            headers={'Content-Type':'application/x-www-form-urlencoded'}
          )
          with urllib.request.urlopen(token_req) as r:
            access=json.load(r)['access_token']
          url=f'https://script.googleapis.com/v1/projects/{sid}/content'
          def call(method='GET',payload=None):
            req=urllib.request.Request(url,data=None if payload is None else json.dumps(payload).encode(),headers={'Authorization':'Bearer '+access,'Content-Type':'application/json'},method=method)
            with urllib.request.urlopen(req) as r:
              raw=r.read(); return json.loads(raw) if raw else {}
          current=call()
          clean=[{'name':f['name'],'type':f['type'],'source':f.get('source','')} for f in current.get('files',[]) if f.get('name')!='CudoReviewEventBridge']
          clean.append({'name':'CudoReviewEventBridge','type':'SERVER_JS','source':bridge})
          call('PUT',{'files':clean})
          verify=call()
          found=[f for f in verify.get('files',[]) if f.get('name')=='CudoReviewEventBridge']
          if len(found)!=1 or found[0].get('source')!=bridge:
            raise SystemExit('Bridge source verification failed')
          print(json.dumps({'ok':True,'bridge_present':True,'file_count':len(verify.get('files',[])),'other_files_preserved':len(verify.get('files',[]))-1},indent=2))
          pathlib.Path('/tmp/google-access-token').write_text(access)
          PY

      - name: Read exact bridge status through Execution API devMode
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          sid=os.environ['CUDO_SCRIPT_ID']; access=pathlib.Path('/tmp/google-access-token').read_text().strip()
          req=urllib.request.Request(f'https://script.googleapis.com/v1/scripts/{sid}:run',data=json.dumps({'function':'cudoReviewEventBridgeStatus','devMode':True}).encode(),headers={'Authorization':'Bearer '+access,'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req) as r: d=json.load(r)
          if d.get('error'): raise SystemExit(json.dumps(d['error']))
          result=((d.get('response') or {}).get('result') or {})
          safe={'token_configured':bool(result.get('token_configured')),'trigger_count':result.get('trigger_count'),'spreadsheet_id':result.get('spreadsheet_id')}
          print(json.dumps(safe,indent=2))
          if safe['token_configured'] is not True: raise SystemExit('token_configured != true')
          if safe['trigger_count'] != 1: raise SystemExit(f"trigger_count != 1: {safe['trigger_count']}")
          PY

      - name: Ping Apps Script bridge without writing Sheets
        id: ping
        shell: bash
        run: |
          set -euo pipefail
          date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/ping-started-at
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          sid=os.environ['CUDO_SCRIPT_ID']; access=pathlib.Path('/tmp/google-access-token').read_text().strip()
          req=urllib.request.Request(f'https://script.googleapis.com/v1/scripts/{sid}:run',data=json.dumps({'function':'cudoReviewEventBridgePing','devMode':True}).encode(),headers={'Authorization':'Bearer '+access,'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req) as r: d=json.load(r)
          if d.get('error'): raise SystemExit(json.dumps(d['error']))
          result=((d.get('response') or {}).get('result') or {})
          safe={'ok':bool(result.get('ok')),'github_status':result.get('github_status')}
          print(json.dumps(safe,indent=2))
          if safe['ok'] is not True or safe['github_status'] not in (200,204): raise SystemExit('bridge ping failed')
          PY

      - name: Observe workflow_dispatch created by Apps Script and require SUCCESS
        shell: bash
        run: |
          set -euo pipefail
          STARTED="$(cat /tmp/ping-started-at)"
          RUN_ID=''
          for i in $(seq 1 30); do
            RUN_ID="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/carlitosvaldesmorales/cudo-pago/actions/workflows/cudo-review-engine.yml/runs?event=workflow_dispatch&branch=main&per_page=20' | jq -r --arg started "$STARTED" '[.workflow_runs[] | select(.created_at >= $started)] | sort_by(.created_at) | last | .id // empty')"
            [ -n "$RUN_ID" ] && break
            sleep 2
          done
          test -n "$RUN_ID"
          echo "dispatched_run_id=$RUN_ID"
          for i in $(seq 1 60); do
            DATA="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/carlitosvaldesmorales/cudo-pago/actions/runs/$RUN_ID")"
            STATUS="$(jq -r '.status' <<<"$DATA")"
            CONCLUSION="$(jq -r '.conclusion // empty' <<<"$DATA")"
            echo "status=$STATUS conclusion=${CONCLUSION:-pending}"
            if [ "$STATUS" = completed ]; then
              test "$CONCLUSION" = success
              exit 0
            fi
            sleep 2
          done
          echo 'Timed out waiting for dispatched Review Engine run' >&2
          exit 1

# registered workflow: this second commit intentionally exercises the certification path

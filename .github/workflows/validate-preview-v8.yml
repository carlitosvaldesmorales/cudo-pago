name: CUDO V8 - validar preview visual

on:
  push:
    branches:
      - visual-brand-v8
      - main
    paths:
      - 'preview-v8/**'
      - '.github/workflows/validate-preview-v8.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'preview-v8/**'
      - '.github/workflows/validate-preview-v8.yml'

permissions:
  contents: read

jobs:
  validate-v8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar contratos V8
        run: python3 preview-v8/tools/validate_data.py
      - name: Validar Javascript
        run: |
          node --check preview-v8/shared/site.js
          node --check preview-v8/shared/seed-data.js
          node --check preview-v8/shared/data-source.js
      - name: Validar modo de datos real sin fallback mock
        run: |
          python3 - <<'PY'
          from pathlib import Path
          adapter=Path('preview-v8/shared/data-source.js').read_text(encoding='utf-8')
          shim=Path('preview-v8/shared/seed-data.js').read_text(encoding='utf-8')
          combined=adapter+'\n'+shim
          assert 'mock:false' in adapter, 'El adapter V8 debe declarar mock:false'
          assert 'cudoResolveDataUrl' in adapter, 'Falta resolver datos públicos'
          assert 'data-source.js' in shim, 'seed-data.js debe ser sólo shim hacia data-source.js'
          for token in ['CUDO_SEED_DATA','CUDO_SEED_SUMMARY','randomuser.me','VISTA DEMOSTRATIVA','FOTO MOCK']:
              assert token not in combined, f'Fallback mock/seed prohibido: {token}'
          print('V8 real-data mode OK: contratos reales y sin fallback mock')
          PY
      - name: Validar paquete visual
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pages=['index.html','club/index.html','noticias/index.html','partidos/index.html','equipos/index.html','galeria/index.html']
          root=Path('preview-v8')
          for p in pages:
              text=(root/p).read_text(encoding='utf-8')
              assert 'site.css' in text, p
              assert 'logo-cudo.png' in text, p
              assert 'PARTIDOS' in text, p
              assert 'C.U.D.O.' in text, p
          css=(root/'shared/site.css').read_text(encoding='utf-8')
          for token in ['--navy','--red','--gold','.pagehead','.playergrid','.matchgrid','.gallerygrid']:
              assert token in css, token
          print('Paquete visual V8 OK')
          PY

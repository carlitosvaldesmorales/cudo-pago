name: CUDO Review Event Correlation

on:
  push:
    paths:
      - '.github/workflows/cudo-review-event-correlation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correlate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CUDO_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_ID }}
      CUDO_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_SECRET }}
      CUDO_GOOGLE_REFRESH_TOKEN: ${{ secrets.CUDO_GOOGLE_REFRESH_TOKEN }}
    steps:
      - name: Correlate synthetic event across Form responses and audit ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, urllib.parse, urllib.request

          sid='1KnC56IWf2hRxrGU4ksdO-JlzWyl2XJbhbOHKkdx4vms'
          target='CUDO-QA-SYNTH-TABLA-35027786202'
          event_id='CUDO-REVIEW-E2E-20260916-001'
          reviewer='CUDO QA Automation'

          body=urllib.parse.urlencode({
              'client_id':os.environ['CUDO_GOOGLE_OAUTH_CLIENT_ID'],
              'client_secret':os.environ['CUDO_GOOGLE_OAUTH_CLIENT_SECRET'],
              'refresh_token':os.environ['CUDO_GOOGLE_REFRESH_TOKEN'],
              'grant_type':'refresh_token'
          }).encode()
          with urllib.request.urlopen(urllib.request.Request(
              'https://oauth2.googleapis.com/token',data=body,
              headers={'Content-Type':'application/x-www-form-urlencoded'}
          )) as r:
              token=json.load(r)['access_token']

          def read(tab,rng='A:Q'):
              q=urllib.parse.quote(f"'{tab}'!{rng}",safe='')
              req=urllib.request.Request(
                  f'https://sheets.googleapis.com/v4/spreadsheets/{sid}/values/{q}?majorDimension=ROWS&valueRenderOption=FORMATTED_VALUE',
                  headers={'Authorization':'Bearer '+token}
              )
              with urllib.request.urlopen(req) as r:
                  return json.load(r).get('values',[])

          responses=read('Respuestas de formulario 1')
          audit=read('AUDITORIA_REVISION','A:P')

          response_rows=[]
          for n,row in enumerate(responses[1:],start=2):
              vals=row+['']*(17-len(row))
              ident=vals[2].strip(); obs=vals[6].strip(); rev=vals[7].strip()
              fp=hashlib.sha256(('|'.join(vals[:10])).encode()).hexdigest()[:12]
              if n>=5:
                  response_rows.append({
                      'row':n,
                      'fingerprint':fp,
                      'content_type':vals[1].strip(),
                      'decision':vals[3].strip(),
                      'identifier_is_target':ident==target,
                      'observations_has_event_id':event_id in obs,
                      'reviewer_is_automation':rev==reviewer,
                  })

          audit_rows=[]
          for n,row in enumerate(audit[1:],start=2):
              vals=row+['']*(16-len(row))
              ident=vals[3].strip(); obs=vals[7].strip(); rev=vals[8].strip()
              if ident==target or event_id in obs or rev==reviewer:
                  audit_rows.append({
                      'row':n,
                      'id_revision':vals[0].strip(),
                      'content_type':vals[2].strip(),
                      'decision':vals[4].strip(),
                      'identifier_is_target':ident==target,
                      'observations_has_event_id':event_id in obs,
                      'reviewer_is_automation':rev==reviewer,
                      'estado_proceso':vals[9].strip(),
                      'coincidencias':vals[11].strip(),
                      'resultado':vals[12].strip(),
                  })

          exact_response_matches=[r for r in response_rows if r['identifier_is_target'] and r['observations_has_event_id'] and r['reviewer_is_automation']]
          exact_audit_matches=[r for r in audit_rows if r['identifier_is_target'] and r['observations_has_event_id'] and r['reviewer_is_automation']]
          out={
              'ok':True,
              'response_row_count':len(responses)-1,
              'post_baseline_response_rows':response_rows,
              'exact_response_match_count':len(exact_response_matches),
              'exact_response_matches':exact_response_matches,
              'exact_audit_match_count':len(exact_audit_matches),
              'exact_audit_matches':exact_audit_matches,
              'write_performed':False,
          }
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

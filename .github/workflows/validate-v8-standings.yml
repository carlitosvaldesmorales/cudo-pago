name: CUDO V8 - certificar tabla canónica ANFA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'preview-v8/partidos/**'
      - 'preview-v8/shared/standings.js'
      - 'preview-v8/shared/standings.css'
      - '.github/workflows/validate-v8-standings.yml'
  push:
    branches: [main]
    paths:
      - 'preview-v8/partidos/**'
      - 'preview-v8/shared/standings.js'
      - 'preview-v8/shared/standings.css'
      - '.github/workflows/validate-v8-standings.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validar renderer y autoridad única
        shell: bash
        run: |
          set -euo pipefail
          node --check preview-v8/shared/standings.js
          grep -Fq "/api/v1/public-standings" preview-v8/shared/standings.js
          grep -Fq "/api/v1/series-results" preview-v8/shared/standings.js
          grep -Fq "public-standings-v2" preview-v8/shared/standings.js
          grep -Fq "adjustment_points" preview-v8/shared/standings.js
          grep -Fq "/stream/ws/" preview-v8/shared/standings.js
          grep -Fq "visibilitychange" preview-v8/shared/standings.js
          grep -Fq "lastRefresh" preview-v8/shared/standings.js
          grep -Fq "standings.js?v=20261020-canonical02" preview-v8/partidos/index.html
          if grep -Fq "generalComplete" preview-v8/shared/standings.js; then
            echo 'No se permite descartar una jornada completa porque una serie no puntúe.' >&2
            exit 1
          fi
          if grep -Fq "anfa-chepica-2026-series-results.json" preview-v8/shared/standings.js; then
            echo 'La tabla no puede volver al snapshot estático como autoridad.' >&2
            exit 1
          fi
      - name: Validar contrato runtime canónico
        shell: bash
        run: |
          set -euo pipefail
          API='https://cudo-sports-event-bus.carlos-valdes-morales.workers.dev/api/v1/public-standings'
          curl -LfsS "$API?qa=${GITHUB_SHA}" -o /tmp/standings.json
          test "$(jq -r '.ok' /tmp/standings.json)" = 'true'
          test "$(jq -r '.contract' /tmp/standings.json)" = 'public-standings-v2'
          test "$(jq -r '.rules.only_verified_results' /tmp/standings.json)" = 'true'
          test "$(jq -r '.rules.points_by_series.TERCERA.win' /tmp/standings.json)" = '2'
          test "$(jq -r '.rules.points_by_series.SEGUNDA.win' /tmp/standings.json)" = '3'
          test "$(jq -r '.rules.points_by_series.PRIMERA.win' /tmp/standings.json)" = '4'
          test "$(jq -r '.rules.points_by_series.SENIOR.win' /tmp/standings.json)" = '3'
          test "$(jq '[.groups[]|select(.group_id=="A")] | length' /tmp/standings.json)" = '1'
          test "$(jq '[.groups[]|select(.group_id=="B")] | length' /tmp/standings.json)" = '1'

  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Preparar evidencia
        run: |
          mkdir -p qa-standings/screens
          echo 'Evidencia TABLA-CANONICAL-01' > qa-standings/README.txt
      - name: Esperar publicación canónica
        shell: bash
        run: |
          set -euo pipefail
          PAGE="https://cudo.cl/preview-v8/partidos/?qa=${GITHUB_SHA}"
          for i in $(seq 1 50); do
            if curl -LfsS "$PAGE" -o /tmp/partidos.html \
              && grep -q 'standings.js?v=20261020-canonical02' /tmp/partidos.html \
              && grep -q 'id="champStandings"' /tmp/partidos.html; then
              exit 0
            fi
            sleep 6
          done
          echo 'La tabla canónica no apareció en producción dentro de la ventana de espera.' >&2
          exit 1
      - name: Validar renderer público exacto
        shell: bash
        run: |
          set -euo pipefail
          curl -LfsS "https://cudo.cl/preview-v8/shared/standings.js?v=20261020-canonical02&qa=${GITHUB_SHA}" -o /tmp/standings-public.js
          grep -Fq '/api/v1/public-standings' /tmp/standings-public.js
          grep -Fq 'public-standings-v2' /tmp/standings-public.js
          grep -Fq '<th>PJ</th><th>PTS</th><th>AJ</th><th>3ª</th><th>2ª</th><th>1ª</th>' /tmp/standings-public.js
          grep -Fq '<th>PJ</th><th>PTS</th><th>AJ</th><th>G</th><th>E</th><th>P</th>' /tmp/standings-public.js
          cp /tmp/standings-public.js qa-standings/standings-public.js
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Playwright sin apt
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Certificar DOM contra proyección canónica
        shell: bash
        run: |
          cat > check-standings.mjs <<'NODE'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          const api='https://cudo-sports-event-bus.carlos-valdes-morales.workers.dev/api/v1/public-standings';
          const canonical=await fetch(`${api}?qa=${Date.now()}`).then(async r=>{if(!r.ok)throw new Error(`api ${r.status}`);return r.json()});
          if(canonical.contract!=='public-standings-v2')throw new Error('contrato canónico inesperado');
          const expected=new Map();
          for(const group of canonical.groups||[])for(const championship of group.championships||[])expected.set(`${group.group_id}:${championship.championship_code}`,championship.rows||[]);
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN});
          const report={api,contract:canonical.contract,viewports:{}};
          const readTable=async card=>card.locator('tbody tr').evaluateAll(rs=>rs.map(r=>{const c=[...r.querySelectorAll('td')].map(x=>x.textContent.trim());return {position:+c[0],name:c[1],played:+c[2],points:+c[3],adjustment:+c[4],cells:c}}));
          for(const vp of [{name:'mobile',width:390,height:844,dpr:2},{name:'desktop',width:1440,height:1000,dpr:1}]){
            const page=await browser.newPage({viewport:{width:vp.width,height:vp.height},deviceScaleFactor:vp.dpr});
            const pageErrors=[];page.on('pageerror',e=>pageErrors.push(e.message));
            await page.goto(`https://cudo.cl/preview-v8/partidos/?qa=${Date.now()}`,{waitUntil:'networkidle',timeout:90000});
            await page.locator('#champStandings .stand-card').first().waitFor({state:'visible'});
            const source=await page.locator('#champStandings').getAttribute('data-result-source');
            if(source!=='public-standings-v2')throw new Error(`${vp.name}: fuente ${source}`);
            const headers=await page.locator('#champStandings .stand-card').evaluateAll(cards=>cards.map(c=>[...c.querySelectorAll('thead th')].map(x=>x.textContent.trim()).join('|')));
            if(headers[0]!=='Pos.|Club|PJ|PTS|AJ|3ª|2ª|1ª')throw new Error(`${vp.name}: header General ${headers[0]}`);
            if(headers[1]!=='Pos.|Club|PJ|PTS|AJ|G|E|P')throw new Error(`${vp.name}: header Senior ${headers[1]}`);
            const vpReport={groups:{},headers,pageErrors};
            for(const group of ['A','B']){
              await page.locator(`[data-stand-group="${group}"]`).click();
              await page.waitForFunction(g=>document.querySelector('#standGroupLabel')?.textContent.trim()===`Grupo ${g}`,group);
              const cards=page.locator('#standTables .stand-card');
              const actual={PRINCIPAL:await readTable(cards.nth(0)),SENIOR:await readTable(cards.nth(1))};
              for(const code of ['PRINCIPAL','SENIOR']){
                const exp=expected.get(`${group}:${code}`)||[];
                if(actual[code].length!==exp.length)throw new Error(`${vp.name} ${group} ${code}: filas ${actual[code].length}/${exp.length}`);
                for(const er of exp){
                  const ar=actual[code].find(x=>x.name===er.team_name);
                  if(!ar)throw new Error(`${vp.name} ${group} ${code}: falta ${er.team_name}`);
                  for(const [key,ev] of [['position',er.position],['played',er.played_matchdays],['points',er.points],['adjustment',er.adjustment_points]]){
                    if(ar[key]!==Number(ev||0))throw new Error(`${vp.name} ${group} ${code} ${er.team_name} ${key}: ${ar[key]}/${ev}`);
                  }
                }
              }
              vpReport.groups[group]=actual;
            }
            if(pageErrors.length)throw new Error(`${vp.name}: ${pageErrors.join(' | ')}`);
            await page.locator('[data-stand-group="A"]').click();
            await page.locator('#champStandings').screenshot({path:`qa-standings/screens/tablas-${vp.name}-grupoA.png`});
            await page.locator('[data-stand-group="B"]').click();
            await page.locator('#champStandings').screenshot({path:`qa-standings/screens/tablas-${vp.name}-grupoB.png`});
            report.viewports[vp.name]=vpReport;
            await page.close();
          }
          fs.writeFileSync('qa-standings/standings-report.json',JSON.stringify(report,null,2));
          await browser.close();
          NODE
          node check-standings.mjs
      - name: Generar certificado
        shell: bash
        run: |
          cat > qa-standings/CERTIFICADO.txt <<EOF
          CUDO V8 — TABLA CANÓNICA ANFA CHÉPICA 2026
          Sitio: https://cudo.cl/preview-v8/partidos/#champStandings
          Commit: ${GITHUB_SHA}
          Estado técnico: CONFORME
          Autoridad: Sports Event Bus / public-standings-v2
          Ajustes administrativos: visibles como AJ y aplicados por backend canónico
          Posiciones, PJ y PTS: comparados contra runtime canónico
          Grupo A y Grupo B: VALIDADO
          EOF
      - name: Publicar evidencia certificable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cudo-v8-tabla-canonical-${{ github.run_number }}
          path: qa-standings/
          if-no-files-found: error
          retention-days: 30

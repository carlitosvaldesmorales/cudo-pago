name: CUDO Review Event Observer

on:
  workflow_run:
    workflows: ['CUDO Review Engine']
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  certify-real-form-event:
    if: >-
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.conclusion == 'success' &&
      contains(github.event.workflow_run.display_title, 'apps_script_form_submit')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_CREATED_AT: ${{ github.event.workflow_run.created_at }}
      SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_TITLE: ${{ github.event.workflow_run.display_title }}
      CUDO_REVIEW_RUN_LOG: /tmp/review-run.log
      CUDO_REVIEW_EVENT_EVIDENCE_DIR: /tmp/cudo-review-event-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download completed Review Engine logs
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/logs" \
            -o /tmp/review-run-logs.zip
          unzip -p /tmp/review-run-logs.zip > "$CUDO_REVIEW_RUN_LOG"

      - name: Certificar evento real end-to-end sin polling
        run: node qa-v8-google/tools/review_event_observer.mjs

      - name: Validar evidencia event-driven
        shell: bash
        run: |
          set -euo pipefail
          test -s "$CUDO_REVIEW_EVENT_EVIDENCE_DIR/event-driven-latest.json"
          test -s "$CUDO_REVIEW_EVENT_EVIDENCE_DIR/event-driven-latest.md"
          ! grep -Eq '^\s*schedule\s*:' .github/workflows/cudo-review-engine.yml
          ! grep -Eq '\bcron\s*:' .github/workflows/cudo-review-engine.yml

      - name: Publicar evidencia de certificación
        uses: actions/upload-artifact@v4
        with:
          name: cudo-review-event-driven-${{ github.event.workflow_run.id }}
          path: /tmp/cudo-review-event-evidence/
          if-no-files-found: error
          retention-days: 30

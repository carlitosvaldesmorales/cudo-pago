name: Validate Consumable Module Gate

on:
  pull_request:
    branches:
      - feature/sports-event-bus-v1
  push:
    branches:
      - feature/sports-event-bus-v1
      - architecture/consumable-module-gate-v1
      - fix/consumable-module-runtime-gate-v2
      - architecture/canonical-modules-event-driven-v1
      - feature/results-register-canonical-stream-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate module maturity invariants
        run: |
          set -euo pipefail
          node --check scripts/validate-module-registry.mjs
          node scripts/validate-module-registry.mjs
      - name: Self-test hard runtime lock
        run: |
          set -euo pipefail
          cp docs/product/module-registry.json /tmp/module-registry.json
          restore_registry(){ cp /tmp/module-registry.json docs/product/module-registry.json; }
          trap restore_registry EXIT
          node - <<'NODE'
          const fs=require('fs');
          const p='docs/product/module-registry.json';
          const d=JSON.parse(fs.readFileSync(p,'utf8'));
          const m=d.modules.find(x=>x.id==='RESULTS-GOVERN');
          if(!m) throw new Error('RESULTS-GOVERN missing');
          m.stage='DEFINED';
          m.visual_contract='PENDING';
          m.product_validation='PENDING';
          m.technical_implementation='EXISTS_AHEAD_OF_GATE';
          fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n');
          NODE
          if CHANGED_FILES='sports-bus/worker/result-governance-entry.js' node scripts/validate-module-registry.mjs; then
            echo 'Gate failed: synthetic pre-validation runtime advance was not blocked' >&2
            exit 1
          fi
          restore_registry
          trap - EXIT
          CHANGED_FILES='docs/architecture/canonical-capability-event-projection-v1.md' node scripts/validate-module-registry.mjs
          echo 'PASS canonical gate blocks synthetic pre-validation runtime work and allows validated module implementation'
      - name: Block PR runtime changes ahead of product validation
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED_FILES="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          printf '%s\n' "$CHANGED_FILES"
          CHANGED_FILES="$CHANGED_FILES" node scripts/validate-module-registry.mjs

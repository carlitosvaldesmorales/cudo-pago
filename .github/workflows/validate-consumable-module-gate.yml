name: Validate Consumable Module Gate

on:
  pull_request:
    branches:
      - feature/sports-event-bus-v1
  push:
    branches:
      - feature/sports-event-bus-v1
      - architecture/consumable-module-gate-v1
      - fix/consumable-module-runtime-gate-v2
      - architecture/canonical-modules-event-driven-v1
      - feature/results-register-canonical-stream-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate module maturity invariants
        run: |
          set -euo pipefail
          node --check scripts/validate-module-registry.mjs
          node scripts/validate-module-registry.mjs
      - name: Self-test hard runtime lock
        run: |
          set -euo pipefail
          # RESULTS-REGISTER is now PRODUCT_VALIDATED/QA_CERTIFIED, so its runtime is
          # intentionally allowed to advance. Prove the gate still blocks a module
          # that remains before PRODUCT_VALIDATED: RESULTS-READ.
          if CHANGED_FILES='sports-bus/worker/public-results-ux-v3.js' node scripts/validate-module-registry.mjs; then
            echo 'Gate failed: RESULTS-READ runtime advanced before PRODUCT_VALIDATED' >&2
            exit 1
          fi
          CHANGED_FILES='docs/architecture/canonical-capability-event-projection-v1.md' node scripts/validate-module-registry.mjs
          echo 'PASS canonical gate blocks pre-validation runtime work and allows validated module implementation'
      - name: Block PR runtime changes ahead of product validation
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED_FILES="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          printf '%s\n' "$CHANGED_FILES"
          CHANGED_FILES="$CHANGED_FILES" node scripts/validate-module-registry.mjs

name: CUDO Review Ingestion Identity Diagnostic

on:
  push:
    paths:
      - '.github/workflows/cudo-review-ingestion-identity-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CUDO_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_ID }}
      CUDO_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_SECRET }}
      CUDO_GOOGLE_REFRESH_TOKEN: ${{ secrets.CUDO_GOOGLE_REFRESH_TOKEN }}
    steps:
      - name: Classify rows by stable review id without exposing response values
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,urllib.parse,urllib.request
          sid='1KnC56IWf2hRxrGU4ksdO-JlzWyl2XJbhbOHKkdx4vms'
          target='CUDO-QA-SYNTH-TABLA-35027786202'
          event_id='CUDO-REVIEW-E2E-20260916-001'
          body=urllib.parse.urlencode({
            'client_id':os.environ['CUDO_GOOGLE_OAUTH_CLIENT_ID'],
            'client_secret':os.environ['CUDO_GOOGLE_OAUTH_CLIENT_SECRET'],
            'refresh_token':os.environ['CUDO_GOOGLE_REFRESH_TOKEN'],
            'grant_type':'refresh_token'}).encode()
          with urllib.request.urlopen(urllib.request.Request('https://oauth2.googleapis.com/token',data=body,headers={'Content-Type':'application/x-www-form-urlencoded'})) as r:
            token=json.load(r)['access_token']
          hdr={'Authorization':'Bearer '+token}
          def read(tab,rng):
            q=urllib.parse.quote(f"'{tab}'!{rng}",safe='')
            with urllib.request.urlopen(urllib.request.Request(f'https://sheets.googleapis.com/v4/spreadsheets/{sid}/values/{q}?majorDimension=ROWS&valueRenderOption=FORMATTED_VALUE',headers=hdr)) as r:
              return json.load(r).get('values',[])
          responses=read('Respuestas de formulario 1','A:Q')
          audit=read('AUDITORIA_REVISION','A:P')
          existing={str(r[0]).strip() for r in audit[1:] if r and str(r[0]).strip()}
          def clean(v):return str(v if v is not None else '').strip()
          def stable(row):
            vals=[clean(row[i] if i<len(row) else '') for i in range(10)]
            canonical=json.dumps(vals,separators=(',',':'),ensure_ascii=False)
            # JS JSON.stringify has no spaces; ensure_ascii false okay for same UTF-8 canonical values.
            digest=hashlib.sha256(canonical.encode('utf-8')).hexdigest()[:16].upper()
            return 'CUDO-REV-'+digest
          out=[]
          for n,row in enumerate(responses[1:],start=2):
            if not any(clean(v) for v in row):continue
            rid=stable(row)
            joined=' | '.join(clean(v) for v in row)
            out.append({
              'row':n,
              'stable_id':rid,
              'already_in_audit':rid in existing,
              'is_target':target in [clean(v) for v in row],
              'has_event_id':event_id in joined,
              'column_count':len(row)
            })
          print(json.dumps({'ok':True,'rows':out,'audit_id_count':len(existing),'write_performed':False},ensure_ascii=False,indent=2))
          PY

name: Deploy CUDO Work State Web QA

on:
  push:
    branches:
      - 'fix/cudo-root-acceptance-gate-20260921'
      - main
    paths:
      - 'qa-v8-google/apps-script/CudoWorkStateWeb.gs'
      - 'qa-v8-google/apps-script/CudoBonosCajaReadiness.gs'
      - '.github/workflows/deploy-cudo-work-state-web-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CUDO_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_ID }}
      CUDO_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_SECRET }}
      CUDO_GOOGLE_REFRESH_TOKEN: ${{ secrets.CUDO_GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy work-state source into existing private CUDO Apps Script project
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,urllib.parse,urllib.request,urllib.error,sys,re

          sid='1NI73jgr_PFvrsHy27ejE_kLbTWwLbM1Y8Nyc6mRaWlcCaLlZrpEB3Ud8'
          source=pathlib.Path('qa-v8-google/apps-script/CudoWorkStateWeb.gs').read_text()
          cash_source=pathlib.Path('qa-v8-google/apps-script/CudoBonosCajaReadiness.gs').read_text()

          body=urllib.parse.urlencode({
            'client_id':os.environ['CUDO_GOOGLE_OAUTH_CLIENT_ID'],
            'client_secret':os.environ['CUDO_GOOGLE_OAUTH_CLIENT_SECRET'],
            'refresh_token':os.environ['CUDO_GOOGLE_REFRESH_TOKEN'],
            'grant_type':'refresh_token'
          }).encode()
          with urllib.request.urlopen(urllib.request.Request(
            'https://oauth2.googleapis.com/token',
            data=body,
            headers={'Content-Type':'application/x-www-form-urlencoded'}
          )) as r:
            access=json.load(r)['access_token']

          def req(url,method='GET',payload=None):
            q=urllib.request.Request(
              url,
              data=None if payload is None else json.dumps(payload).encode(),
              headers={'Authorization':'Bearer '+access,'Content-Type':'application/json'},
              method=method
            )
            try:
              with urllib.request.urlopen(q,timeout=35) as r:
                raw=r.read()
                return json.loads(raw) if raw else {}
            except urllib.error.HTTPError as error:
              # Only the Google error classification is shown: never tokens,
              # authorization headers, input payload, contacts or raw source.
              try:
                payload_error=json.loads(error.read(8192)).get('error',{})
              except (ValueError,UnicodeError):
                payload_error={}
              detail=str(payload_error.get('message','UNSPECIFIED_GOOGLE_API_ERROR'))
              detail=re.sub(r'[A-Za-z0-9_-]{60,}','[REDACTED]',detail)[:240]
              method_name=method if method in ('GET','PUT','POST') else 'UNKNOWN'
              operation='CONTENT_UPDATE' if '/content' in url else (
                'DEPLOYMENT_UPDATE' if '/deployments/' in url else 'GOOGLE_APPS_SCRIPT_API')
              print(json.dumps({'contract':'CUDO_GOOGLE_APPS_SCRIPT_PROVIDER_ERROR_V1',
                'operation':operation,'method':method_name,'http':error.code,
                'status':str(payload_error.get('status','UNKNOWN'))[:48],
                'reason':detail,'production_money_write':False}),file=sys.stderr)
              raise SystemExit('CUDO_GOOGLE_API_REJECTION_FAIL_CLOSED')

          base=f'https://script.googleapis.com/v1/projects/{sid}'
          # Keep the SAME private deployment already linked by CUDO.
          # Google Scripts deployments.update: PUT with deploymentConfig.
          stable='AKfycbxae8ZOaPJElvF9cTa0EdDzb-KBm4nItqHSnUdZngQ2nRnEEy3nX3AJMQHsySt5lE99Sw'
          deployments=req(base+'/deployments?pageSize=200').get('deployments',[])
          existing=[d for d in deployments if d.get('deploymentId')==stable]
          if len(existing)!=1:
            raise SystemExit('Fail closed: original CUDO work-state deployment not found')
          previous=existing[0].get('deploymentConfig') or {}
          if previous.get('scriptId')!=sid or previous.get('manifestFileName')!='appsscript':
            raise SystemExit('Fail closed: original CUDO deployment identity changed')
          current=req(base+'/content')
          files=[]
          manifest=None
          for f in current.get('files',[]):
            if f.get('name') in ('CudoWorkStateWeb','CudoBonosCajaReadiness'):
              continue
            if f.get('name')=='appsscript' and f.get('type')=='JSON':
              manifest=json.loads(f.get('source') or '{}')
              continue
            files.append({'name':f['name'],'type':f['type'],'source':f.get('source','')})

          if manifest is None:
            raise SystemExit('Fail closed: Apps Script manifest missing')
          manifest['timeZone']='America/Santiago'
          manifest['webapp']={'access':'MYSELF','executeAs':'USER_DEPLOYING'}
          files.append({'name':'appsscript','type':'JSON','source':json.dumps(manifest,separators=(',',':'))})
          files.append({'name':'CudoWorkStateWeb','type':'SERVER_JS','source':source})
          files.append({'name':'CudoBonosCajaReadiness','type':'SERVER_JS','source':cash_source})

          req(base+'/content','PUT',{'files':files})
          verify=req(base+'/content')
          found=[f for f in verify.get('files',[]) if f.get('name')=='CudoWorkStateWeb']
          if len(found)!=1 or found[0].get('source')!=source:
            raise SystemExit('Fail closed: CudoWorkStateWeb source verification failed')
          cash_found=[f for f in verify.get('files',[]) if f.get('name')=='CudoBonosCajaReadiness']
          if len(cash_found)!=1 or cash_found[0].get('source')!=cash_source:
            raise SystemExit('Fail closed: CUDO institutional cash preflight source verification failed')
          if 'SpreadsheetApp' not in cash_source or 'LockService.getScriptLock' not in cash_source:
            raise SystemExit('Fail closed: CUDO institution preflight missing lock/source')


          version=req(base+'/versions','POST',{
            'description':'CUDO Work State QA '+os.environ.get('GITHUB_SHA','')[:12]
          })
          vn=version['versionNumber']
          dep=req(base+'/deployments/'+stable,'PUT',{
            'deploymentConfig':{
              'scriptId':sid,
              'versionNumber':vn,
              'manifestFileName':'appsscript',
              'description':'CUDO Work State private QA · caja read-only'
            }
          })
          did=dep['deploymentId']
          if did!=stable or dep.get('deploymentConfig',{}).get('versionNumber')!=vn:
            raise SystemExit('Fail closed: existing CUDO Work State deployment not updated')
          verify_deploy=req(base+'/deployments/'+stable)
          if verify_deploy.get('deploymentConfig',{}).get('versionNumber')!=vn:
            raise SystemExit('Fail closed: deployment revision readback mismatch')
          live=req(base+'/content?versionNumber='+str(vn))
          if not any(f.get('name')=='CudoBonosCajaReadiness' and
                     'CUDO_BONOS_CASH_EXISTING_SCRIPT_PREFLIGHT_V1' in f.get('source','')
                     for f in live.get('files',[])):
            raise SystemExit('Fail closed: live stable deployment does not include CUDO cash preflight')
          if not any(f.get('name')=='CudoWorkStateWeb' and
                     'cudoBonosCajaReadiness_()' in f.get('source','')
                     for f in live.get('files',[])):
            raise SystemExit('Fail closed: live Work State panel does not call same cash preflight')
          url='https://script.google.com/macros/s/'+did+'/exec?view=work'
          out={
            'ok':True,
            'scriptId':sid,
            'versionNumber':vn,
            'deploymentId':did,
            'workWebUrl':url,
            'access':'MYSELF',
            'executeAs':'USER_DEPLOYING',
            'sourceVerified':True,
            'existingDeploymentUpdated':True,
            'newProjectCreated':False,
            'newDeploymentCreated':False,
            'cash_writer_enabled':False,
            'institutional_operator_verified_at_deploy':False,
            'production_write':False,
            'live_transition_executed':False
          }
          pathlib.Path('work-state-web-deployment.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY

      - name: Confirmar versión LIVE exacta del mismo deployment
        id: verify
        env:
          CUDO_REQUIRE_CASH_LIVE: 'true'
        run: node qa-v8-google/tools/readback_existing_work_script_project.mjs

      - name: Recibo técnico persistente en este mismo workflow CUDO
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          LIVE_VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          {
            echo '## CUDO_EXISTING_WORK_STATE_DEPLOYMENT_RECEIPT_V1'
            echo "- despliegue_existente: ${DEPLOY_OUTCOME}"
            echo "- version_live_verificada: ${LIVE_VERIFY_OUTCOME}"
            echo '- dinero_productivo: NO ACTIVADO'
            echo '- proyecto_o_deployment_nuevo: NO'
            echo '- cuenta_tesorero_nueva: NO'
            echo '- fuente: mismo Apps Script institucional CUDO'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar evidencia de despliegue
        continue-on-error: true # GitHub Actions artifact quota is separate from deployment verification
        uses: actions/upload-artifact@v4
        with:
          name: cudo-work-state-web-qa-${{ github.run_id }}
          path: work-state-web-deployment.json
          retention-days: 30

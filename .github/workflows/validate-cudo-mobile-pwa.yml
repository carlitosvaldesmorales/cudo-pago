name: Validate CUDO Mobile PWA

on:
  pull_request:
    branches: [main]
    paths:
      - 'preview-v8/manifest.webmanifest'
      - 'preview-v8/sw.js'
      - 'preview-v8/offline.html'
      - 'preview-v8/icons/**'
      - 'preview-v8/shared/pwa.js'
      - 'preview-v8/index.html'
      - 'preview-v8/admin/index.html'
      - 'preview-v8/tools/validate_pwa_shell.mjs'
      - '.github/workflows/validate-cudo-mobile-pwa.yml'

permissions:
  contents: write

jobs:
  pwa-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validar sintaxis de shell móvil
        run: |
          set -euo pipefail
          node --check preview-v8/sw.js
          node --check preview-v8/shared/pwa.js
          node --check preview-v8/tools/validate_pwa_shell.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generar iconos determinísticos desde escudo oficial
        run: |
          set -euo pipefail
          pip install pillow==11.3.0
          mkdir -p generated-pwa-icons
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          src=Path('preview-v8/media/clubes/union-orilla.png')
          if not src.exists():
              raise SystemExit('No existe el escudo oficial preview-v8/media/clubes/union-orilla.png')
          image=Image.open(src).convert('RGBA')
          if image.size != (512,512):
              raise SystemExit(f'Escudo oficial inesperado: {image.size}')
          for size,name in [(180,'apple-touch-icon.png'),(192,'icon-192.png'),(512,'icon-512.png')]:
              out=image if size==512 else image.resize((size,size),Image.Resampling.LANCZOS)
              out.save(Path('generated-pwa-icons')/name,optimize=True)
              print(name,out.size)
          PY

      - name: Publicar iconos generados como evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cudo-mobile-pwa-icons-${{ github.run_id }}
          path: generated-pwa-icons/
          if-no-files-found: warn
          retention-days: 7

      - name: Bootstrap versionado de iconos oficiales
        if: github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview-v8/icons
          cp generated-pwa-icons/apple-touch-icon.png preview-v8/icons/apple-touch-icon.png
          cp generated-pwa-icons/icon-192.png preview-v8/icons/icon-192.png
          cp generated-pwa-icons/icon-512.png preview-v8/icons/icon-512.png
          git add preview-v8/icons
          if git diff --cached --quiet; then
            echo 'Iconos PWA ya coinciden con el escudo oficial.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'CUDO App: generar iconos PWA desde escudo oficial'
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Verificar iconos versionados contra fuente oficial
        run: |
          set -euo pipefail
          for f in apple-touch-icon.png icon-192.png icon-512.png; do
            test -f "preview-v8/icons/$f" || { echo "::error::Falta preview-v8/icons/$f"; exit 1; }
            cmp "generated-pwa-icons/$f" "preview-v8/icons/$f"
          done

      - name: Validar contrato PWA
        run: node preview-v8/tools/validate_pwa_shell.mjs

      - name: Instalar Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validar registro Service Worker en navegador real
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/cudo-pwa-http.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4173/preview-v8/ >/dev/null && break
            sleep 1
          done
          cat > /tmp/cudo-pwa-check.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          const errors=[];
          page.on('pageerror',e=>errors.push(e.message));
          await page.goto('http://127.0.0.1:4173/preview-v8/',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.CUDO_PWA&&window.CUDO_PWA.ready,{timeout:15000});
          await page.evaluate(()=>window.CUDO_PWA.ready);
          const state=await page.evaluate(async()=>{
            const manifestLink=document.querySelector('link[rel="manifest"]')?.getAttribute('href');
            const manifest=await fetch(manifestLink).then(r=>r.json());
            const reg=await navigator.serviceWorker.ready;
            return {manifestLink,scope:reg.scope,startUrl:manifest.start_url,display:manifest.display,error:window.CUDO_PWA.error};
          });
          console.log(JSON.stringify(state,null,2));
          if(errors.length) throw new Error(`page errors: ${errors.join(' | ')}`);
          if(state.error) throw new Error(state.error);
          if(state.scope!=='http://127.0.0.1:4173/preview-v8/') throw new Error(`scope inválido ${state.scope}`);
          if(state.startUrl!=='/preview-v8/'||state.display!=='standalone') throw new Error('manifest runtime inválido');
          await browser.close();
          NODE
          node /tmp/cudo-pwa-check.mjs

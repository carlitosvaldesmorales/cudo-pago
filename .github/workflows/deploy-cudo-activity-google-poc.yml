name: Deploy CUDO Club OS Activity Google POC

on:
  push:
    branches:
      - qa/club-os-activity-google-poc-20260917
    paths:
      - 'qa-v8-google/apps-script/CudoActivityQaWeb.gs'
      - 'qa-v8-google/apps-script/CudoActivityQaView.html'
      - '.github/workflows/deploy-cudo-activity-google-poc.yml'
  workflow_dispatch:

concurrency:
  group: cudo-activity-google-poc-apps-script
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CUDO_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_ID }}
      CUDO_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_SECRET }}
      CUDO_GOOGLE_REFRESH_TOKEN: ${{ secrets.CUDO_GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy isolated synthetic activity web app and certify Google roundtrip
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,re,time,urllib.parse,urllib.request,urllib.error

          SCRIPT_ID='1NI73jgr_PFvrsHy27ejE_kLbTWwLbM1Y8Nyc6mRaWlcCaLlZrpEB3Ud8'
          SHEET_ID='1Yf2JeTLY6_Vk9URlV2FoXhuKWyJGcXEePx1OmApEYqA'
          SOURCE_PATH=pathlib.Path('qa-v8-google/apps-script/CudoActivityQaWeb.gs')
          HTML_PATH=pathlib.Path('qa-v8-google/apps-script/CudoActivityQaView.html')

          token_body=urllib.parse.urlencode({
            'client_id':os.environ['CUDO_GOOGLE_OAUTH_CLIENT_ID'],
            'client_secret':os.environ['CUDO_GOOGLE_OAUTH_CLIENT_SECRET'],
            'refresh_token':os.environ['CUDO_GOOGLE_REFRESH_TOKEN'],
            'grant_type':'refresh_token',
          }).encode()
          with urllib.request.urlopen(urllib.request.Request('https://oauth2.googleapis.com/token',data=token_body,headers={'Content-Type':'application/x-www-form-urlencoded'})) as r:
            access=json.load(r)['access_token']

          def api(url,method='GET',payload=None):
            req=urllib.request.Request(url,data=None if payload is None else json.dumps(payload).encode(),headers={'Authorization':'Bearer '+access,'Content-Type':'application/json'},method=method)
            with urllib.request.urlopen(req,timeout=90) as r:
              raw=r.read()
              return json.loads(raw) if raw else {}

          def http_json(url,method='GET',payload=None):
            body=None if payload is None else json.dumps(payload).encode()
            req=urllib.request.Request(url,data=body,headers={'Content-Type':'application/json','User-Agent':'CUDO-QA-Certifier'},method=method)
            with urllib.request.urlopen(req,timeout=30) as r:
              return json.loads(r.read().decode())

          base=f'https://script.googleapis.com/v1/projects/{SCRIPT_ID}'
          current=api(base+'/content')
          original_files=[{'name':f['name'],'type':f['type'],'source':f.get('source','')} for f in current.get('files',[])]
          if not original_files:
            raise SystemExit('Apps Script project content is empty')

          source=SOURCE_PATH.read_text()
          html_source=HTML_PATH.read_text()
          public_files=[]
          manifest=None
          removed_handlers=[]
          for f in original_files:
            if f['name']=='appsscript' and f['type']=='JSON':
              manifest=json.loads(f.get('source') or '{}')
              continue
            if f['type']=='SERVER_JS' and re.search(r'\bfunction\s+(doGet|doPost)\s*\(',f.get('source','')):
              removed_handlers.append(f['name'])
              continue
            if f['name'] in ('CudoActivityQaWeb','CudoActivityQaView'):
              continue
            public_files.append(f)
          if manifest is None: manifest={}
          manifest['timeZone']='America/Santiago'
          manifest['webapp']={'access':'ANYONE_ANONYMOUS','executeAs':'USER_DEPLOYING'}
          public_files.append({'name':'appsscript','type':'JSON','source':json.dumps(manifest,separators=(',',':'))})
          public_files.append({'name':'CudoActivityQaWeb','type':'SERVER_JS','source':source})
          public_files.append({'name':'CudoActivityQaView','type':'HTML','source':html_source})

          def sheet_values(a1):
            enc=urllib.parse.quote(a1,safe='!:$')
            return api(f'https://sheets.googleapis.com/v4/spreadsheets/{SHEET_ID}/values/{enc}').get('values') or []

          try:
            api(base+'/content','PUT',{'files':public_files})
            version=api(base+'/versions','POST',{'description':'CUDO Club OS Activity Google QA '+os.environ.get('GITHUB_SHA','')[:12]})
            vn=version['versionNumber']
            did='AKfycbw1WjtJHJZO5RaJ6mtL6Um9afRKXArw9th-wLtUdY7qmClxvF7S3s1JUNL7-5WUjBCeDQ'
            dep=api(base+'/deployments/'+did,'PUT',{'deploymentConfig':{'scriptId':SCRIPT_ID,'versionNumber':vn,'manifestFileName':'appsscript','description':'CUDO Club OS Activity Google QA · stable deployment'}})
            web_url='https://script.google.com/macros/s/'+did+'/exec'

            registry=None
            last=None
            for attempt in range(15):
              try:
                registry=http_json(web_url+'?format=registry')
                if registry.get('ok') and len(registry.get('activities') or [])>=2:
                  break
              except Exception as exc:
                last=exc
                time.sleep(3)
            if not registry or not registry.get('ok'):
              raise SystemExit('Registry endpoint failed: '+repr(last))
            if registry.get('production_write') is not False or registry.get('provenance')!='SYNTHETIC_QA':
              raise SystemExit('Fail closed: registry provenance/production flags invalid')

            state=None
            last=None
            for attempt in range(15):
              try:
                state=http_json(web_url+'?format=json')
                if state.get('ok') and state.get('activity',{}).get('activity_id')=='QA-ACTIVITY-BINGO-002':
                  break
              except Exception as exc:
                last=exc
                time.sleep(3)
            if not state or not state.get('ok'):
              raise SystemExit('Web state endpoint failed: '+repr(last))
            if state.get('production_write') is not False or state.get('provenance')!='SYNTHETIC_QA':
              raise SystemExit('Fail closed: endpoint provenance/production flags invalid')

            before_events=len(sheet_values('EVENTOS!A2:A1000'))

            # Reset first so the acceptance case is deterministic and bounded to synthetic QA.
            reset0=http_json(web_url,'POST',{'action':'RESET_FIXTURE'})
            if not reset0.get('ok'):
              raise SystemExit('Initial RESET_FIXTURE failed: '+json.dumps(reset0))

            created=http_json(web_url,'POST',{'action':'CREATE_ACCEPTANCE_CASE'})
            if not created.get('ok') or created.get('state',{}).get('activity',{}).get('activity_id')!='QA-ACTIVITY-ACCEPTANCE-001':
              raise SystemExit('CREATE_ACCEPTANCE_CASE failed: '+json.dumps(created))

            assign=http_json(web_url,'POST',{'action':'ASSIGN_DEMO','workstreamId':'QA-WS-901','activityId':'QA-ACTIVITY-ACCEPTANCE-001'})
            if not assign.get('ok'):
              raise SystemExit('ASSIGN_DEMO failed: '+json.dumps(assign))

            reassign=http_json(web_url,'POST',{'action':'REASSIGN_DEMO','workstreamId':'QA-WS-901','activityId':'QA-ACTIVITY-ACCEPTANCE-001'})
            if not reassign.get('ok'):
              raise SystemExit('REASSIGN_DEMO failed: '+json.dumps(reassign))

            confirm=http_json(web_url,'POST',{'action':'CONFIRM','workstreamId':'QA-WS-901','activityId':'QA-ACTIVITY-ACCEPTANCE-001'})
            if not confirm.get('ok'):
              raise SystemExit('CONFIRM failed: '+json.dumps(confirm))

            blocked=http_json(web_url,'POST',{'action':'REPORT_BLOCKER','workstreamId':'QA-WS-901','activityId':'QA-ACTIVITY-ACCEPTANCE-001'})
            if not blocked.get('ok'):
              raise SystemExit('REPORT_BLOCKER failed: '+json.dumps(blocked))

            resolved=http_json(web_url,'POST',{'action':'RESOLVE_BLOCKER','workstreamId':'QA-WS-901','activityId':'QA-ACTIVITY-ACCEPTANCE-001'})
            if not resolved.get('ok'):
              raise SystemExit('RESOLVE_BLOCKER failed: '+json.dumps(resolved))

            dependency=http_json(web_url,'POST',{'action':'ADD_DEPENDENCY_DEMO','workstreamId':'QA-WS-901','activityId':'QA-ACTIVITY-ACCEPTANCE-001'})
            if not dependency.get('ok'):
              raise SystemExit('ADD_DEPENDENCY_DEMO failed: '+json.dumps(dependency))

            evidence=http_json(web_url,'POST',{'action':'ADD_EVIDENCE_DEMO','workstreamId':'QA-WS-901','activityId':'QA-ACTIVITY-ACCEPTANCE-001'})
            if not evidence.get('ok'):
              raise SystemExit('ADD_EVIDENCE_DEMO failed: '+json.dumps(evidence))

            task=http_json(web_url,'POST',{'action':'COMPLETE_TASK','taskId':'QA-TASK-901','activityId':'QA-ACTIVITY-ACCEPTANCE-001'})
            if not task.get('ok'):
              raise SystemExit('COMPLETE_TASK failed: '+json.dumps(task))

            ws_done=http_json(web_url,'POST',{'action':'COMPLETE_WORKSTREAM_DEMO','workstreamId':'QA-WS-901','activityId':'QA-ACTIVITY-ACCEPTANCE-001'})
            if not ws_done.get('ok'):
              raise SystemExit('COMPLETE_WORKSTREAM_DEMO failed: '+json.dumps(ws_done))

            closed=http_json(web_url,'POST',{'action':'CLOSE_ACTIVITY_DEMO','activityId':'QA-ACTIVITY-ACCEPTANCE-001'})
            if not closed.get('ok'):
              raise SystemExit('CLOSE_ACTIVITY_DEMO failed: '+json.dumps(closed))

            final_acceptance=http_json(web_url+'?format=json&activity=QA-ACTIVITY-ACCEPTANCE-001')
            if not final_acceptance.get('ok'):
              raise SystemExit('Final acceptance state endpoint failed')
            if final_acceptance.get('activity',{}).get('status')!='DONE':
              raise SystemExit('Acceptance activity did not close')
            ws=next((x for x in final_acceptance.get('workstreams',[]) if x.get('workstream_id')=='QA-WS-901'),None)
            if not ws or ws.get('state')!='DONE':
              raise SystemExit('Acceptance workstream did not reach DONE')
            assignment=ws.get('assignment') or {}
            if assignment.get('person_ref')!='QA-VISITOR-ALT' or assignment.get('assignment_state')!='CONFIRMED':
              raise SystemExit('Reassignment/confirmation did not persist')
            tasks=ws.get('tasks') or []
            if not tasks or any(t.get('state')!='DONE' for t in tasks):
              raise SystemExit('Acceptance tasks did not persist as DONE')

            event_types=[e.get('event_type') for e in final_acceptance.get('events',[])]
            required_event_types={
              'ACTIVITY_CREATED','ROLE_ASSIGNED','ROLE_REASSIGNED','ROLE_ACCEPTED',
              'BLOCKER_REPORTED','BLOCKER_RESOLVED','DEPENDENCY_RECORDED','EVIDENCE_ADDED',
              'TASK_COMPLETED','WORKSTREAM_COMPLETED','ACTIVITY_COMPLETED'
            }
            missing=sorted(required_event_types-set(event_types))
            if missing:
              raise SystemExit('Acceptance history missing events: '+','.join(missing))

            after_events=len(sheet_values('EVENTOS!A2:A1000'))
            if after_events < before_events + len(required_event_types):
              raise SystemExit(f'Append-only history did not grow enough: {before_events}->{after_events}')

            reset=http_json(web_url,'POST',{'action':'RESET_FIXTURE'})
            if not reset.get('ok'):
              raise SystemExit('Final RESET_FIXTURE failed: '+json.dumps(reset))
            registry_after=http_json(web_url+'?format=registry')
            if any(a.get('activity_id')=='QA-ACTIVITY-ACCEPTANCE-001' for a in registry_after.get('activities',[])):
              raise SystemExit('Acceptance fixture did not reset from operational tables')

            final_state=http_json(web_url+'?format=json')
            out={
              'ok':True,
              'webAppUrl':web_url,
              'spreadsheetId':SHEET_ID,
              'scriptId':SCRIPT_ID,
              'versionNumber':vn,
              'deploymentId':did,
              'access':'ANYONE_ANONYMOUS',
              'executeAs':'USER_DEPLOYING',
              'removedExistingWebHandlersDuringVersionBuild':removed_handlers,
              'certification':{
                'readFromGoogle':True,
                'activityRegistryVisible':True,
                'activityRegistryCount':len(registry.get('activities') or []),
                'stableDeploymentUpdated':True,
                'assignmentWritePersisted':True,
                'reassignmentWritePersisted':True,
                'blockerRoundtripPersisted':True,
                'dependencyEventPersisted':True,
                'evidenceEventPersisted':True,
                'taskCompletionPersisted':True,
                'workstreamCompletionPersisted':True,
                'activityClosurePersisted':True,
                'appendOnlyHistoryVerified':True,
                'resetPersisted':True,
                'acceptanceFixtureRemovedAfterReset':True,
                'appendOnlyEventsBefore':before_events,
                'appendOnlyEventsAfter':after_events,
                'requiredAcceptanceEvents':sorted(required_event_types),
                'productionWrite':False,
                'provenance':'SYNTHETIC_QA',
                'finalSummary':final_state.get('summary',{})
              }
            }
            pathlib.Path('club-os-activity-google-poc-deployment.json').write_text(json.dumps(out,indent=2,ensure_ascii=False))
            print(json.dumps(out,indent=2,ensure_ascii=False))
          finally:
            api(base+'/content','PUT',{'files':original_files})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: club-os-activity-google-poc-deployment
          path: club-os-activity-google-poc-deployment.json
          retention-days: 30

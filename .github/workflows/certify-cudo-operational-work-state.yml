name: Certify CUDO Operational Work State

on:
  pull_request:
    branches: [main]
    paths:
      - 'qa-v8-google/contracts/cudo-shared-object-contract-v1.json'
      - 'qa-v8-google/contracts/cudo-shared-object-fixture-v1.json'
      - 'qa-v8-google/tools/certify_shared_object_contract.mjs'
      - 'qa-v8-google/contracts/cudo-work-item-contract-v1.json'
      - 'qa-v8-google/tools/canonical_financial_core.mjs'
      - 'qa-v8-google/tools/certify_work_financial_effects.mjs'
      - 'qa-v8-google/tools/work_financial_effects.mjs'
      - 'qa-v8-google/contracts/cudo-work-financial-effect-contract-v1.json'
      - 'qa-v8-google/contracts/cudo-real-work-grass-cut-v1.json'
      - 'qa-v8-google/tools/certify_post_match_work_state.mjs'
      - 'qa-v8-google/contracts/cudo-real-work-post-match-v1.json'
      - 'qa-v8-google/tools/certify_irrigation_work_state.mjs'
      - 'qa-v8-google/contracts/cudo-real-work-irrigation-v1.json'
      - 'qa-v8-google/tools/work_item_engine.mjs'
      - 'qa-v8-google/tools/certify_work_item_engine.mjs'
      - '.github/workflows/certify-cudo-operational-work-state.yml'
      - 'qa-v8-google/operacion/**'
      - 'qa-v8-google/data/operacion.json'
  push:
    branches:
      - 'feat/cudo-operational-work-state-v1'
    paths:
      - 'qa-v8-google/contracts/cudo-shared-object-contract-v1.json'
      - 'qa-v8-google/contracts/cudo-shared-object-fixture-v1.json'
      - 'qa-v8-google/tools/certify_shared_object_contract.mjs'
      - 'qa-v8-google/contracts/cudo-work-item-contract-v1.json'
      - 'qa-v8-google/contracts/cudo-real-work-grass-cut-v1.json'
      - 'qa-v8-google/tools/work_item_engine.mjs'
      - 'qa-v8-google/tools/certify_work_item_engine.mjs'
      - '.github/workflows/certify-cudo-operational-work-state.yml'
      - 'qa-v8-google/operacion/**'
      - 'qa-v8-google/data/operacion.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate syntax
        run: |
          node --check qa-v8-google/tools/certify_shared_object_contract.mjs
          node --check qa-v8-google/tools/work_item_engine.mjs
          node --check qa-v8-google/tools/certify_work_item_engine.mjs
          node --check qa-v8-google/tools/certify_post_match_work_state.mjs
          node --check qa-v8-google/tools/certify_irrigation_work_state.mjs
          node --check qa-v8-google/tools/work_financial_effects.mjs
          node --check qa-v8-google/tools/certify_work_financial_effects.mjs
          node --check qa-v8-google/tools/certify_operational_web_projection.mjs
      - name: Re-certify shared object contract
        run: node qa-v8-google/tools/certify_shared_object_contract.mjs
      - name: Certify responsibility work state cluster
        run: node qa-v8-google/tools/certify_work_item_engine.mjs
      - name: Certify post-match operational fan-out
        run: node qa-v8-google/tools/certify_post_match_work_state.mjs
      - name: Certify seasonal irrigation work
        run: node qa-v8-google/tools/certify_irrigation_work_state.mjs
      - name: Certify completed work financial effect
        run: node qa-v8-google/tools/certify_work_financial_effects.mjs
      - name: Certify CUDO Web operational projection
        run: node qa-v8-google/tools/certify_operational_web_projection.mjs

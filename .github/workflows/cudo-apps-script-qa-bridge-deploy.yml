name: CUDO Apps Script QA Bridge Deploy

on:
  push:
    branches:
      - qa/review-event-no-prod-20260915
    paths:
      - '.github/workflows/cudo-apps-script-qa-bridge-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/qa/review-event-no-prod-20260915'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CUDO_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_ID }}
      CUDO_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_SECRET }}
      CUDO_GOOGLE_REFRESH_TOKEN: ${{ secrets.CUDO_GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy only QA-isolated bridge and preserve all other Apps Script files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.parse, urllib.request

          sid='1NI73jgr_PFvrsHy27ejE_kLbTWwLbM1Y8Nyc6mRaWlcCaLlZrpEB3Ud8'
          qa_ref='qa/review-event-no-prod-20260915'
          bridge=pathlib.Path('qa-v8-google/apps-script/CudoReviewEventBridge.gs').read_text()
          if qa_ref not in bridge:
              raise SystemExit('bridge does not contain QA dispatch ref')
          if "ref: 'main'" in bridge:
              raise SystemExit('bridge still contains direct main dispatch')

          body=urllib.parse.urlencode({
              'client_id':os.environ['CUDO_GOOGLE_OAUTH_CLIENT_ID'],
              'client_secret':os.environ['CUDO_GOOGLE_OAUTH_CLIENT_SECRET'],
              'refresh_token':os.environ['CUDO_GOOGLE_REFRESH_TOKEN'],
              'grant_type':'refresh_token'
          }).encode()
          with urllib.request.urlopen(urllib.request.Request(
              'https://oauth2.googleapis.com/token',
              data=body,
              headers={'Content-Type':'application/x-www-form-urlencoded'}
          )) as r:
              access=json.load(r)['access_token']

          url=f'https://script.googleapis.com/v1/projects/{sid}/content'
          def req(method='GET', payload=None):
              q=urllib.request.Request(
                  url,
                  data=None if payload is None else json.dumps(payload).encode(),
                  headers={'Authorization':'Bearer '+access,'Content-Type':'application/json'},
                  method=method,
              )
              with urllib.request.urlopen(q) as r:
                  raw=r.read()
                  return json.loads(raw) if raw else {}

          current=req()
          current_files=current.get('files',[])
          before={f['name']:hashlib.sha256(f.get('source','').encode()).hexdigest() for f in current_files if f.get('name')!='CudoReviewEventBridge'}
          files=[{'name':f['name'],'type':f['type'],'source':f.get('source','')} for f in current_files if f.get('name')!='CudoReviewEventBridge']
          files.append({'name':'CudoReviewEventBridge','type':'SERVER_JS','source':bridge})
          req('PUT',{'files':files})

          verify=req()
          found=[f for f in verify.get('files',[]) if f.get('name')=='CudoReviewEventBridge']
          if len(found)!=1 or found[0].get('source')!=bridge:
              raise SystemExit('QA bridge verification failed')
          after={f['name']:hashlib.sha256(f.get('source','').encode()).hexdigest() for f in verify.get('files',[]) if f.get('name')!='CudoReviewEventBridge'}
          if before != after:
              raise SystemExit('non-bridge Apps Script files changed')

          print(json.dumps({
              'ok':True,
              'script_id':sid,
              'dispatch_ref':qa_ref,
              'bridge_source_matches_qa':True,
              'file_count':len(verify.get('files',[])),
              'other_files_preserved':len(after),
              'production_v8_touched':False,
          }, indent=2))
          PY

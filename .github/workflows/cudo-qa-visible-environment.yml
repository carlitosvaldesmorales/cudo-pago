name: CUDO QA Visible Environment

on:
  push:
    branches:
      - qa/review-event-no-prod-20260915
    paths:
      - 'qa-v8-google/**'
      - 'assets/**'
      - '.github/workflows/cudo-qa-visible-environment.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cudo-qa-visible-environment
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: self-hosted
    timeout-minutes: 15
    outputs:
      public_url: ${{ steps.runtime.outputs.public_url }}
      source_commit: ${{ steps.runtime.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/review-event-no-prod-20260915
          fetch-depth: 0

      - name: Validar frontera QA antes de publicar runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'qa/review-event-no-prod-20260915'
          test "$GITHUB_REF_NAME" != 'main'
          test -f qa-v8-google/index.html
          test -f qa-v8-google/shared/site.js
          test -f qa-v8-google/data/partidos.json
          test -z "$(git status --porcelain -- preview-v8)"
          if grep -R -n -E 'cudo\.cl/preview-v8|/preview-v8/' qa-v8-google \
              --include='*.html' --include='*.js' --include='*.css' --include='*.json' \
              --exclude='QA_BUILD.json'; then
            echo '::error::El runtime QA contiene una dependencia web directa hacia preview-v8'
            exit 1
          fi

      - name: Materializar runtime QA aislado
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          RUNTIME="$HOME/.cudo-qa-visible"
          WWW="$RUNTIME/www"
          QA="$WWW/qa"
          NGINX_TMP="$RUNTIME/nginx/tmp"
          mkdir -p "$RUNTIME" "$WWW" "$RUNTIME/nginx/logs" \
            "$NGINX_TMP/client_body" "$NGINX_TMP/proxy" "$NGINX_TMP/fastcgi" \
            "$NGINX_TMP/uwsgi" "$NGINX_TMP/scgi" "$RUNTIME/cloudflared-home"

          MAIN_BEFORE="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$MAIN_BEFORE"

          rm -rf "$QA" "$WWW/assets"
          mkdir -p "$QA/data" "$QA/media" "$WWW/assets"
          cp qa-v8-google/index.html "$QA/"
          for d in club noticias partidos equipos galeria shared; do
            cp -a "qa-v8-google/$d" "$QA/$d"
          done
          cp -a qa-v8-google/media/. "$QA/media/" 2>/dev/null || true
          cp qa-v8-google/data/*.json "$QA/data/"
          cp -a assets/. "$WWW/assets/"

          SOURCE_COMMIT="$(git rev-parse HEAD)"
          cat > "$QA/QA_RUNTIME.json" <<EOF
          {
            "environment": "QA_REVIEW_ISOLATED",
            "source_branch": "qa/review-event-no-prod-20260915",
            "source_commit": "$SOURCE_COMMIT",
            "production_preview_v8_touched": false,
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          if [ -f "$RUNTIME/http.pid" ]; then
            kill "$(cat "$RUNTIME/http.pid")" 2>/dev/null || true
            rm -f "$RUNTIME/http.pid"
          fi
          unset RUNNER_TRACKING_ID || true
          nohup python3 -m http.server 19094 --bind 127.0.0.1 --directory "$WWW" \
            > "$RUNTIME/http.log" 2>&1 &
          echo $! > "$RUNTIME/http.pid"

          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:19094/qa/ >/tmp/cudo-qa-home.html; then break; fi
            sleep 1
          done
          grep -q 'QA · V8 · BRAND' /tmp/cudo-qa-home.html
          curl -fsS --max-time 5 http://127.0.0.1:19094/qa/data/partidos.json | python3 -m json.tool >/dev/null

          if [ -f "$RUNTIME/nginx/nginx.pid" ]; then
            kill "$(cat "$RUNTIME/nginx/nginx.pid")" 2>/dev/null || true
            rm -f "$RUNTIME/nginx/nginx.pid"
          fi

          printf 'cudo-auth:{SHA}S2wrH8KF+EqgnxvRKbEshmEIPyg=\n' > "$RUNTIME/htpasswd"
          cat > "$RUNTIME/nginx.conf" <<EOF
          worker_processes 1;
          pid $RUNTIME/nginx/nginx.pid;
          error_log $RUNTIME/nginx/logs/error.log notice;
          events { worker_connections 256; }
          http {
            access_log $RUNTIME/nginx/logs/access.log;
            client_body_temp_path $NGINX_TMP/client_body;
            proxy_temp_path $NGINX_TMP/proxy;
            fastcgi_temp_path $NGINX_TMP/fastcgi;
            uwsgi_temp_path $NGINX_TMP/uwsgi;
            scgi_temp_path $NGINX_TMP/scgi;
            server {
              listen 127.0.0.1:18094;
              server_name localhost;
              auth_basic "CUDO QA Review";
              auth_basic_user_file $RUNTIME/htpasswd;
              add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
              add_header Cache-Control "no-store, max-age=0" always;
              location = / { return 302 /qa/; }
              location / {
                proxy_pass http://127.0.0.1:19094;
                proxy_http_version 1.1;
                proxy_set_header Host \$host;
                proxy_set_header X-Forwarded-Proto \$scheme;
              }
            }
          }
          EOF
          /usr/sbin/nginx -e "$RUNTIME/nginx/logs/error.log" -c "$RUNTIME/nginx.conf" -p "$RUNTIME/nginx/"
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:18094/ || true)" = '401'

          PUBLIC_URL=''
          if [ -f "$RUNTIME/cloudflared.pid" ] && kill -0 "$(cat "$RUNTIME/cloudflared.pid")" 2>/dev/null && [ -f "$RUNTIME/public_url" ]; then
            PUBLIC_URL="$(cat "$RUNTIME/public_url")"
          else
            rm -f "$RUNTIME/cloudflared.pid" "$RUNTIME/public_url"
            CLOUDFLARED="$(command -v cloudflared || true)"
            if [ -z "$CLOUDFLARED" ]; then
              for p in $(pgrep -x cloudflared 2>/dev/null || true); do
                candidate="$(readlink -f "/proc/$p/exe" 2>/dev/null || true)"
                if [ -n "$candidate" ] && [ -x "$candidate" ]; then CLOUDFLARED="$candidate"; break; fi
              done
            fi
            test -n "$CLOUDFLARED"
            : > "$RUNTIME/cloudflared.log"
            HOME="$RUNTIME/cloudflared-home" nohup "$CLOUDFLARED" tunnel --no-autoupdate \
              --url http://127.0.0.1:18094 > "$RUNTIME/cloudflared.log" 2>&1 &
            echo $! > "$RUNTIME/cloudflared.pid"
            for i in $(seq 1 60); do
              PUBLIC_URL="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' "$RUNTIME/cloudflared.log" | tail -n1 || true)"
              [ -n "$PUBLIC_URL" ] && break
              sleep 2
            done
            test -n "$PUBLIC_URL"
            printf '%s\n' "$PUBLIC_URL" > "$RUNTIME/public_url"
          fi

          MAIN_AFTER="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$MAIN_BEFORE" = "$MAIN_AFTER"
          test -z "$(git status --porcelain -- preview-v8)"

          echo "public_url=$PUBLIC_URL" >> "$GITHUB_OUTPUT"
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "QA_VISIBLE_SOURCE_COMMIT=$SOURCE_COMMIT"
          echo "QA_VISIBLE_PUBLIC_URL=$PUBLIC_URL"
          echo "PRODUCTION_MAIN_UNCHANGED=$MAIN_AFTER"

  external-probe:
    needs: materialize
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Certificar puerta QA desde Internet
        shell: bash
        env:
          PUBLIC_URL: ${{ needs.materialize.outputs.public_url }}
          SOURCE_COMMIT: ${{ needs.materialize.outputs.source_commit }}
        run: |
          set -euo pipefail
          test -n "$PUBLIC_URL"
          CODE='000'
          for i in $(seq 1 45); do
            CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$PUBLIC_URL" || true)"
            [ "$CODE" = '401' ] && break
            sleep 2
          done
          echo "source_commit=$SOURCE_COMMIT"
          echo "public_http_without_credentials=$CODE"
          test "$CODE" = '401'

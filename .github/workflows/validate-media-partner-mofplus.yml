name: Validate Media Partner MOF+

on:
  pull_request:
    branches:
      - feature/sports-event-bus-v1
    paths:
      - 'sports-bus/migrations/0020_media_partner_correspondent_assignments.sql'
      - 'sports-bus/worker/media-partner-correspondent-entry.js'
      - 'sports-bus/worker/media-partner-live-event-entry.js'
      - 'sports-bus/worker/media-partner-enrollment-entry.js'
      - 'sports-bus/worker/access-control.js'
      - 'sports-bus/cors-entry.js'
      - 'qa/telegram/media-partner-mofplus-harness.mjs'
      - '.github/workflows/validate-media-partner-mofplus.yml'
  push:
    branches:
      - feature/sports-event-bus-v1
      - feature/chepica-play-correspondents-hub-v1
    paths:
      - 'sports-bus/migrations/0020_media_partner_correspondent_assignments.sql'
      - 'sports-bus/worker/media-partner-correspondent-entry.js'
      - 'sports-bus/worker/media-partner-live-event-entry.js'
      - 'sports-bus/worker/media-partner-enrollment-entry.js'
      - 'sports-bus/worker/access-control.js'
      - 'sports-bus/cors-entry.js'
      - 'qa/telegram/media-partner-mofplus-harness.mjs'
      - '.github/workflows/validate-media-partner-mofplus.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          set -euo pipefail
          node --check sports-bus/worker/media-partner-correspondent-entry.js
          node --check sports-bus/worker/media-partner-live-event-entry.js
          node --check sports-bus/cors-entry.js
          node --check qa/telegram/media-partner-mofplus-harness.mjs
      - name: Validate distributed correspondent topology and concentrator
        run: |
          set -euo pipefail
          node qa/telegram/media-partner-mofplus-harness.mjs | tee /tmp/media-partner-mofplus.log
          grep -q 'PASS actor fidelity: one organization has two persistent synthetic correspondents' /tmp/media-partner-mofplus.log
          grep -q 'PASS organization coverage is separated from human correspondent assignment' /tmp/media-partner-mofplus.log
          grep -q 'PASS negative/scope: correspondent A cannot operate correspondent B coverage' /tmp/media-partner-mofplus.log
          grep -q 'PASS idempotency and double provenance: human + Chépica Play' /tmp/media-partner-mofplus.log
          grep -q 'PASS concentrator aggregates goals from distributed correspondents without promoting official truth' /tmp/media-partner-mofplus.log
          grep -q 'PASS unauthorized and stale callbacks are rejected' /tmp/media-partner-mofplus.log
          grep -q 'PASS canonical result remains untouched' /tmp/media-partner-mofplus.log
          grep -q 'RESULT: PASS' /tmp/media-partner-mofplus.log

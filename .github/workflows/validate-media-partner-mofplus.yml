name: Validate Media Partner MOF+

on:
  pull_request:
    branches:
      - feature/sports-event-bus-v1
    paths:
      - 'sports-bus/migrations/0021_media_partner_two_capabilities_root.sql'
      - 'sports-bus/worker/media-partner-enrollment-entry.js'
      - 'sports-bus/worker/access-control.js'
      - 'sports-bus/cors-entry.js'
      - 'qa/telegram/media-partner-mofplus-harness.mjs'
      - '.github/workflows/validate-media-partner-mofplus.yml'
  push:
    branches:
      - feature/sports-event-bus-v1
      - fix/chepica-play-two-capabilities-root-v1
    paths:
      - 'sports-bus/migrations/0021_media_partner_two_capabilities_root.sql'
      - 'sports-bus/worker/media-partner-enrollment-entry.js'
      - 'sports-bus/worker/access-control.js'
      - 'sports-bus/cors-entry.js'
      - 'qa/telegram/media-partner-mofplus-harness.mjs'
      - '.github/workflows/validate-media-partner-mofplus.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          set -euo pipefail
          node --check sports-bus/worker/access-control.js
          node --check sports-bus/worker/media-partner-enrollment-entry.js
          node --check sports-bus/cors-entry.js
          node --check qa/telegram/media-partner-mofplus-harness.mjs
      - name: Validate representative two-capability end-to-end
        run: |
          set -euo pipefail
          node qa/telegram/media-partner-mofplus-harness.mjs | tee /tmp/media-partner-mofplus.log
          grep -q 'PASS golden path enrollment reaches persistent Chépica Play identity' /tmp/media-partner-mofplus.log
          grep -q 'PASS actor fidelity: current product surface contains only consume + register result' /tmp/media-partner-mofplus.log
          grep -q 'PASS consumer golden path reads the canonical/public result projection' /tmp/media-partner-mofplus.log
          grep -q 'PASS registrar golden path stores 2–1 as Chépica Play observation and keeps canonical result empty' /tmp/media-partner-mofplus.log
          grep -q 'PASS negative/idempotency: same pending result is not duplicated' /tmp/media-partner-mofplus.log
          grep -q 'PASS negative/scope: retired coverage, correspondent and live-event flows cannot reactivate' /tmp/media-partner-mofplus.log
          grep -q 'PASS negative/authority: no live-event, governance or policy capability leaks into Chépica Play' /tmp/media-partner-mofplus.log
          grep -q 'RESULT: PASS' /tmp/media-partner-mofplus.log

name: Validate Telegram QA Harness
on:
  push:
    branches:
      - feature/telegram-qa-harness-01
      - feature/telegram-native-menu-01
      - feature/telegram-brand-name-01
      - feature/telegram-bot-migration-01
      - feature/telegram-public-ux-v2
      - feature/sports-event-bus-v1
    paths:
      - 'qa/telegram/**'
      - 'sports-bus/**'
      - '.github/workflows/validate-telegram-qa-harness.yml'
      - 'ops/TELEGRAM-QA-HARNESS-01.md'
      - 'ops/TELEGRAM-NATIVE-MENU-01.md'
      - 'ops/TELEGRAM-BOT-MIGRATION-01.md'
      - 'ops/TELEGRAM-PUBLIC-RESULTS-UX-V2.md'
      - 'ops/ux-validator/**'
  pull_request:
    branches:
      - feature/sports-event-bus-v1
    paths:
      - 'qa/telegram/**'
      - 'sports-bus/**'
      - '.github/workflows/validate-telegram-qa-harness.yml'
      - 'ops/TELEGRAM-QA-HARNESS-01.md'
      - 'ops/TELEGRAM-NATIVE-MENU-01.md'
      - 'ops/TELEGRAM-BOT-MIGRATION-01.md'
      - 'ops/TELEGRAM-PUBLIC-RESULTS-UX-V2.md'
      - 'ops/ux-validator/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check harness and Worker
        run: |
          set -euo pipefail
          node --check qa/telegram/d1-sqlite-adapter.mjs
          node --check qa/telegram/telegram-harness.mjs
          node --check qa/telegram/telegram-native-menu-harness.mjs
          node --check qa/telegram/telegram-bot-migration-harness.mjs
          node --check qa/telegram/public-results-ux-v2-harness.mjs
          node --check qa/telegram/public-results-ux-v3-harness.mjs
          node --check sports-bus/cors-entry.js
          node --check sports-bus/telegram-migration-entry.js
          node --check sports-bus/worker/public-results-ux-v2.js
          node --check sports-bus/worker/public-results-ux-v3.js
          node --check sports-bus/worker/telegram-native-menu-entry.js
          node --check sports-bus/worker/portal-entry.js
          node --check sports-bus/worker/dirigentes-lifecycle-entry.js
          node --check sports-bus/worker/dirigentes-suspended-guard-entry.js
          node --check sports-bus/worker/series-entry.js
          node --check sports-bus/worker/club-admin-series-entry.js
      - name: Run simulated Telegram E2E against real Worker routing
        run: |
          set -euo pipefail
          node qa/telegram/telegram-harness.mjs | tee /tmp/telegram-qa.log
          grep -q 'RESULT: PASS' /tmp/telegram-qa.log
          grep -q 'PASS enrollment idempotence' /tmp/telegram-qa.log
          grep -q 'PASS club scope:' /tmp/telegram-qa.log
          grep -q 'PASS CLUB_ADMIN direct VERIFIED result' /tmp/telegram-qa.log
          grep -q 'PASS suspend + session invalidation + idempotence' /tmp/telegram-qa.log
          grep -q 'PASS suspended guard + stale callback denial' /tmp/telegram-qa.log
          grep -q 'PASS reactivate + role restoration + idempotence' /tmp/telegram-qa.log
          grep -q 'PASS revoke preserves identity + audit + idempotence' /tmp/telegram-qa.log
      - name: Run Telegram native menu QA
        run: |
          set -euo pipefail
          node qa/telegram/telegram-native-menu-harness.mjs | tee /tmp/telegram-menu-qa.log
          grep -q 'PASS public native menu profile' /tmp/telegram-menu-qa.log
          grep -q 'PASS menu sync idempotence' /tmp/telegram-menu-qa.log
          grep -q 'PASS CLUB_ADMIN role-aware commands' /tmp/telegram-menu-qa.log
          grep -q 'PASS suspended admin automatically loses admin menu' /tmp/telegram-menu-qa.log
          grep -q 'PASS SUPER_ADMIN role-aware commands' /tmp/telegram-menu-qa.log
          grep -q 'PASS deploy reconcile configures native menu and bot name' /tmp/telegram-menu-qa.log
          grep -q 'PASS native menu and branding runtime health contract' /tmp/telegram-menu-qa.log
          grep -q 'RESULT: PASS' /tmp/telegram-menu-qa.log
      - name: Run blue green Telegram bot migration QA
        run: |
          set -euo pipefail
          node qa/telegram/telegram-bot-migration-harness.mjs | tee /tmp/telegram-migration-qa.log
          grep -q 'PASS independent next-bot menu cache schema' /tmp/telegram-migration-qa.log
          grep -q 'PASS next webhook reuses core logic, D1 identity and next token only' /tmp/telegram-migration-qa.log
          grep -q 'PASS next-bot menu sync idempotence' /tmp/telegram-migration-qa.log
          grep -q 'PASS primary and next menu caches are independent' /tmp/telegram-migration-qa.log
          grep -q 'PASS next reconcile configures isolated webhook, menu and branding' /tmp/telegram-migration-qa.log
          grep -q 'PASS next runtime health contract' /tmp/telegram-migration-qa.log
          grep -q 'PASS primary bot remains untouched during blue green migration' /tmp/telegram-migration-qa.log
          grep -q 'PASS migration slot stays safely dormant without next token' /tmp/telegram-migration-qa.log
          grep -q 'RESULT: PASS' /tmp/telegram-migration-qa.log
      - name: Run historical V2 public-results compatibility QA
        run: |
          set -euo pipefail
          node qa/telegram/public-results-ux-v2-harness.mjs | tee /tmp/telegram-public-ux-v2.log
          grep -q 'PASS historical V2 home callback remains available on destination bot' /tmp/telegram-public-ux-v2.log
          grep -q 'PASS historical V2 latest callback remains compatible' /tmp/telegram-public-ux-v2.log
          grep -q 'PASS historical V2 match callback remains compatible' /tmp/telegram-public-ux-v2.log
          grep -q 'PASS historical V2 club callback remains compatible' /tmp/telegram-public-ux-v2.log
          grep -q 'PASS historical V2 series callback remains compatible' /tmp/telegram-public-ux-v2.log
          grep -q 'PASS historical V2 series/date callback remains compatible' /tmp/telegram-public-ux-v2.log
          grep -q 'PASS primary rollback bot keeps legacy public-results presentation' /tmp/telegram-public-ux-v2.log
          grep -q 'PASS historical V2 callbacks reject invalid webhook secret before side effects' /tmp/telegram-public-ux-v2.log
          grep -q 'RESULT: PASS' /tmp/telegram-public-ux-v2.log
      - name: Run active V3 destination public-results UX QA
        run: |
          set -euo pipefail
          node qa/telegram/public-results-ux-v3-harness.mjs | tee /tmp/telegram-public-ux-v3.log
          grep -q 'PASS entry goes directly to latest round and edits the existing panel' /tmp/telegram-public-ux-v3.log
          grep -q 'PASS match detail replaces the same panel with compact four-series score' /tmp/telegram-public-ux-v3.log
          grep -q 'PASS secondary filters are hidden behind one explicit search action' /tmp/telegram-public-ux-v3.log
          grep -q 'PASS return to Public also reuses the current panel' /tmp/telegram-public-ux-v3.log
          grep -q 'PASS historical V2 callback namespace remains compatible' /tmp/telegram-public-ux-v3.log
          grep -q 'PASS primary rollback bot remains untouched' /tmp/telegram-public-ux-v3.log
          grep -q 'PASS destination runtime advertises UX contract version 3' /tmp/telegram-public-ux-v3.log
          grep -q 'PASS exceptional edit failure has a functional sendMessage fallback' /tmp/telegram-public-ux-v3.log
          grep -q 'PASS invalid webhook secret is rejected before Telegram or D1 side effects' /tmp/telegram-public-ux-v3.log
          grep -q 'RESULT: PASS' /tmp/telegram-public-ux-v3.log
      - name: Prove QA cannot call arbitrary network hosts
        run: |
          set -euo pipefail
          grep -q 'QA harness blocked unexpected network call' qa/telegram/telegram-harness.mjs
          grep -q "api.telegram.org/botqa-token-never-sent" qa/telegram/telegram-harness.mjs
          grep -q 'QA menu harness blocked unexpected network call' qa/telegram/telegram-native-menu-harness.mjs
          grep -q "api.telegram.org/botqa-menu-token" qa/telegram/telegram-native-menu-harness.mjs
          grep -q 'QA migration harness blocked unexpected network call' qa/telegram/telegram-bot-migration-harness.mjs
          grep -q "api.telegram.org/botqa-new-token" qa/telegram/telegram-bot-migration-harness.mjs
          grep -q 'QA public UX harness blocked unexpected network call' qa/telegram/public-results-ux-v2-harness.mjs
          grep -q 'QA V3 harness blocked unexpected network call' qa/telegram/public-results-ux-v3-harness.mjs

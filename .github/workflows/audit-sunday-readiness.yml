name: Audit Sunday Readiness

on:
  workflow_dispatch:
  pull_request:
    branches: [feature/sports-event-bus-v1]
    paths:
      - 'sports-bus/**'
      - '.github/workflows/audit-sunday-readiness.yml'
  push:
    branches:
      - feature/sports-event-bus-v1
      - ops/audit-admin-chepica-play-context-v1
      - ops/audit-audience-access-gate-v1
      - fix/restricted-audience-no-admin-bypass-v1
    paths:
      - 'sports-bus/**'
      - '.github/workflows/audit-sunday-readiness.yml'
      - '.github/workflows/deploy-sports-bus.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BASE: https://cudo-sports-event-bus.carlos-valdes-morales.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Install Wrangler
        run: npm install --no-save wrangler@latest
        working-directory: sports-bus
      - name: Wait for deployed canonical contracts
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 25); do
            S_CODE="$(curl -sS -o /tmp/standings-ready.json -w '%{http_code}' "$BASE/api/v1/public-standings" || true)"
            T_CODE="$(curl -sS -o /tmp/telegram-ready.json -w '%{http_code}' "$BASE/health/telegram-canonical" || true)"
            if [ "$S_CODE" = "200" ] && [ "$T_CODE" = "200" ] && \
              jq -e '.contract == "public-standings-v2"' /tmp/standings-ready.json >/dev/null 2>&1 && \
              jq -e '.ok == true and .bot_username == "FutbolChepicaBot" and .channel_role == "CANONICAL"' /tmp/telegram-ready.json >/dev/null 2>&1; then
              echo "Canonical contracts ready after attempt $attempt"
              exit 0
            fi
            sleep 4
          done
          echo "Canonical contracts did not become ready after deploy window"
          exit 1
      - name: Read-only operational state
        id: state
        working-directory: sports-bus
        shell: bash
        run: |
          set -euo pipefail
          SQL="SELECT
            (SELECT COUNT(*) FROM actor_scope_grants WHERE partner_code='CHEPICA_PLAY' AND role='MEDIA_PARTNER' AND scope_type='COMPETITION' AND scope_id='ANFA-CHEPICA-2026' AND active=1) AS active_chepica_play_identities,
            (SELECT COUNT(*) FROM partner_access_requests WHERE partner_code='CHEPICA_PLAY' AND requested_role='MEDIA_PARTNER' AND scope_type='COMPETITION' AND scope_id='ANFA-CHEPICA-2026' AND status='PENDING') AS pending_partner_access_requests,
            (SELECT COUNT(*) FROM partner_access_requests WHERE partner_code='CHEPICA_PLAY' AND requested_role='MEDIA_PARTNER' AND scope_type='COMPETITION' AND scope_id='ANFA-CHEPICA-2026' AND status='APPROVED') AS approved_partner_access_requests,
            (SELECT COUNT(*) FROM partner_access_requests r JOIN actor_scope_grants g ON g.telegram_user_id=r.telegram_user_id AND g.partner_code=r.partner_code AND g.role=r.requested_role AND g.scope_type=r.scope_type AND g.scope_id=r.scope_id AND g.active=1 WHERE r.partner_code='CHEPICA_PLAY' AND r.requested_role='MEDIA_PARTNER' AND r.scope_type='COMPETITION' AND r.scope_id='ANFA-CHEPICA-2026' AND r.status='APPROVED') AS request_flow_active_identities,
            (SELECT COUNT(*) FROM partner_scope_invites WHERE partner_code='CHEPICA_PLAY' AND role='MEDIA_PARTNER' AND scope_type='COMPETITION' AND scope_id='ANFA-CHEPICA-2026' AND status='PENDING' AND expires_at>datetime('now')) AS valid_pending_invites,
            (SELECT COUNT(*) FROM public_result_submissions p JOIN actor_scope_grants g ON g.telegram_user_id=p.submitter_id AND g.partner_code='CHEPICA_PLAY' AND g.role='MEDIA_PARTNER' AND g.scope_type='COMPETITION' AND g.scope_id='ANFA-CHEPICA-2026' AND g.active=1 WHERE p.entry_context='CHEPICA_PLAY' AND p.source_channel='telegram:chepica_play') AS linked_chepica_play_submissions,
            (SELECT COUNT(*) FROM matches WHERE competition_id='ANFA-CHEPICA-2026' AND round_no=3) AS round3_matches,
            (SELECT COUNT(*) FROM byes WHERE competition_id='ANFA-CHEPICA-2026' AND round_no=3) AS round3_byes,
            (SELECT COUNT(*) FROM public_result_submissions WHERE status='SUBMITTED') AS pending_result_submissions,
            (SELECT COUNT(*) FROM match_series_results r JOIN matches m ON m.match_id=r.match_id WHERE m.competition_id='ANFA-CHEPICA-2026' AND r.validation_status='VERIFIED') AS verified_series_results;"
          npx wrangler d1 execute cudo-sports-event-bus --remote --json --command "$SQL" > /tmp/readiness.json
          cat /tmp/readiness.json
          node <<'NODE' > /tmp/state.env
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('/tmp/readiness.json','utf8'));
          const r=payload[0]?.results?.[0];
          if(!r) throw new Error('missing_readiness_row');
          if(Number(r.round3_matches)!==5) throw new Error('round3_fixture_not_ready');
          if(Number(r.round3_byes)!==1) throw new Error('round3_bye_not_ready');
          console.log(`active=${Number(r.active_chepica_play_identities)}`);
          console.log(`pending_access_requests=${Number(r.pending_partner_access_requests)}`);
          console.log(`approved_access_requests=${Number(r.approved_partner_access_requests)}`);
          console.log(`request_flow_active=${Number(r.request_flow_active_identities)}`);
          console.log(`valid_invites=${Number(r.valid_pending_invites)}`);
          console.log(`linked_context_submissions=${Number(r.linked_chepica_play_submissions)}`);
          console.log(`round3_matches=${Number(r.round3_matches)}`);
          console.log(`round3_byes=${Number(r.round3_byes)}`);
          console.log(`pending_submissions=${Number(r.pending_result_submissions)}`);
          console.log(`verified_series=${Number(r.verified_series_results)}`);
          NODE
          cat /tmp/state.env
          cat /tmp/state.env >> "$GITHUB_OUTPUT"
      - name: Runtime read projections
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$BASE/health" -o /tmp/health.json
          curl -fsS "$BASE/health/telegram-canonical" -o /tmp/telegram-canonical.json
          curl -fsS "$BASE/api/v1/rounds/3/results?mode=official" -o /tmp/official.json
          curl -fsS "$BASE/api/v1/rounds/3/results?mode=reported" -o /tmp/reported.json
          curl -fsS "$BASE/api/v1/public-standings" -o /tmp/standings.json
          node <<'NODE'
          const fs=require('fs');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const h=read('/tmp/health.json');
          const t=read('/tmp/telegram-canonical.json');
          const o=read('/tmp/official.json');
          const r=read('/tmp/reported.json');
          const s=read('/tmp/standings.json');
          if(!h.ok) throw new Error('worker_health_failed');
          if(!t.ok||t.channel_role!=='CANONICAL'||t.bot_username!=='FutbolChepicaBot'||t.is_canonical_bot!==true) throw new Error('canonical_telegram_health_failed');
          if(!o.ok||o.mode!=='official'||Number(o.round_no)!==3) throw new Error('official_round3_failed');
          if(!r.ok||r.mode!=='reported'||Number(r.round_no)!==3) throw new Error('reported_round3_failed');
          if(!s.ok||s.contract!=='public-standings-v2') throw new Error('standings_runtime_failed');
          if(s.championships?.PRINCIPAL?.max_points_per_matchday!==9) throw new Error('principal_9_point_rule_failed');
          if(s.championships?.SENIOR?.independent_from!=='PRINCIPAL') throw new Error('senior_independence_failed');
          console.log('RUNTIME_PROJECTIONS=PASS');
          NODE
      - name: HUMAN GATE 1 — unlinked identity must request Chépica Play access
        if: steps.state.outputs.request_flow_active == '0' && steps.state.outputs.pending_access_requests == '0'
        run: |
          echo "BLOCKED_BY_HUMAN"
          echo "The restricted-audience policy is deployed and no request-based Chépica Play enrollment has reached PENDING yet."
          echo "Next irreducible action: from any real Telegram identity without an active Chépica Play scoped grant open @FutbolChepicaBot -> Chépica Play -> Solicitar autorización."
          echo "SUPER_ADMIN and PLATFORM_OPERATOR identities follow this same membership gate for their own Chépica Play access."
          echo "The expected runtime transition is REQUESTABLE -> PENDING. Creating the request must not create a grant."
      - name: HUMAN GATE 2 — administrator must decide pending Chépica Play request
        if: steps.state.outputs.request_flow_active == '0' && steps.state.outputs.pending_access_requests != '0'
        run: |
          echo "BLOCKED_BY_HUMAN"
          echo "A real Chépica Play access request is PENDING."
          echo "Next irreducible action: an authorized control-plane administrator must review that Telegram request and choose Aprobar or Rechazar."
          echo "The administrator does not need Chépica Play membership to manage the request. Only Aprobar may materialize the scoped MEDIA_PARTNER grant."
      - name: READY — request and approval flow proven end-to-end
        if: steps.state.outputs.request_flow_active != '0'
        run: |
          echo "REQUEST_APPROVAL_FLOW=PROVEN"
          echo "At least one APPROVED partner_access_request has a matching active scoped Chépica Play grant."
      - name: HUMAN GATE 3 — linked Chépica Play identity must prove operational UAT
        if: steps.state.outputs.request_flow_active != '0' && steps.state.outputs.linked_context_submissions == '0'
        run: |
          echo "BLOCKED_BY_HUMAN_AFTER_ACCESS_FLOW"
          echo "Request/approval onboarding is proven."
          echo "Next irreducible action: an identity with an active Chépica Play scoped grant must open Chépica Play -> Ingresar resultados and submit one controlled observation."
          echo "The audit must preserve the real actor plus entry_context=CHEPICA_PLAY and source_channel=telegram:chepica_play."
      - name: READY — linked Chépica Play operational context proven end-to-end
        if: steps.state.outputs.request_flow_active != '0' && steps.state.outputs.linked_context_submissions != '0'
        run: echo "Linked scoped actor -> Chépica Play context -> audited submission is proven in runtime."
      - name: INFO — invitation path is available
        if: steps.state.outputs.valid_invites != '0'
        run: |
          echo "ALTERNATE_ENROLLMENT_PATH_AVAILABLE"
          echo "A valid individual Chépica Play invitation exists. It remains a supported alternative, but it does not substitute the request/approval UAT currently being proven."
      - name: INFO — Chépica Play real identity already active
        if: steps.state.outputs.active != '0'
        run: echo "At least one real Chépica Play identity is already linked."

name: Validate Platform Operator Runtime

on:
  pull_request:
    branches:
      - feature/sports-event-bus-v1
    paths:
      - 'sports-bus/migrations/0017_operational_control_sessions.sql'
      - 'sports-bus/worker/platform-operator-entry.js'
      - 'sports-bus/cors-entry.js'
      - 'qa/telegram/platform-operator-runtime-harness.mjs'
      - '.github/workflows/validate-platform-operator-runtime.yml'
  push:
    branches:
      - feature/sports-event-bus-v1
      - feature/platform-operator-runtime-v1
    paths:
      - 'sports-bus/migrations/0017_operational_control_sessions.sql'
      - 'sports-bus/worker/platform-operator-entry.js'
      - 'sports-bus/cors-entry.js'
      - 'qa/telegram/platform-operator-runtime-harness.mjs'
      - '.github/workflows/validate-platform-operator-runtime.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          set -euo pipefail
          node --check sports-bus/worker/platform-operator-entry.js
          node --check sports-bus/cors-entry.js
          node --check qa/telegram/platform-operator-runtime-harness.mjs
      - name: Validate operational authority and policy boundary
        run: |
          set -euo pipefail
          node qa/telegram/platform-operator-runtime-harness.mjs | tee /tmp/platform-operator-runtime.log
          grep -q 'PASS PLATFORM_OPERATOR receives platform operational dashboard with policy boundary' /tmp/platform-operator-runtime.log
          grep -q 'PASS PLATFORM_OPERATOR registers first official result globally with role-accurate audit provenance' /tmp/platform-operator-runtime.log
          grep -q 'PASS PLATFORM_OPERATOR correction is button-first, versioned and auditable' /tmp/platform-operator-runtime.log
          grep -q 'PASS PLATFORM_OPERATOR governs dispute, resolve, annul and restore transitions' /tmp/platform-operator-runtime.log
          grep -q 'PASS PLATFORM_OPERATOR reconciles a public observation into first canonical result without self-approval' /tmp/platform-operator-runtime.log
          grep -q 'PASS PLATFORM_OPERATOR approves CLUB_ADMIN enrollment as an operational access task' /tmp/platform-operator-runtime.log
          grep -q 'PASS PLATFORM_OPERATOR manages CLUB_ADMIN lifecycle without touching privileged roles' /tmp/platform-operator-runtime.log
          grep -q 'PASS Separation of Duties: operator remains club_id NULL and cannot create SUPER_ADMIN or policy mutations' /tmp/platform-operator-runtime.log
          grep -q 'RESULT: PASS' /tmp/platform-operator-runtime.log

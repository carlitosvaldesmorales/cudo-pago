name: Validate Contributor Observation Plane

on:
  pull_request:
    branches:
      - feature/sports-event-bus-v1
    paths:
      - 'sports-bus/migrations/0016_contributor_observation_plane.sql'
      - 'sports-bus/migrations/0020_media_partner_correspondent_assignments.sql'
      - 'sports-bus/worker/access-control.js'
      - 'sports-bus/worker/contributor-observation-entry.js'
      - 'sports-bus/cors-entry.js'
      - 'qa/telegram/contributor-observation-plane-harness.mjs'
      - '.github/workflows/validate-contributor-observation-plane.yml'
  push:
    branches:
      - feature/sports-event-bus-v1
      - feature/chepica-play-correspondents-hub-v1
    paths:
      - 'sports-bus/migrations/0016_contributor_observation_plane.sql'
      - 'sports-bus/migrations/0020_media_partner_correspondent_assignments.sql'
      - 'sports-bus/worker/access-control.js'
      - 'sports-bus/worker/contributor-observation-entry.js'
      - 'sports-bus/cors-entry.js'
      - 'qa/telegram/contributor-observation-plane-harness.mjs'
      - '.github/workflows/validate-contributor-observation-plane.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          set -euo pipefail
          node --check sports-bus/worker/access-control.js
          node --check sports-bus/worker/contributor-observation-entry.js
          node --check sports-bus/cors-entry.js
          node --check qa/telegram/contributor-observation-plane-harness.mjs
      - name: Validate contributor observation plane
        run: |
          set -euo pipefail
          node qa/telegram/contributor-observation-plane-harness.mjs | tee /tmp/contributor-observation-plane.log
          grep -q 'PASS public observation never mutates canonical state' /tmp/contributor-observation-plane.log
          grep -q 'PASS MEDIA_PARTNER provenance requires explicit correspondent assignment and preserves canonical truth' /tmp/contributor-observation-plane.log
          grep -q 'PASS operational authority remains separated from policy authority' /tmp/contributor-observation-plane.log
          grep -q 'PASS button-first observation UX retained' /tmp/contributor-observation-plane.log
          grep -q 'RESULT: PASS' /tmp/contributor-observation-plane.log

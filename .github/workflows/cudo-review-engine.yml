name: CUDO Review Engine
run-name: CUDO Review Engine · ${{ github.event_name }} · ${{ inputs.source || 'n/a' }}

on:
  push:
    paths:
      - 'qa-v8-google/review_ingestion_state.json'
      - 'qa-v8-google/apps-script/CudoReviewEventBridge.gs'
      - 'qa-v8-google/apps-script/CudoPersonaReviewWeb.gs'
      - 'qa-v8-google/data/operacion.json'
      - 'qa-v8-google/apps-script/CudoWorkStateWeb.gs'
      - 'qa-v8-google/tools/work_state_web_fixture_harness.mjs'
      - 'qa-v8-google/tools/work_state_requests_fixture_harness.mjs'
      - 'qa-v8-google/tools/process_work_state_requests.mjs'
      - 'qa-v8-google/state/operational-work-state.json'
      - 'qa-v8-google/tools/ingest_review_form_responses.mjs'
      - 'qa-v8-google/tools/review_form_ingestion_fixture_harness.mjs'
      - 'qa-v8-google/tools/review_event_bridge_fixture_harness.mjs'
      - 'qa-v8-google/tools/review_event_observer.mjs'
      - 'qa-v8-google/tools/review_event_observer_fixture_harness.mjs'
      - 'qa-v8-google/tools/process_review_decisions.mjs'
      - 'qa-v8-google/tools/review_engine_fixture_harness.mjs'
      - 'qa-v8-google/tools/process_persona_review_decisions.mjs'
      - 'qa-v8-google/tools/persona_review_fixture_harness.mjs'
      - 'preview-v8/tools/sync_google_publico.mjs'
      - '.github/workflows/cudo-review-engine.yml'
      - '.github/workflows/cudo-review-event-observer.yml'
  pull_request:
    branches: [main]
    paths:
      - 'qa-v8-google/review_ingestion_state.json'
      - 'qa-v8-google/apps-script/CudoReviewEventBridge.gs'
      - 'qa-v8-google/apps-script/CudoPersonaReviewWeb.gs'
      - 'qa-v8-google/tools/ingest_review_form_responses.mjs'
      - 'qa-v8-google/tools/review_form_ingestion_fixture_harness.mjs'
      - 'qa-v8-google/tools/review_event_bridge_fixture_harness.mjs'
      - 'qa-v8-google/tools/review_event_observer.mjs'
      - 'qa-v8-google/tools/review_event_observer_fixture_harness.mjs'
      - 'qa-v8-google/tools/process_review_decisions.mjs'
      - 'qa-v8-google/tools/review_engine_fixture_harness.mjs'
      - 'qa-v8-google/tools/process_persona_review_decisions.mjs'
      - 'qa-v8-google/tools/persona_review_fixture_harness.mjs'
      - 'preview-v8/tools/sync_google_publico.mjs'
      - '.github/workflows/cudo-review-engine.yml'
      - '.github/workflows/cudo-review-event-observer.yml'
      - 'qa-v8-google/state/operational-work-state.json'
      - 'qa-v8-google/tools/process_work_state_requests.mjs'
      - 'qa-v8-google/tools/work_state_requests_fixture_harness.mjs'
      - 'qa-v8-google/tools/work_state_web_fixture_harness.mjs'
      - 'qa-v8-google/apps-script/CudoWorkStateWeb.gs'
      - 'qa-v8-google/data/operacion.json'
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'Aplicar decisiones gobernadas CUDO'
        required: true
        default: false
        type: boolean
      source:
        description: 'Origen operacional autorizado: apps_script_form_submit, apps_script_persona_review o apps_script_work_state'
        required: false
        default: 'manual'
        type: string

permissions:
  contents: write

concurrency:
  group: cudo-review-engine
  cancel-in-progress: false

jobs:
  validate-review-engine:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validar sintaxis del pipeline de revisión
        run: |
          set -euo pipefail
          node --check qa-v8-google/tools/ingest_review_form_responses.mjs
          node --check qa-v8-google/tools/review_form_ingestion_fixture_harness.mjs
          node --check qa-v8-google/tools/review_event_bridge_fixture_harness.mjs
          node --check qa-v8-google/tools/review_event_observer.mjs
          node --check qa-v8-google/tools/review_event_observer_fixture_harness.mjs
          node --check qa-v8-google/tools/process_review_decisions.mjs
          node --check qa-v8-google/tools/review_engine_fixture_harness.mjs
          node --check qa-v8-google/tools/process_persona_review_decisions.mjs
          node --check qa-v8-google/tools/persona_review_fixture_harness.mjs
          node --check qa-v8-google/tools/process_work_state_requests.mjs
          node --check qa-v8-google/tools/work_state_requests_fixture_harness.mjs
          node --check qa-v8-google/tools/work_state_web_fixture_harness.mjs
          node --check preview-v8/tools/sync_google_publico.mjs
      - name: Probar Form -> AUDITORIA de forma sintética
        run: node qa-v8-google/tools/review_form_ingestion_fixture_harness.mjs
      - name: Probar bridge Apps Script -> workflow_dispatch de forma sintética
        run: node qa-v8-google/tools/review_event_bridge_fixture_harness.mjs
      - name: Probar observador event-driven sin polling
        run: node qa-v8-google/tools/review_event_observer_fixture_harness.mjs
      - name: Probar AUDITORIA -> revisión/corrección con fixture sintético
        run: node qa-v8-google/tools/review_engine_fixture_harness.mjs
      - name: Probar PERSONA -> alta interna con fixture sintético
        run: node qa-v8-google/tools/persona_review_fixture_harness.mjs
      - name: Probar solicitudes Web -> estado operacional canónico
        run: node qa-v8-google/tools/work_state_requests_fixture_harness.mjs
      - name: Probar enrutamiento de Web privada operacional
        run: node qa-v8-google/tools/work_state_web_fixture_harness.mjs

  review-and-sync:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.apply_changes == true &&
      (inputs.source == 'apps_script_form_submit' || inputs.source == 'apps_script_persona_review' || inputs.source == 'apps_script_work_state')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CUDO_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_ID }}
      CUDO_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_SECRET }}
      CUDO_GOOGLE_REFRESH_TOKEN: ${{ secrets.CUDO_GOOGLE_REFRESH_TOKEN }}
      CUDO_REVIEW_INGEST_APPLY: 'true'
      CUDO_REVIEW_TRIGGER_SOURCE: ${{ inputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Registrar origen operacional
        run: echo "CUDO_REVIEW_TRIGGER_SOURCE=$CUDO_REVIEW_TRIGGER_SOURCE"
      - name: Ingerir respuestas nuevas del formulario al ledger
        if: inputs.source == 'apps_script_form_submit'
        run: node qa-v8-google/tools/ingest_review_form_responses.mjs
      - name: Procesar decisiones CUDO Review
        if: inputs.source == 'apps_script_form_submit'
        run: node qa-v8-google/tools/process_review_decisions.mjs
      - name: Procesar decisiones de fichas PERSONA
        if: inputs.source == 'apps_script_persona_review'
        run: node qa-v8-google/tools/process_persona_review_decisions.mjs
      - name: Procesar transición de trabajo operacional
        if: inputs.source == 'apps_script_work_state'
        run: node qa-v8-google/tools/process_work_state_requests.mjs
      - name: Persistir estado operacional QA si cambió
        if: inputs.source == 'apps_script_work_state'
        run: |
          set -euo pipefail
          if git diff --quiet -- qa-v8-google/state/operational-work-state.json qa-v8-google/data/operacion.json; then
            echo 'Sin cambios en estado operacional QA.'
            exit 0
          fi
          git config user.name 'cudo-work-state-engine'
          git config user.email 'actions@users.noreply.github.com'
          git add qa-v8-google/state/operational-work-state.json qa-v8-google/data/operacion.json
          git commit -m 'CUDO QA: actualizar estado operacional gobernado'
          git push

      - name: Sincronizar PUBLICO_EXPORT con el adaptador V8 vigente
        if: inputs.source == 'apps_script_form_submit'
        run: node preview-v8/tools/sync_google_publico.mjs
      - name: Validar datos públicos resultantes
        if: inputs.source == 'apps_script_form_submit'
        run: python3 preview-v8/tools/validate_data.py preview-v8/data
      - name: Publicar cambios JSON y medios si existen
        if: inputs.source == 'apps_script_form_submit'
        run: |
          set -euo pipefail
          if git diff --quiet -- preview-v8/data preview-v8/media; then
            echo 'Sin cambios públicos.'
            exit 0
          fi
          git config user.name 'cudo-review-engine'
          git config user.email 'actions@users.noreply.github.com'
          git add preview-v8/data preview-v8/media
          git commit -m 'CUDO: sincronizar contenido público desde Sheets'
          git push

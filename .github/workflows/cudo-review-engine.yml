name: CUDO Review Engine
run-name: CUDO Review Engine · ${{ github.event_name }} · ${{ inputs.source || 'n/a' }}

on:
  push:
    paths:
      - 'qa-v8-google/review_ingestion_state.json'
      - 'qa-v8-google/apps-script/CudoReviewEventBridge.gs'
      - 'qa-v8-google/tools/ingest_review_form_responses.mjs'
      - 'qa-v8-google/tools/review_form_ingestion_fixture_harness.mjs'
      - 'qa-v8-google/tools/review_event_bridge_fixture_harness.mjs'
      - 'qa-v8-google/tools/review_event_observer.mjs'
      - 'qa-v8-google/tools/review_event_observer_fixture_harness.mjs'
      - 'qa-v8-google/tools/process_review_decisions.mjs'
      - 'qa-v8-google/tools/process_review_decisions_qa_quarantine.mjs'
      - 'qa-v8-google/tools/apply_qa_review_overrides.mjs'
      - 'qa-v8-google/tools/qa_quarantine_fixture_harness.mjs'
      - 'qa-v8-google/tools/review_engine_fixture_harness.mjs'
      - 'qa-v8-google/tools/sync_google_publico.mjs'
      - 'qa-v8-google/tools/validate_data.py'
      - '.github/workflows/cudo-review-engine.yml'
      - '.github/workflows/cudo-review-event-observer.yml'
  pull_request:
    branches: [main]
    paths:
      - 'qa-v8-google/review_ingestion_state.json'
      - 'qa-v8-google/apps-script/CudoReviewEventBridge.gs'
      - 'qa-v8-google/tools/ingest_review_form_responses.mjs'
      - 'qa-v8-google/tools/review_form_ingestion_fixture_harness.mjs'
      - 'qa-v8-google/tools/review_event_bridge_fixture_harness.mjs'
      - 'qa-v8-google/tools/review_event_observer.mjs'
      - 'qa-v8-google/tools/review_event_observer_fixture_harness.mjs'
      - 'qa-v8-google/tools/process_review_decisions.mjs'
      - 'qa-v8-google/tools/process_review_decisions_qa_quarantine.mjs'
      - 'qa-v8-google/tools/apply_qa_review_overrides.mjs'
      - 'qa-v8-google/tools/qa_quarantine_fixture_harness.mjs'
      - 'qa-v8-google/tools/review_engine_fixture_harness.mjs'
      - 'qa-v8-google/tools/sync_google_publico.mjs'
      - 'qa-v8-google/tools/validate_data.py'
      - '.github/workflows/cudo-review-engine.yml'
      - '.github/workflows/cudo-review-event-observer.yml'
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'Ingerir respuestas nuevas, procesar decisiones sintéticas y sincronizar sólo el entorno QA'
        required: true
        default: false
        type: boolean
      source:
        description: 'Origen del dispatch; el único origen operacional con escrituras es apps_script_form_submit'
        required: false
        default: 'manual'
        type: string

permissions:
  contents: write

concurrency:
  group: cudo-review-engine-qa-isolated
  cancel-in-progress: false

jobs:
  validate-review-engine:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validar sintaxis del pipeline de revisión QA aislado
        run: |
          set -euo pipefail
          node --check qa-v8-google/tools/ingest_review_form_responses.mjs
          node --check qa-v8-google/tools/review_form_ingestion_fixture_harness.mjs
          node --check qa-v8-google/tools/review_event_bridge_fixture_harness.mjs
          node --check qa-v8-google/tools/review_event_observer.mjs
          node --check qa-v8-google/tools/review_event_observer_fixture_harness.mjs
          node --check qa-v8-google/tools/process_review_decisions.mjs
          node --check qa-v8-google/tools/process_review_decisions_qa_quarantine.mjs
          node --check qa-v8-google/tools/apply_qa_review_overrides.mjs
          node --check qa-v8-google/tools/qa_quarantine_fixture_harness.mjs
          node --check qa-v8-google/tools/review_engine_fixture_harness.mjs
          node --check qa-v8-google/tools/sync_google_publico.mjs
      - name: Probar Form -> AUDITORIA de forma sintética
        run: node qa-v8-google/tools/review_form_ingestion_fixture_harness.mjs
      - name: Probar bridge Apps Script -> workflow_dispatch QA de forma sintética
        run: node qa-v8-google/tools/review_event_bridge_fixture_harness.mjs
      - name: Probar observador event-driven sin polling
        run: node qa-v8-google/tools/review_event_observer_fixture_harness.mjs
      - name: Probar AUDITORIA -> revisión/corrección con fixture sintético
        run: node qa-v8-google/tools/review_engine_fixture_harness.mjs
      - name: Probar cuarentena positiva QA multidominio sin escrituras externas
        run: node qa-v8-google/tools/qa_quarantine_fixture_harness.mjs

  review-and-sync:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.apply_changes == true &&
      inputs.source == 'apps_script_form_submit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CUDO_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_ID }}
      CUDO_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_SECRET }}
      CUDO_GOOGLE_REFRESH_TOKEN: ${{ secrets.CUDO_GOOGLE_REFRESH_TOKEN }}
      CUDO_REVIEW_INGEST_APPLY: 'true'
      CUDO_REVIEW_TRIGGER_SOURCE: ${{ inputs.source }}
      CUDO_QA_EXPECT_MARKER: 'CUDO-QA-SYNTH-'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Guardar frontera QA y origen operacional
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'qa/review-event-no-prod-20260915'
          test "$GITHUB_REF_NAME" != 'main'
          echo "CUDO_REVIEW_TRIGGER_SOURCE=$CUDO_REVIEW_TRIGGER_SOURCE"
          echo "CUDO_REVIEW_TARGET=qa-v8-google"
      - name: Ingerir respuestas nuevas del formulario al ledger
        run: node qa-v8-google/tools/ingest_review_form_responses.mjs
      - name: Preflight fail-closed de una única decisión sintética
        id: route
        shell: bash
        run: |
          set -euo pipefail
          CUDO_REVIEW_DRY_RUN=true CUDO_REVIEW_EXPECT_PENDING=1 node qa-v8-google/tools/process_review_decisions.mjs > "$RUNNER_TEMP/review-plan.json"
          node - "$RUNNER_TEMP/review-plan.json" "$GITHUB_OUTPUT" <<'JS'
          const fs=require('fs');
          const [planFile,outFile]=process.argv.slice(2);
          const d=JSON.parse(fs.readFileSync(planFile,'utf8'));
          if(d.pending!==1||!Array.isArray(d.summary)||d.summary.length!==1) throw new Error('QA guard: debe existir exactamente una decisión pendiente');
          const s=d.summary[0];
          if(!String(s.identifier||'').includes('CUDO-QA-SYNTH-')) throw new Error('QA guard: la decisión pendiente no es sintética');
          if(String(s.status||'').startsWith('BLOQUEADO_')) throw new Error(`QA guard: decisión bloqueada en dry-run ${s.status}`);
          if(s.module==='TABLA'&&s.action==='PUBLISH') throw new Error('QA guard: publicación TABLA bloqueada hasta reconciliar autoridad canónica; la superficie vigente calcula standings desde resultados verificados');
          const quarantine=['NOTICIA','EQUIPO'].includes(s.module)&&s.action==='PUBLISH';
          fs.appendFileSync(outFile,`quarantine=${quarantine?'true':'false'}\n`);
          console.log(JSON.stringify({ok:true,pending:d.pending,module:s.module,action:s.action,synthetic:true,qa_positive_quarantine:quarantine},null,2));
          JS
      - name: Procesar aprobación positiva sintética en cuarentena QA
        if: steps.route.outputs.quarantine == 'true'
        run: node qa-v8-google/tools/process_review_decisions_qa_quarantine.mjs
      - name: Procesar otra decisión sintética con motor existente
        if: steps.route.outputs.quarantine != 'true'
        env:
          CUDO_REVIEW_EXPECT_PENDING: '1'
        run: node qa-v8-google/tools/process_review_decisions.mjs
      - name: Sincronizar PUBLICO_EXPORT compartido sólo como baseline de lectura hacia QA
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/cudo-review-qa-sync"
          rm -rf "$runtime"
          mkdir -p "$runtime"
          ln -s "$GITHUB_WORKSPACE/qa-v8-google" "$runtime/preview-v8"
          cd "$runtime"
          node "$GITHUB_WORKSPACE/qa-v8-google/tools/sync_google_publico.mjs"
      - name: Aplicar exclusivamente overrides sintéticos QA después del baseline
        run: node qa-v8-google/tools/apply_qa_review_overrides.mjs
      - name: Validar datos QA resultantes
        run: python3 qa-v8-google/tools/validate_data.py
      - name: Persistir sólo cambios del entorno QA
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- qa-v8-google/data qa-v8-google/media qa-v8-google/qa_review_overrides; then
            echo 'Sin cambios QA.'
            exit 0
          fi
          if ! git diff --quiet -- preview-v8; then
            echo '::error::Invariante roto: review QA intentó modificar preview-v8'
            git diff -- preview-v8
            exit 1
          fi
          git config user.name 'cudo-review-engine-qa'
          git config user.email 'actions@users.noreply.github.com'
          git add qa-v8-google/data qa-v8-google/media qa-v8-google/qa_review_overrides
          git commit -m 'QA: sincronizar contenido revisado en cuarentena aislada'
          git push origin HEAD:qa/review-event-no-prod-20260915

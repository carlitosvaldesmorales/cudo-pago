name: Deploy Sports Event Bus
on:
  workflow_dispatch:
  push:
    branches: [feature/sports-event-bus-v1]
    paths: ['sports-bus/**','.github/workflows/deploy-sports-bus.yml']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sports-bus
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Install Wrangler
        run: npm install --no-save wrangler@latest
      - name: Provision D1 database and binding
        shell: bash
        run: |
          set -euo pipefail
          DB_NAME="cudo-sports-event-bus"
          LIST_JSON="$(npx wrangler d1 list --json)"
          DB_ID="$(node -e 'const a=JSON.parse(process.argv[1]); const d=a.find(x=>x.name===process.argv[2]); if(d) process.stdout.write(d.uuid || d.id || "")' "$LIST_JSON" "$DB_NAME")"
          if [ -z "$DB_ID" ]; then CREATE_OUT="$(npx wrangler d1 create "$DB_NAME")"; DB_ID="$(printf '%s\n' "$CREATE_OUT" | sed -n 's/.*database_id = "\([^"]*\)".*/\1/p' | head -n1)"; fi
          test -n "$DB_ID"
          node - "$DB_ID" <<'NODE'
          const fs=require('fs'),id=process.argv[2],path='wrangler.toml';let s=fs.readFileSync(path,'utf8');s=s.replace(/\n\[\[d1_databases\]\][\s\S]*$/m,'');s+=`\n\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "cudo-sports-event-bus"\ndatabase_id = "${id}"\n`;fs.writeFileSync(path,s);
          NODE
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply cudo-sports-event-bus --remote
      - name: Validate fixture, results, governance and Telegram menu schema
        shell: bash
        run: |
          set -euo pipefail
          SQL="SELECT (SELECT COUNT(*) FROM matches WHERE competition_id='ANFA-CHEPICA-2026') matches_count,(SELECT COUNT(*) FROM byes WHERE competition_id='ANFA-CHEPICA-2026') byes_count,(SELECT COUNT(*) FROM teams) teams_count,(SELECT COUNT(*) FROM match_series_results WHERE validation_status='VERIFIED') series_count,(SELECT COUNT(DISTINCT match_id) FROM match_series_results WHERE validation_status='VERIFIED') result_matches,(SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='series_reports') series_reports_table,(SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='telegram_series_sessions') sessions_table,(SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='access_requests') access_requests_table,(SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='public_result_submissions') public_result_submissions_table,(SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='telegram_public_result_sessions') public_result_sessions_table,(SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='match_series_result_versions') result_versions_table,(SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='telegram_result_governance_sessions') governance_sessions_table,(SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='telegram_menu_state') telegram_menu_state_table,(SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='telegram_menu_state_next') telegram_menu_state_next_table,(SELECT COUNT(*) FROM public_result_submissions WHERE status NOT IN ('SUBMITTED','APPROVED','REJECTED','SUPERSEDED','CANCELLED')) invalid_public_submission_status,(SELECT COUNT(*) FROM match_series_results WHERE validation_status NOT IN ('VERIFIED','DISPUTED','ANNULLED')) invalid_governance_status,(SELECT COUNT(*) FROM match_series_result_versions WHERE validation_status NOT IN ('VERIFIED','DISPUTED','ANNULLED') OR action NOT IN ('BASELINE','CORRECT','DISPUTE','RESOLVE','ANNUL','RESTORE')) invalid_result_versions,(SELECT COUNT(*) FROM match_series_results r LEFT JOIN match_series_result_versions v ON v.match_id=r.match_id AND v.series_code=r.series_code AND v.version_no=r.governance_version WHERE v.version_id IS NULL) missing_current_version,(SELECT COUNT(*) FROM reporters WHERE club_id='CUDO') legacy_cudo_reporters,(SELECT COUNT(*) FROM reporters WHERE club_id='UNION-ORILLA') union_orilla_reporters,(SELECT COUNT(*) FROM teams WHERE team_id='UNION-ORILLA' AND group_id='A') union_orilla_team,(SELECT COUNT(*) FROM match_series_results WHERE series_code NOT IN ('TERCERA','SEGUNDA','SENIOR','PRIMERA')) invalid_series;"
          npx wrangler d1 execute cudo-sports-event-bus --remote --json --command "$SQL" > /tmp/materialized.json
          cat /tmp/materialized.json
          node -e 'const x=JSON.parse(require("fs").readFileSync("/tmp/materialized.json","utf8"));const r=x[0]?.results?.[0];if(!r||r.matches_count!==25||r.byes_count!==5||r.teams_count<11||r.series_count<20||r.result_matches<5||r.series_reports_table!==1||r.sessions_table!==1||r.access_requests_table!==1||r.public_result_submissions_table!==1||r.public_result_sessions_table!==1||r.result_versions_table!==1||r.governance_sessions_table!==1||r.telegram_menu_state_table!==1||r.telegram_menu_state_next_table!==1||r.invalid_public_submission_status!==0||r.invalid_governance_status!==0||r.invalid_result_versions!==0||r.missing_current_version!==0||r.legacy_cudo_reporters!==0||r.union_orilla_reporters<1||r.union_orilla_team!==1||r.invalid_series!==0){console.error(r);process.exit(1)}'
      - name: Deploy Worker
        run: npx wrangler deploy --keep-vars
      - name: Ensure primary Telegram config (health first)
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://cudo-sports-event-bus.carlos-valdes-morales.workers.dev"
          HEALTHY=0
          DRIFT=0

          for i in $(seq 1 20); do
            CODE="$(curl -sS -o /tmp/telegram-pre.json -w '%{http_code}' "$BASE/health/telegram" || true)"
            echo "Primary health HTTP $CODE (attempt $i/20)"
            cat /tmp/telegram-pre.json || true

            if [ "$CODE" = "200" ] && node -e 'const t=require("/tmp/telegram-pre.json");if(!t.ok||!t.bot_token_configured||!t.webhook_secret_configured||!t.bot_api_ok||!t.bot_name_configured||t.bot_name!=="Fútbol Chépica"||!t.webhook_configured||!t.native_menu_configured||!t.default_commands_configured)process.exit(1)'; then
              HEALTHY=1
              break
            fi

            if node -e 'const fs=require("fs");let t={};try{t=JSON.parse(fs.readFileSync("/tmp/telegram-pre.json","utf8"))}catch{};if(!(t.bot_token_configured&&t.webhook_secret_configured&&t.bot_api_ok&&(!t.bot_name_configured||!t.webhook_configured||!t.native_menu_configured||!t.default_commands_configured)))process.exit(1)' 2>/dev/null; then
              DRIFT=1
              echo "Primary Telegram configuration drift proven by health contract."
              break
            fi

            sleep 3
          done

          if [ "$HEALTHY" -eq 1 ]; then
            echo "Primary Telegram configuration already healthy; no Bot API writes required."
            exit 0
          fi

          if [ "$DRIFT" -ne 1 ]; then
            echo "Primary Telegram health did not prove configuration drift; refusing speculative Bot API writes."
            exit 1
          fi

          RECONCILED=0
          for i in $(seq 1 20); do
            CODE="$(curl -sS -o /tmp/reconcile.json -w '%{http_code}' -X POST -H 'X-CUDO-Repair: reconcile-webhook' "$BASE/ops/telegram/reconcile" || true)"
            echo "Primary reconcile HTTP $CODE (attempt $i/20)"
            cat /tmp/reconcile.json || true
            if [ "$CODE" = "200" ] && node -e 'const x=require("/tmp/reconcile.json");if(!x.ok||!x.webhook||!x.native_menu||!x.default_commands||!x.bot_name)process.exit(1)'; then
              RECONCILED=1
              break
            fi
            sleep 3
          done
          test "$RECONCILED" -eq 1
      - name: Validate public API and primary Telegram runtime
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://cudo-sports-event-bus.carlos-valdes-morales.workers.dev"
          TELEGRAM_READY=0
          for i in $(seq 1 20); do
            CODE="$(curl -sS -o /tmp/telegram.json -w '%{http_code}' "$BASE/health/telegram" || true)"
            echo "Primary health HTTP $CODE (validation attempt $i/20)"
            cat /tmp/telegram.json || true
            if [ "$CODE" = "200" ] && node -e 'const t=require("/tmp/telegram.json");if(!t.ok||!t.bot_token_configured||!t.webhook_secret_configured||!t.bot_api_ok||!t.bot_name_configured||t.bot_name!=="Fútbol Chépica"||!t.webhook_configured||!t.native_menu_configured||!t.default_commands_configured)process.exit(1)'; then
              TELEGRAM_READY=1
              break
            fi
            sleep 3
          done
          test "$TELEGRAM_READY" -eq 1
          curl --fail --silent "$BASE/health" > /tmp/health.json
          curl --fail --silent "$BASE/api/v1/matches" > /tmp/matches.json
          curl --fail --silent "$BASE/api/v1/series-results" > /tmp/series.json
          node -e 'const h=require("/tmp/health.json");if(!h.ok)process.exit(1)'
          node -e 'const m=require("/tmp/matches.json");if(!m.ok||m.matches.filter(x=>x.competition_id==="ANFA-CHEPICA-2026").length!==25)process.exit(1)'
          node -e 'const s=require("/tmp/series.json");const rows=(s.results||[]).flatMap(m=>m.series||[]);if(!s.ok||s.results.length<5||rows.length<20||rows.some(x=>x.validation_status!=="VERIFIED"))process.exit(1)'
      - name: Ensure destination Telegram bot config and UX contract (health first)
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://cudo-sports-event-bus.carlos-valdes-morales.workers.dev"
          NEXT_CONFIGURED=0
          NEXT_HEALTHY=0
          NEXT_DRIFT=0
          V3_VISIBLE=0

          for i in $(seq 1 20); do
            CODE="$(curl -sS -o /tmp/telegram-next-pre.json -w '%{http_code}' "$BASE/health/telegram-next" || true)"
            echo "Destination health HTTP $CODE (attempt $i/20)"
            cat /tmp/telegram-next-pre.json || true

            NEXT_CONFIGURED="$(node -e 'const fs=require("fs");let x={};try{x=JSON.parse(fs.readFileSync("/tmp/telegram-next-pre.json","utf8"))}catch{};process.stdout.write(x.bot_token_configured?"1":"0")')"
            if [ "$NEXT_CONFIGURED" != "1" ]; then
              if node -e 'const fs=require("fs");let x={};try{x=JSON.parse(fs.readFileSync("/tmp/telegram-next-pre.json","utf8"))}catch{};if(x.error!=="telegram_next_bot_token_missing")process.exit(1)' 2>/dev/null; then
                echo "Destination Telegram bot slot is dormant; TELEGRAM_BOT_TOKEN_NEXT is not configured."
                exit 0
              fi
              sleep 3
              continue
            fi

            if node -e 'const x=require("/tmp/telegram-next-pre.json");if(String(x.public_results_ux_version)!=="3")process.exit(1)' 2>/dev/null; then
              V3_VISIBLE=1
            else
              echo "Waiting for Worker contract public_results_ux_version=3."
              sleep 3
              continue
            fi

            if [ "$CODE" = "200" ] && node -e 'const t=require("/tmp/telegram-next-pre.json");if(!t.ok||t.slot!=="next"||!t.bot_token_configured||!t.webhook_secret_configured||!t.bot_api_ok||!t.bot_username_shape_ok||t.bot_name!=="Fútbol Chépica"||!t.bot_name_configured||!t.webhook_configured||!t.native_menu_configured||!t.default_commands_configured||String(t.public_results_ux_version)!=="3")process.exit(1)'; then
              NEXT_HEALTHY=1
              break
            fi

            if node -e 'const t=require("/tmp/telegram-next-pre.json");if(!(t.bot_token_configured&&t.webhook_secret_configured&&t.bot_api_ok&&String(t.public_results_ux_version)==="3"&&(!t.bot_name_configured||!t.webhook_configured||!t.native_menu_configured||!t.default_commands_configured)))process.exit(1)' 2>/dev/null; then
              NEXT_DRIFT=1
              echo "Destination Telegram configuration drift proven by health contract."
              break
            fi

            sleep 3
          done

          test "$NEXT_CONFIGURED" -eq 1
          test "$V3_VISIBLE" -eq 1

          if [ "$NEXT_HEALTHY" -ne 1 ]; then
            if [ "$NEXT_DRIFT" -ne 1 ]; then
              echo "Destination health did not prove configuration drift; refusing speculative Bot API writes."
              exit 1
            fi

            NEXT_RECONCILED=0
            for i in $(seq 1 20); do
              CODE="$(curl -sS -o /tmp/reconcile-next.json -w '%{http_code}' -X POST -H 'X-CUDO-Repair: reconcile-webhook' "$BASE/ops/telegram-next/reconcile" || true)"
              echo "Destination reconcile HTTP $CODE (attempt $i/20)"
              cat /tmp/reconcile-next.json || true
              if [ "$CODE" = "200" ] && node -e 'const x=require("/tmp/reconcile-next.json");if(!x.ok||x.slot!=="next"||!x.webhook||!x.native_menu||!x.default_commands||!x.bot_name||String(x.public_results_ux_version)!=="3")process.exit(1)'; then
                NEXT_RECONCILED=1
                break
              fi
              sleep 3
            done
            test "$NEXT_RECONCILED" -eq 1
          else
            echo "Destination Telegram configuration already healthy; no Bot API writes required."
          fi

          NEXT_READY=0
          for i in $(seq 1 20); do
            CODE="$(curl -sS -o /tmp/telegram-next.json -w '%{http_code}' "$BASE/health/telegram-next" || true)"
            echo "Destination health HTTP $CODE (validation attempt $i/20)"
            cat /tmp/telegram-next.json || true
            if [ "$CODE" = "200" ] && node -e 'const t=require("/tmp/telegram-next.json");if(!t.ok||t.slot!=="next"||!t.bot_token_configured||!t.webhook_secret_configured||!t.bot_api_ok||!t.bot_username_shape_ok||t.bot_name!=="Fútbol Chépica"||!t.bot_name_configured||!t.webhook_configured||!t.native_menu_configured||!t.default_commands_configured||String(t.public_results_ux_version)!=="3")process.exit(1)'; then
              NEXT_READY=1
              break
            fi
            sleep 3
          done
          test "$NEXT_READY" -eq 1

          curl -fsS "$BASE/health/telegram" -o /tmp/telegram-primary.json
          node -e 'const a=require("/tmp/telegram-primary.json"),b=require("/tmp/telegram-next.json");if(!a.bot_id||!b.bot_id||String(a.bot_id)===String(b.bot_id)){console.error("Bot IDs must be distinct during migration",{primary:a.bot_id,next:b.bot_id});process.exit(1)}'
          echo "Destination bot is healthy on shared Worker/D1 and public_results_ux_version=3 is live."
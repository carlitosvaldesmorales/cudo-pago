name: Deploy Sports Event Bus

on:
  workflow_dispatch:
  push:
    branches:
      - feature/sports-event-bus-v1
    paths:
      - 'sports-bus/**'
      - '.github/workflows/deploy-sports-bus.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sports-bus
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Provision D1 database and binding
        shell: bash
        run: |
          set -euo pipefail
          DB_NAME="cudo-sports-event-bus"
          LIST_JSON="$(npx wrangler@latest d1 list --json)"
          DB_ID="$(node -e 'const a=JSON.parse(process.argv[1]); const d=a.find(x=>x.name===process.argv[2]); if(d) process.stdout.write(d.uuid || d.id || "")' "$LIST_JSON" "$DB_NAME")"
          if [ -z "$DB_ID" ]; then
            CREATE_OUT="$(npx wrangler@latest d1 create "$DB_NAME")"
            DB_ID="$(printf '%s\n' "$CREATE_OUT" | sed -n 's/.*database_id = "\([^"]*\)".*/\1/p' | head -n1)"
          fi
          test -n "$DB_ID"
          node - "$DB_ID" <<'NODE'
          const fs = require('fs');
          const id = process.argv[2];
          const path = 'wrangler.toml';
          let s = fs.readFileSync(path, 'utf8');
          s = s.replace(/\n\[\[d1_databases\]\][\s\S]*$/m, '');
          s += `\n\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "cudo-sports-event-bus"\ndatabase_id = "${id}"\n`;
          fs.writeFileSync(path, s);
          NODE
          echo "D1 database resolved and DB binding generated."

      - name: Apply D1 migrations
        shell: bash
        run: npx wrangler@latest d1 migrations apply cudo-sports-event-bus --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: sports-bus
          command: deploy --keep-vars

      - name: Validate public API
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://cudo-sports-event-bus.carlos-valdes-morales.workers.dev"
          curl --fail --silent --show-error "$BASE/health" | tee /tmp/health.json
          curl --fail --silent --show-error "$BASE/api/v1/matches" | tee /tmp/matches.json
          node -e 'const h=require("/tmp/health.json"); if(!h.ok) process.exit(1)'
          node -e 'const m=require("/tmp/matches.json"); if(!m.ok || !Array.isArray(m.matches)) process.exit(1)'

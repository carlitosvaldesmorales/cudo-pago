name: Validate Results E2E
on:
  workflow_dispatch:
  push:
    branches: [feature/sports-event-bus-v1]
    paths: ['.github/workflows/validate-results-e2e.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install Wrangler
        run: npm install --no-save wrangler@latest
      - name: Inspect latest CUDO Fecha II series results
        shell: bash
        run: |
          set -euo pipefail
          cd sports-bus
          SQL="SELECT m.match_id,m.round_no,m.group_id,m.home_name,m.away_name,r.series_code,r.home_score,r.away_score,r.validation_status,r.source_type,r.updated_at FROM match_series_results r JOIN matches m ON m.match_id=r.match_id WHERE m.match_id='A-F2-M2' ORDER BY CASE r.series_code WHEN 'TERCERA' THEN 1 WHEN 'SEGUNDA' THEN 2 WHEN 'SENIOR' THEN 3 WHEN 'PRIMERA' THEN 4 ELSE 9 END;"
          npx wrangler d1 execute cudo-sports-event-bus --remote --json --command "$SQL" > /tmp/d1.json
          cat /tmp/d1.json
          node <<'NODE'
          const x=JSON.parse(require('fs').readFileSync('/tmp/d1.json','utf8'));
          const rows=x.flatMap(v=>v.results||[]);
          if(!rows.length) throw new Error('no_verified_results_for_A-F2-M2');
          if(rows.some(r=>r.validation_status!=='VERIFIED')) throw new Error('non_verified_result_present');
          console.log('verified_series_count='+rows.length);
          for(const r of rows) console.log(`${r.series_code}:${r.home_score}-${r.away_score}:${r.validation_status}:${r.source_type}`);
          NODE
      - name: Validate public API exposes Fecha II
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cudo-sports-event-bus.carlos-valdes-morales.workers.dev'
          curl -fsS "$BASE/api/v1/series-results" > /tmp/api.json
          node <<'NODE'
          const x=require('/tmp/api.json');
          const m=(x.results||[]).find(r=>r.match_id==='A-F2-M2');
          if(!m) throw new Error('fecha2_not_in_public_api');
          if((m.series||[]).length!==4) throw new Error(`fecha2_series_count_${(m.series||[]).length}`);
          console.log(JSON.stringify({match_id:m.match_id,series:m.series},null,2));
          NODE
      - name: Validate CUDO page consumes live Sports Bus API
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS 'https://cudo.cl/preview-v8/shared/championship.js' -o /tmp/champ.js
          curl -fsS 'https://cudo.cl/preview-v8/shared/standings.js' -o /tmp/standings.js
          for f in /tmp/champ.js /tmp/standings.js; do
            grep -q 'cudo-sports-event-bus.carlos-valdes-morales.workers.dev' "$f"
            grep -q '/api/v1/series-results' "$f"
            grep -q "cache:'no-store'" "$f"
          done
          echo 'page_live_api_binding=OK'

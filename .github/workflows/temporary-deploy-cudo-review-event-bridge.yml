name: Temporary deploy CUDO Review Event Bridge

on:
  push:
    paths:
      - '.github/workflows/temporary-deploy-cudo-review-event-bridge.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CUDO_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_ID }}
      CUDO_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_SECRET }}
      CUDO_GOOGLE_REFRESH_TOKEN: ${{ secrets.CUDO_GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Add bridge source to existing Apps Script project, preserving all files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          SCRIPT_ID='1NI73jgr_PFvrsHy27ejE_kLbTWwLbM1Y8Nyc6mRaWlcCaLlZrpEB3Ud8'
          src=pathlib.Path('qa-v8-google/apps-script/CudoReviewEventBridge.gs').read_text()
          body=urllib.parse.urlencode({'client_id':os.environ['CUDO_GOOGLE_OAUTH_CLIENT_ID'],'client_secret':os.environ['CUDO_GOOGLE_OAUTH_CLIENT_SECRET'],'refresh_token':os.environ['CUDO_GOOGLE_REFRESH_TOKEN'],'grant_type':'refresh_token'}).encode()
          req=urllib.request.Request('https://oauth2.googleapis.com/token',data=body,headers={'Content-Type':'application/x-www-form-urlencoded'})
          with urllib.request.urlopen(req) as r: access=json.load(r)['access_token']
          def request(url,method='GET',data=None):
            headers={'Authorization':'Bearer '+access,'Content-Type':'application/json'}
            req=urllib.request.Request(url,data=None if data is None else json.dumps(data).encode(),headers=headers,method=method)
            with urllib.request.urlopen(req) as r:return json.load(r) if r.length not in (0,None) else {}
          url=f'https://script.googleapis.com/v1/projects/{SCRIPT_ID}/content'
          content=request(url)
          files=content.get('files',[])
          files=[f for f in files if f.get('name')!='CudoReviewEventBridge']
          files.append({'name':'CudoReviewEventBridge','type':'SERVER_JS','source':src})
          request(url,'PUT',{'files':files})
          verify=request(url)
          matches=[f for f in verify.get('files',[]) if f.get('name')=='CudoReviewEventBridge']
          ok=len(matches)==1 and matches[0].get('source','')==src
          print(json.dumps({'ok':ok,'script_id':SCRIPT_ID,'file_count':len(verify.get('files',[])),'bridge_present':len(matches)==1,'manifest_changed':False,'trigger_created':False},indent=2))
          if not ok: raise SystemExit('bridge verification failed')
          PY

name: CUDO V8 - validar ambiente de datos

on:
  push:
    branches:
      - qa-v8-google-data
      - prod-v8-google-data
    paths:
      - 'preview-v8/data/**'
      - 'preview-v8/contracts/**'
      - 'preview-v8/shared/site-runtime-v8.js'
      - 'preview-v8/shared/data-source.js'
      - 'preview-v8/shared/seed-data.js'
      - 'preview-v8/shared/page-ux.js'
      - 'preview-v8/tools/heic_media.mjs'
      - 'preview-v8/tools/sync_google_publico_with_heic.mjs'
      - 'preview-v8/tools/sync_google_publico.mjs'
      - 'preview-v8/tools/validate_heic_ingest.mjs'
      - 'preview-v8/tools/normalize_public_ids.mjs'
      - 'preview-v8/tools/validate_data.py'
      - 'preview-v8/tools/validate_partidos_vertical.py'
      - 'preview-v8/tools/validate_qa_pipeline.py'
      - 'preview-v8/tools/validate_sync_contracts.py'
      - 'preview-v8/tools/visual_qa.mjs'
      - '.github/workflows/sync-qa-google-data.yml'
      - '.github/workflows/publish-qa-google.yml'
      - '.github/workflows/validate-data-env.yml'
  pull_request:
    branches:
      - qa-v8-google-data
      - prod-v8-google-data
    paths:
      - 'preview-v8/data/**'
      - 'preview-v8/contracts/**'
      - 'preview-v8/shared/site-runtime-v8.js'
      - 'preview-v8/shared/data-source.js'
      - 'preview-v8/shared/seed-data.js'
      - 'preview-v8/shared/page-ux.js'
      - 'preview-v8/tools/heic_media.mjs'
      - 'preview-v8/tools/sync_google_publico_with_heic.mjs'
      - 'preview-v8/tools/sync_google_publico.mjs'
      - 'preview-v8/tools/validate_heic_ingest.mjs'
      - 'preview-v8/tools/normalize_public_ids.mjs'
      - 'preview-v8/tools/validate_data.py'
      - 'preview-v8/tools/validate_partidos_vertical.py'
      - 'preview-v8/tools/validate_qa_pipeline.py'
      - 'preview-v8/tools/validate_sync_contracts.py'
      - 'preview-v8/tools/visual_qa.mjs'
      - '.github/workflows/sync-qa-google-data.yml'
      - '.github/workflows/publish-qa-google.yml'
      - '.github/workflows/validate-data-env.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-data-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar adaptador HEIC móvil
        run: npm install --no-save heic-convert@2.1.0 heic-decode@2.1.0 libheif-js@1.19.8 jpeg-js@0.4.4 pngjs@6.0.0
      - name: Validar HEIC real a JPEG web
        run: node preview-v8/tools/validate_heic_ingest.mjs
      - name: Validar autoridad única del pipeline QA
        run: python3 preview-v8/tools/validate_qa_pipeline.py
      - name: Validar contratos públicos JSON
        run: |
          python3 preview-v8/tools/validate_data.py
          python3 preview-v8/tools/validate_partidos_vertical.py
      - name: Validar configuración sync sin credenciales
        run: python3 preview-v8/tools/validate_sync_contracts.py
      - name: Validar Javascript del runtime, adapter y generador
        run: |
          node --check preview-v8/shared/site.js
          node --check preview-v8/shared/site-runtime-v8.js
          node --check preview-v8/shared/seed-data.js
          node --check preview-v8/shared/data-source.js
          node --check preview-v8/shared/page-ux.js
          node --check preview-v8/tools/heic_media.mjs
          node --check preview-v8/tools/sync_google_publico_with_heic.mjs
          node --check preview-v8/tools/sync_google_publico.mjs
          node --check preview-v8/tools/validate_heic_ingest.mjs
          node --check preview-v8/tools/normalize_public_ids.mjs
          node --check preview-v8/tools/visual_qa.mjs
      - name: Garantizar separación QA/PROD y ausencia de mock
        env:
          BRANCH_NAME: ${{ github.base_ref || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          branch=os.environ['BRANCH_NAME']
          adapter=Path('preview-v8/shared/data-source.js').read_text(encoding='utf-8')
          shim=Path('preview-v8/shared/seed-data.js').read_text(encoding='utf-8')
          expected={'qa-v8-google-data':"environment:'QA'",'prod-v8-google-data':"environment:'PROD'"}
          assert branch in expected, branch
          assert expected[branch] in adapter, f'Ambiente incorrecto para {branch}'
          assert 'mock:false' in adapter, 'El adapter de integración no puede habilitar mock'
          forbidden=['CUDO_SEED_DATA','randomuser.me','VISTA DEMOSTRATIVA','FOTO MOCK']
          combined=adapter+'\n'+shim
          for token in forbidden:
              assert token not in combined, f'Mock filtrado al ambiente {branch}: {token}'
          print('Separación de ambiente OK:', branch)
          PY
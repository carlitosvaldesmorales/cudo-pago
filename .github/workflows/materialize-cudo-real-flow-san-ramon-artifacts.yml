name: Materialize CUDO Real Flow San Ramon QA Artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - 'qa-v8-google/tools/real_flow_san_ramon_runtime.mjs'
      - 'qa-v8-google/tools/emit_real_flow_san_ramon_artifacts.mjs'
      - 'qa-v8-google/tools/certify_real_flow_san_ramon_artifacts.mjs'
      - 'qa-v8-google/contracts/cudo-real-flow-san-ramon-corona-v1.json'
      - 'qa-v8-google/contracts/cudo-dependency-rule-registry-v1.json'
      - '.github/workflows/materialize-cudo-real-flow-san-ramon-artifacts.yml'
      - 'qa-v8-google/evidence/real-flow-san-ramon/**'
  push:
    branches:
      - 'feat/cudo-real-flow-san-ramon-qa-artifacts-v1'
    paths:
      - 'qa-v8-google/tools/real_flow_san_ramon_runtime.mjs'
      - 'qa-v8-google/tools/emit_real_flow_san_ramon_artifacts.mjs'
      - 'qa-v8-google/contracts/cudo-real-flow-san-ramon-corona-v1.json'
      - 'qa-v8-google/contracts/cudo-dependency-rule-registry-v1.json'
      - '.github/workflows/materialize-cudo-real-flow-san-ramon-artifacts.yml'
      - 'qa-v8-google/evidence/real-flow-san-ramon/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate materializer syntax
        run: |
          node --check qa-v8-google/tools/real_flow_san_ramon_runtime.mjs
          node --check qa-v8-google/tools/emit_real_flow_san_ramon_artifacts.mjs
      - name: Materialize deterministic QA artifacts to log
        run: node qa-v8-google/tools/emit_real_flow_san_ramon_artifacts.mjs
      - name: Certify persisted QA artifacts match runtime
        run: node qa-v8-google/tools/certify_real_flow_san_ramon_artifacts.mjs

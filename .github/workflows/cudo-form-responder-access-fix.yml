name: CUDO Google Form Responder Access Fix

on:
  push:
    branches:
      - fix/mobile-google-form-responder-access
    paths:
      - 'qa-v8-google/tools/manage_google_form_responder_access.mjs'
      - '.github/workflows/cudo-form-responder-access-fix.yml'

permissions:
  contents: read

jobs:
  responder-access:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CUDO_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_ID }}
      CUDO_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_SECRET }}
      CUDO_GOOGLE_REFRESH_TOKEN: ${{ secrets.CUDO_GOOGLE_REFRESH_TOKEN }}
      CUDO_FORM_ACCESS_APPLY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate responder access manager syntax
        run: node --check qa-v8-google/tools/manage_google_form_responder_access.mjs
      - name: Preflight Google Form responder access
        run: node qa-v8-google/tools/manage_google_form_responder_access.mjs
      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: cudo-form-responder-access-${{ github.run_id }}
          path: qa-form-access/form-responder-access.json
          retention-days: 14

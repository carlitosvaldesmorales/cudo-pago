name: CUDO V8 - publicar QA Google (legacy read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cudo-v8-qa-pipeline
  cancel-in-progress: false

jobs:
  legacy-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout QA Google
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: qa-v8-google-data

      - name: Avisar autoridad canónica
        run: |
          echo 'Workflow legacy en modo sólo lectura.'
          echo 'La única autoridad de sincronización, E2E y publicación QA es .github/workflows/sync-qa-google-data.yml.'

      - name: Validar contrato público sin publicar
        run: |
          python3 preview-v8/tools/validate_qa_pipeline.py
          python3 preview-v8/tools/validate_data.py
          python3 preview-v8/tools/validate_partidos_vertical.py

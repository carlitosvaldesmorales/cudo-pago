name: CUDO Equipos RAW Formula Repair

on:
  push:
    paths:
      - '.github/workflows/repair-equipos-raw-formula.yml'
      - 'qa-v8-google/tools/repair_equipos_raw_formula.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CUDO_EQUIPOS_FORMULA_FIX_APPLY: 'false'
      CUDO_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_ID }}
      CUDO_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_SECRET }}
      CUDO_GOOGLE_REFRESH_TOKEN: ${{ secrets.CUDO_GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validar sintaxis
        run: node --check qa-v8-google/tools/repair_equipos_raw_formula.mjs
      - name: Ejecutar reparación protegida
        run: node qa-v8-google/tools/repair_equipos_raw_formula.mjs
      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cudo-equipos-raw-formula-repair-${{ github.run_id }}
          path: qa-equipos-repair/equipos-raw-formula-repair.json
          if-no-files-found: warn
          retention-days: 14

name: CUDO Match Full-Day Builder Agent

on:
  push:
    branches:
      - agent/match-full-club-day-roundtrip-20260921
    paths:
      - 'ops/CUDO-MATCH-FULL-DAY-AGENT-TASK.yaml'
      - 'tools/cudo_match_full_day_builder_agent.py'
      - 'tools/cudo_match_full_day_agent_runner.py'
      - '.github/workflows/cudo-match-full-day-builder-agent.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cudo-match-full-day-builder-agent
  cancel-in-progress: false

jobs:
  build-candidate:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout bounded agent branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Run bounded self-hosted builder agent
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/cudo_match_full_day_agent_runner.py

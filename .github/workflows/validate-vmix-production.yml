name: Validate vMix Production Feed

on:
  pull_request:
    branches: [feature/sports-event-bus-v1]
    paths:
      - '.github/workflows/validate-vmix-production.yml'
  push:
    branches: [feature/sports-event-bus-v1]
    paths:
      - 'sports-bus/**'
      - '.github/workflows/validate-vmix-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate Fecha III vMix JSON contract in production
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cudo-sports-event-bus.carlos-valdes-morales.workers.dev'
          URL="$BASE/vmix/fecha/3.json"
          READY=0
          for i in $(seq 1 20); do
            CODE="$(curl -sS -o /tmp/vmix-fecha3.json -w '%{http_code}' "$URL" || true)"
            echo "vMix Fecha III HTTP $CODE (attempt $i/20)"
            if [ "$CODE" = '200' ] && node <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync('/tmp/vmix-fecha3.json','utf8'));
          const series=['TERCERA','SEGUNDA','SENIOR','PRIMERA'];
          if(!Array.isArray(rows)||rows.length!==20) process.exit(1);
          const matches=new Map();
          for(const r of rows){
            if(String(r.round_no)!=='3'||!r.match_id||!series.includes(r.series_code)||!r.row_key) process.exit(1);
            if(!r.home_name||!r.away_name||!r.home_crest_url||!r.away_crest_url) process.exit(1);
            if(!r.home_crest_url.startsWith('https://cudo.cl/preview-v8/media/clubes/')) process.exit(1);
            if(!r.away_crest_url.startsWith('https://cudo.cl/preview-v8/media/clubes/')) process.exit(1);
            if(!['INFORMADO','OFICIAL','EN DISPUTA','ANULADO','SIN RESULTADO'].includes(r.status_label)) process.exit(1);
            const set=matches.get(r.match_id)||new Set(); set.add(r.series_code); matches.set(r.match_id,set);
          }
          if(matches.size!==5) process.exit(1);
          for(const set of matches.values()) if(series.some(s=>!set.has(s))||set.size!==4) process.exit(1);
          console.log(JSON.stringify({rows:rows.length,matches:matches.size,round:3,statuses:[...new Set(rows.map(r=>r.status_label))]},null,2));
          NODE
            then READY=1; break; fi
            sleep 3
          done
          test "$READY" -eq 1

      - name: Validate every referenced crest is publicly reachable
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' > /tmp/crest-urls.txt
          const rows=require('/tmp/vmix-fecha3.json');
          const urls=[...new Set(rows.flatMap(r=>[r.home_crest_url,r.away_crest_url]))].sort();
          for(const u of urls) console.log(u);
          NODE
          test "$(wc -l < /tmp/crest-urls.txt)" -eq 10
          while IFS= read -r url; do
            echo "Checking $url"
            curl --fail --silent --show-error --location --range 0-0 "$url" -o /dev/null
          done < /tmp/crest-urls.txt

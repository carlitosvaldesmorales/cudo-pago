name: Validate vMix Production Feed

on:
  pull_request:
    branches: [feature/sports-event-bus-v1]
    paths:
      - 'sports-bus/worker/vmix-feed-entry.js'
      - 'qa/sports/vmix-broadcast-adapter-harness.mjs'
      - '.github/workflows/validate-vmix-production.yml'
  push:
    branches: [feature/sports-event-bus-v1]
    paths:
      - 'sports-bus/**'
      - 'qa/sports/vmix-broadcast-adapter-harness.mjs'
      - '.github/workflows/validate-vmix-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pull-request-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate prospective adapter before deploy
        run: |
          set -euo pipefail
          node --check sports-bus/worker/vmix-feed-entry.js
          node qa/sports/vmix-broadcast-adapter-harness.mjs

  production:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Wait for deploy and validate Fecha III vMix JSON contract
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cudo-sports-event-bus.carlos-valdes-morales.workers.dev'
          URL="$BASE/vmix/fecha/3.json"
          READY=0
          for i in $(seq 1 40); do
            CODE="$(curl -sS -o /tmp/vmix-fecha3.json -w '%{http_code}' "$URL" || true)"
            echo "vMix Fecha III HTTP $CODE (attempt $i/40)"
            if [ "$CODE" = '200' ]; then
              if node <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync('/tmp/vmix-fecha3.json','utf8'));
          const series=['TERCERA','SEGUNDA','SENIOR','PRIMERA'];
          const missing=[];
          if(!Array.isArray(rows)) { console.log('DIAG payload_not_array'); process.exit(1); }
          const matches=new Map();
          for(const r of rows){
            if(String(r.round_no)!=='3'||!r.match_id||!series.includes(r.series_code)||!r.row_key) missing.push({row_key:r.row_key,reason:'core_contract'});
            if(!r.home_name||!r.away_name) missing.push({row_key:r.row_key,reason:'team_name'});
            if(!r.home_crest_url) missing.push({row_key:r.row_key,reason:'home_crest',club_id:r.home_id});
            if(!r.away_crest_url) missing.push({row_key:r.row_key,reason:'away_crest',club_id:r.away_id});
            if(r.home_crest_url&&!r.home_crest_url.startsWith('https://cudo.cl/preview-v8/media/clubes/')) missing.push({row_key:r.row_key,reason:'home_crest_origin'});
            if(r.away_crest_url&&!r.away_crest_url.startsWith('https://cudo.cl/preview-v8/media/clubes/')) missing.push({row_key:r.row_key,reason:'away_crest_origin'});
            if(!['INFORMADO','OFICIAL','EN DISPUTA','ANULADO','SIN RESULTADO'].includes(r.status_label)) missing.push({row_key:r.row_key,reason:'status',status:r.status_label});
            const set=matches.get(r.match_id)||new Set(); set.add(r.series_code); matches.set(r.match_id,set);
          }
          const summary={rows:rows.length,matches:matches.size,rounds:[...new Set(rows.map(r=>r.round_no))],team_ids:[...new Set(rows.flatMap(r=>[r.home_id,r.away_id]))].sort(),statuses:[...new Set(rows.map(r=>r.status_label))],missing};
          console.log('DIAG '+JSON.stringify(summary));
          if(rows.length!==20||matches.size!==5||missing.length) process.exit(1);
          for(const set of matches.values()) if(series.some(s=>!set.has(s))||set.size!==4) process.exit(1);
          NODE
              then READY=1; break; fi
            fi
            sleep 5
          done
          test "$READY" -eq 1

      - name: Validate every referenced crest is publicly reachable
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' > /tmp/crest-urls.txt
          const rows=require('/tmp/vmix-fecha3.json');
          const urls=[...new Set(rows.flatMap(r=>[r.home_crest_url,r.away_crest_url]))].filter(Boolean).sort();
          for(const u of urls) console.log(u);
          NODE
          echo "Unique Fecha III crest URLs: $(wc -l < /tmp/crest-urls.txt)"
          test "$(wc -l < /tmp/crest-urls.txt)" -eq 10
          while IFS= read -r url; do
            echo "Checking $url"
            curl --fail --silent --show-error --location --range 0-0 "$url" -o /dev/null
          done < /tmp/crest-urls.txt

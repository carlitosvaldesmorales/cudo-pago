name: CUDO Review Second Target Preflight

on:
  push:
    paths:
      - '.github/workflows/cudo-review-second-target-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CUDO_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_ID }}
      CUDO_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_SECRET }}
      CUDO_GOOGLE_REFRESH_TOKEN: ${{ secrets.CUDO_GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe existing synthetic Equipos target read-only
        shell: bash
        run: |
          set -euo pipefail
          node qa-v8-google/tools/probe_synthetic_review_target.mjs | tee /tmp/target.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/target.json'))
          assert d.get('ok') is True, d
          assert d.get('marker')=='CUDO-QA-SYNTH-EQUIPO-35027786202', d
          assert d.get('public_match_count')==0, d
          assert len(d.get('revision_matches',[]))==0, d
          c=d.get('control',{})
          assert c.get('id_equipo'), d
          assert str(c.get('publicar','')).upper()!='SI', d
          print('second_target_safe_and_non_public=PASS')
          print('target_id='+c['id_equipo'])
          PY

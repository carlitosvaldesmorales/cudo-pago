name: CUDO V8 - sync QA Google data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches:
      - qa-v8-google-data
    paths:
      - 'preview-v8/**'
      - '!preview-v8/data/**'
      - '!preview-v8/media/**'
      - '.github/workflows/sync-qa-google-data.yml'
      - '.github/workflows/publish-qa-google.yml'

permissions:
  contents: write

concurrency:
  group: cudo-v8-qa-pipeline
  cancel-in-progress: false

jobs:
  sync-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDO_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_ID }}
      CUDO_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_SECRET }}
      CUDO_GOOGLE_REFRESH_TOKEN: ${{ secrets.CUDO_GOOGLE_REFRESH_TOKEN }}

    steps:
      - name: Checkout qa-v8-google-data
        uses: actions/checkout@v4
        with:
          ref: qa-v8-google-data
          path: source
          fetch-depth: 0

      - name: Validar credenciales Google
        shell: bash
        run: |
          set -euo pipefail
          for v in CUDO_GOOGLE_OAUTH_CLIENT_ID CUDO_GOOGLE_OAUTH_CLIENT_SECRET CUDO_GOOGLE_REFRESH_TOKEN; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v no está configurado"
              exit 1
            fi
          done

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validar autoridad única del pipeline QA
        working-directory: source
        run: python3 preview-v8/tools/validate_qa_pipeline.py

      - name: Sincronizar PUBLICO_EXPORT y materializar medios seguros
        working-directory: source
        run: |
          node preview-v8/tools/sync_google_publico.mjs
          node preview-v8/tools/normalize_public_ids.mjs

      - name: Validar contratos públicos y renderer Partidos
        working-directory: source
        run: |
          python3 preview-v8/tools/validate_data.py
          python3 preview-v8/tools/validate_partidos_vertical.py

      - name: Validar adapter QA sin mock
        working-directory: source
        run: |
          node --check preview-v8/shared/site.js
          node --check preview-v8/shared/seed-data.js
          node --check preview-v8/shared/data-source.js
          node --check preview-v8/shared/page-ux.js
          node --check preview-v8/tools/qa_google_render.mjs
          node --check preview-v8/tools/visual_qa.mjs
          node --check preview-v8/tools/sync_google_publico.mjs
          node --check preview-v8/tools/normalize_public_ids.mjs
          python3 - <<'PY'
          from pathlib import Path
          adapter=Path('preview-v8/shared/data-source.js').read_text(encoding='utf-8')
          shim=Path('preview-v8/shared/seed-data.js').read_text(encoding='utf-8')
          assert "environment:'QA'" in adapter
          assert 'mock:false' in adapter
          for token in ['CUDO_SEED_DATA','randomuser.me','VISTA DEMOSTRATIVA','FOTO MOCK']:
              assert token not in adapter+'\n'+shim, token
          print('QA Google sin fallback mock: OK')
          PY

      - name: Instalar Playwright
        working-directory: source
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Levantar preview QA real
        working-directory: source
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/cudo-qa-http.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4173/preview-v8/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/cudo-qa-http.log
          exit 1

      - name: Validar render E2E Google a V8
        working-directory: source
        run: node preview-v8/tools/qa_google_render.mjs

      - name: Validar responsive y dimensiones de medios reales
        working-directory: source
        run: node preview-v8/tools/visual_qa.mjs

      - name: Guardar evidencia visual E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cudo-v8-responsive-media-${{ github.run_id }}
          path: source/qa-v8-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit datos y medios QA sólo si cambiaron
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview-v8/data/*.json
          if [ -d preview-v8/media ]; then git add preview-v8/media; fi
          if git diff --cached --quiet; then
            echo 'PUBLICO_EXPORT y medios sin cambios; rama QA no requiere commit.'
          else
            git commit -m "QA data/media sync: Google PUBLICO_EXPORT"
            git push origin HEAD:qa-v8-google-data
          fi

      - name: Checkout main como destino
        uses: actions/checkout@v4
        with:
          ref: main
          path: publish
          fetch-depth: 0

      - name: Publicar snapshot QA validado
        shell: bash
        run: |
          set -euo pipefail
          rm -rf publish/qa-v8-google
          mkdir -p publish/qa-v8-google
          rsync -a --delete source/preview-v8/ publish/qa-v8-google/
          cat > publish/qa-v8-google/QA_BUILD.json <<EOF
          {
            "environment": "QA",
            "source_branch": "qa-v8-google-data",
            "source_commit": "$(git -C source rev-parse HEAD)",
            "workflow_run": "${GITHUB_RUN_ID}",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Commit publicación main sólo si cambió
        working-directory: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa-v8-google
          if git diff --cached --quiet; then
            echo 'Snapshot QA sin cambios; main no requiere commit.'
            exit 0
          fi
          git commit -m "QA publish E2E: ${GITHUB_RUN_ID}"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Conflicto real al rebasar publicación QA sobre main"
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Publicación QA integrada en main en intento ${attempt}."
              exit 0
            fi
            echo "main avanzó durante publicación; reintentando (${attempt}/3)..."
            sleep $((attempt * 2))
          done

          echo '::error::No fue posible publicar QA tras 3 intentos por movimientos concurrentes de main'
          exit 1

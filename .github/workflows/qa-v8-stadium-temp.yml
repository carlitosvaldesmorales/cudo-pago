name: CUDO V8 - QA estadio todas las vistas

on:
  push:
    branches:
      - v8-stadium-all-pages

permissions:
  contents: write

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v8-stadium-all-pages
          fetch-depth: 0

      - name: Verificar referencias y asset
        run: |
          test -f assets/estadio-cudo-hero.avif
          test "$(wc -c < assets/estadio-cudo-hero.avif)" -eq 59506
          ! grep -RIn --exclude-dir=.git 'assets/estadio-v2.webp' preview-v8
          ! grep -RIn --exclude-dir=.git 'faithful-hero-59506?v=' preview-v8
          grep -RIn --exclude-dir=.git 'estadio-cudo-hero.avif' preview-v8

      - name: Higiene de arquitectura V8
        run: |
          test -f preview-v8/shared/site-runtime-v8.js
          test ! -f preview-v8/shared/site-core.js
          if grep -R "preview-v7" preview-v8/shared preview-v8/*.html preview-v8/*/index.html --include='*.js' --include='*.html'; then
            echo "V8 no puede depender de rutas o runtime V7"
            exit 1
          fi

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Levantar preview local
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/cudo-v8-http.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4173/preview-v8/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/cudo-v8-http.log
          exit 1

      - name: Diagnosticar overflow movil
        run: node preview-v8/tools/overflow_diag.mjs

      - name: Ejecutar QA visual integral V8
        run: node preview-v8/tools/visual_qa.mjs

      - name: Subir evidencia visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cudo-v8-stadium-all-pages-qa
          path: qa-v8-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Retirar workflow temporal
        if: success()
        run: |
          rm -f .github/workflows/qa-v8-stadium-temp.yml
          git config user.name "carlitosvaldesmorales"
          git config user.email "carlos.valdes.morales@gmail.com"
          git add .github/workflows/qa-v8-stadium-temp.yml
          git commit -m "QA: retirar gate temporal foto estadio"
          git push origin HEAD:v8-stadium-all-pages

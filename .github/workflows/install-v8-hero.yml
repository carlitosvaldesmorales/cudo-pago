name: Install V8 faithful hero

on:
  push:
    branches:
      - hero-restored-v8
    paths:
      - ".github/workflows/install-v8-hero.yml"

permissions:
  contents: write

jobs:
  build-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstituir y verificar foto restaurada
        shell: bash
        run: |
          cat .tmp/hero/part* | base64 -d > assets/estadio-cudo-hero.avif
          test "$(stat -c%s assets/estadio-cudo-hero.avif)" = "59506"
          echo "bf2501a181cd666469314ccef586a0c9abc8fdf3335ef480d6ae4d1b6d75c0e9  assets/estadio-cudo-hero.avif" | sha256sum -c -

      - name: Configurar hero V8
        shell: bash
        run: |
          cat > preview-v8/shared/hero-image.css <<'CSS'
          /* CUDO V8 · Foto real restaurada sin regeneración IA.
             Rostros, escudo, lienzos, camisetas y textos reales preservados. */
          .view-home .hero-v8{
            background-image:url('../../assets/estadio-cudo-hero.avif?v=faithful-hero-59506');
            background-size:cover;
            background-repeat:no-repeat;
            background-position:center 50%;
          }
          CSS
          rm -rf .tmp/hero

      - name: Guardar asset verificado
        shell: bash
        run: |
          git config user.name "CUDO QA"
          git config user.email "sistemas@cudo.cl"
          git add -A assets/estadio-cudo-hero.avif preview-v8/shared/hero-image.css .tmp/hero
          git commit -m "V8 Home: instalar foto restaurada fiel del estadio"
          git push

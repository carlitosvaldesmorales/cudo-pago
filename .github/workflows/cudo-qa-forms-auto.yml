name: CUDO QA Forms Auto

on:
  workflow_dispatch:
  push:
    branches:
      - cudo-qa-auto-01
    paths:
      - 'tools/google-forms-provisioner/**'
      - '.github/workflows/cudo-qa-forms-auto.yml'

permissions:
  contents: read

concurrency:
  group: cudo-qa-forms-auto
  cancel-in-progress: false

jobs:
  deploy-and-provision:
    runs-on: ubuntu-latest
    env:
      CUDO_APPS_SCRIPT_ID: 1NI73jgr_PFvrsHy27ejE_kLbTWwLbM1Y8Nyc6mRaWlcCaLlZrpEB3Ud8
      CUDO_APPS_SCRIPT_DEPLOYMENT_ID: AKfycbzfvr6SZM7wZGMv0qCFrhWE-z-YpNbyxxyBy4DxJOMWyIvUNU8zkMLsJxau4h0SVIKWuw
      CUDO_GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_JSON }}
      CUDO_GOOGLE_OAUTH_TOKENS_JSON: ${{ secrets.CUDO_GOOGLE_OAUTH_TOKENS_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate OAuth bootstrap
        shell: bash
        run: |
          set -euo pipefail
          for v in CUDO_GOOGLE_OAUTH_CLIENT_JSON CUDO_GOOGLE_OAUTH_TOKENS_JSON; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v no está configurado. Es bootstrap OAuth de una sola vez, no operación recurrente."
              exit 1
            fi
          done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Google API client
        working-directory: tools/google-forms-provisioner
        run: npm install --no-audit --no-fund

      - name: Update Apps Script, deploy version and provision QA
        working-directory: tools/google-forms-provisioner
        run: node runner.js

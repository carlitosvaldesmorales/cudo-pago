name: Certify CUDO Full Club OS Golden Mock

on:
  pull_request:
    branches: [qa-v8-mock]
    paths:
      - 'preview-v8/data/club-os-mock.json'
      - 'preview-v8/data/operacion.json'
      - 'preview-v8/data/finanzas.json'
      - 'preview-v8/data/recursos.json'
      - 'preview-v8/data/gobernanza.json'
      - 'preview-v8/data/evidencia.json'
      - 'preview-v8/data/mock-manifest.json'
      - 'preview-v8/shared/seed-data.js'
      - 'preview-v8/tools/validate_full_club_os_mock.mjs'
      - 'preview-v8/tools/certify_full_mock_admin_actions.mjs'
      - 'preview-v8/tools/certify_mock_source_fact_creation.mjs'
      - 'preview-v8/tools/certify_mock_event_lifecycle.mjs'
      - 'preview-v8/tools/certify_mock_club_to_sports.mjs'
      - 'preview-v8/tools/certify_mock_membership_dues.mjs'
      - 'preview-v8/tools/certify_mock_sanction_fine_eligibility.mjs'
      - 'preview-v8/tools/certify_mock_facility_damage_compensation.mjs'
      - 'preview-v8/shared/mock-sports-projection.mjs'
      - 'preview-v8/partidos/index.html'
      - 'preview-v8/shared/mock-admin-engine.mjs'
      - 'preview-v8/admin/index.html'
      - 'preview-v8/index.html'
      - 'preview-v8/club-os-mock/index.html'
      - '.github/workflows/certify-cudo-full-club-os-mock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate syntax
        run: |
          node --check preview-v8/tools/validate_full_club_os_mock.mjs
          node --check preview-v8/shared/mock-admin-engine.mjs
          node --check preview-v8/tools/certify_full_mock_admin_actions.mjs
          node --check preview-v8/tools/certify_mock_source_fact_creation.mjs
          node --check preview-v8/tools/certify_mock_event_lifecycle.mjs
          node --check preview-v8/shared/mock-sports-projection.mjs
          node --check preview-v8/tools/certify_mock_club_to_sports.mjs
          node --check preview-v8/tools/certify_mock_membership_dues.mjs
          node --check preview-v8/tools/certify_mock_sanction_fine_eligibility.mjs
          node --check preview-v8/tools/certify_mock_facility_damage_compensation.mjs
      - name: Certify full Club OS golden mock
        run: node preview-v8/tools/validate_full_club_os_mock.mjs
      - name: Certify mock admin actions
        run: node preview-v8/tools/certify_full_mock_admin_actions.mjs
      - name: Certify mock source fact creation
        run: node preview-v8/tools/certify_mock_source_fact_creation.mjs
      - name: Certify mock event lifecycle
        run: node preview-v8/tools/certify_mock_event_lifecycle.mjs
      - name: Certify Club to sports projection
        run: node preview-v8/tools/certify_mock_club_to_sports.mjs
      - name: Certify membership dues
        run: node preview-v8/tools/certify_mock_membership_dues.mjs
      - name: Certify sanction fine to eligibility
        run: node preview-v8/tools/certify_mock_sanction_fine_eligibility.mjs
      - name: Certify facility damage compensation
        run: node preview-v8/tools/certify_mock_facility_damage_compensation.mjs

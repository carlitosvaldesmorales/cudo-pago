name: Certify CUDO Dependency Rule Registry

on:
  pull_request:
    branches: [main]
    paths:
      - 'qa-v8-google/contracts/cudo-dependency-rule-registry-v1.json'
      - 'qa-v8-google/contracts/cudo-dependency-rule-registry-schema-v1.json'
      - 'qa-v8-google/contracts/cudo-shared-object-fixture-v1.json'
      - 'qa-v8-google/tools/certify_dependency_rule_registry.mjs'
      - '.github/workflows/certify-cudo-dependency-rule-registry.yml'
  push:
    branches:
      - 'feat/cudo-dependency-rule-registry-v1'
    paths:
      - 'qa-v8-google/contracts/cudo-dependency-rule-registry-v1.json'
      - 'qa-v8-google/contracts/cudo-dependency-rule-registry-schema-v1.json'
      - 'qa-v8-google/contracts/cudo-shared-object-fixture-v1.json'
      - 'qa-v8-google/tools/certify_dependency_rule_registry.mjs'
      - '.github/workflows/certify-cudo-dependency-rule-registry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate registry certification syntax
        run: node --check qa-v8-google/tools/certify_dependency_rule_registry.mjs
      - name: Certify dependency rule registry
        run: node qa-v8-google/tools/certify_dependency_rule_registry.mjs

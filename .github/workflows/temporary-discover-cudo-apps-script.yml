name: Temporary discover CUDO Apps Script

on:
  push:
    paths:
      - '.github/workflows/temporary-discover-cudo-apps-script.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CUDO_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_ID }}
      CUDO_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_SECRET }}
      CUDO_GOOGLE_REFRESH_TOKEN: ${{ secrets.CUDO_GOOGLE_REFRESH_TOKEN }}
    steps:
      - name: Discover Apps Script projects through production OAuth
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          body=urllib.parse.urlencode({
            'client_id':os.environ['CUDO_GOOGLE_OAUTH_CLIENT_ID'],
            'client_secret':os.environ['CUDO_GOOGLE_OAUTH_CLIENT_SECRET'],
            'refresh_token':os.environ['CUDO_GOOGLE_REFRESH_TOKEN'],
            'grant_type':'refresh_token'
          }).encode()
          req=urllib.request.Request('https://oauth2.googleapis.com/token',data=body,headers={'Content-Type':'application/x-www-form-urlencoded'})
          with urllib.request.urlopen(req) as r: tok=json.load(r)
          access=tok['access_token']
          def get(url):
            req=urllib.request.Request(url,headers={'Authorization':'Bearer '+access})
            with urllib.request.urlopen(req) as r:return json.load(r)
          info=get('https://www.googleapis.com/oauth2/v3/tokeninfo?access_token='+urllib.parse.quote(access))
          scopes=sorted((info.get('scope') or '').split())
          print(json.dumps({'oauth_scopes':scopes},indent=2))
          q="mimeType='application/vnd.google-apps.script' and trashed=false"
          fields='files(id,name,mimeType,modifiedTime,webViewLink,parents)'
          url='https://www.googleapis.com/drive/v3/files?'+urllib.parse.urlencode({'q':q,'pageSize':100,'fields':fields,'orderBy':'modifiedTime desc'})
          try:
            d=get(url)
            files=d.get('files',[])
            print(json.dumps({'drive_apps_script_count':len(files),'projects':files},indent=2))
          except Exception as e:
            print(json.dumps({'drive_apps_script_query':'UNAVAILABLE','error':str(e)},indent=2))
          PY

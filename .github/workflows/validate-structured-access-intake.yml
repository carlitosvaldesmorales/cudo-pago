name: Validate Structured Access Intake

on:
  pull_request:
    branches: [feature/sports-event-bus-v1]
  push:
    branches:
      - refactor/structured-access-intake-v1
      - feature/sports-event-bus-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          set -euo pipefail
          node --check sports-bus/canonical-entry.js
          node --check sports-bus/worker/audience-access-policy.js
          node --check sports-bus/worker/access-request-intake-model.js
          node --check sports-bus/worker/access-request-intake-entry.js
          node --check qa/telegram/structured-access-intake-harness.mjs
      - name: Deterministic intake contract
        run: node qa/telegram/structured-access-intake-harness.mjs
      - name: Root invariants
        run: |
          set -euo pipefail
          grep -q 'INTENT_NEQ_SUBMISSION' docs/architecture/human-transaction-intake-adn-v1.md
          grep -q 'DRAFT_NEQ_PENDING' docs/architecture/human-transaction-intake-adn-v1.md
          grep -q 'CONFIRMATION_PRECEDES_PENDING' docs/architecture/human-transaction-intake-adn-v1.md
          grep -q 'TECHNICAL_IDENTITY_NEQ_DECLARED_PROFILE' docs/architecture/human-transaction-intake-adn-v1.md
          grep -q 'ForceReply' docs/architecture/human-transaction-intake-adn-v1.md
          grep -q "intake_contract:ACCESS_INTAKE_CONTRACT" sports-bus/worker/audience-access-policy.js
          grep -q "submission_requires_confirmation:true" sports-bus/worker/audience-access-policy.js
          grep -q 'handleAccessRequestIntake' sports-bus/canonical-entry.js

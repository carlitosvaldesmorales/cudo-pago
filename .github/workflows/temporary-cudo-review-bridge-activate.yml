name: Temporary activate CUDO Review Event Bridge

on:
  push:
    paths:
      - '.github/workflows/temporary-cudo-review-bridge-activate.yml'

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CUDO_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_ID }}
      CUDO_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_SECRET }}
      CUDO_GOOGLE_REFRESH_TOKEN: ${{ secrets.CUDO_GOOGLE_REFRESH_TOKEN }}
    steps:
      - name: Verify Script Property and install idempotent trigger through Apps Script Execution API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error

          SCRIPT_ID='1NI73jgr_PFvrsHy27ejE_kLbTWwLbM1Y8Nyc6mRaWlcCaLlZrpEB3Ud8'
          body=urllib.parse.urlencode({
            'client_id':os.environ['CUDO_GOOGLE_OAUTH_CLIENT_ID'],
            'client_secret':os.environ['CUDO_GOOGLE_OAUTH_CLIENT_SECRET'],
            'refresh_token':os.environ['CUDO_GOOGLE_REFRESH_TOKEN'],
            'grant_type':'refresh_token'
          }).encode()
          req=urllib.request.Request('https://oauth2.googleapis.com/token',data=body,headers={'Content-Type':'application/x-www-form-urlencoded'})
          with urllib.request.urlopen(req) as r:
            access=json.load(r)['access_token']

          def run(function):
            url=f'https://script.googleapis.com/v1/scripts/{SCRIPT_ID}:run'
            payload=json.dumps({'function':function,'devMode':True}).encode()
            req=urllib.request.Request(url,data=payload,headers={
              'Authorization':'Bearer '+access,
              'Content-Type':'application/json'
            },method='POST')
            try:
              with urllib.request.urlopen(req) as r:
                return json.load(r)
            except urllib.error.HTTPError as e:
              raw=e.read().decode('utf-8','replace')
              try: detail=json.loads(raw)
              except: detail={'raw':raw[:500]}
              print(json.dumps({'function':function,'http_status':e.code,'error':detail},indent=2))
              raise

          status_before=run('cudoReviewEventBridgeStatus')
          result_before=((status_before.get('response') or {}).get('result') or {})
          print(json.dumps({
            'status_before':{
              'token_configured':bool(result_before.get('token_configured')),
              'trigger_count':result_before.get('trigger_count')
            }
          },indent=2))
          if not result_before.get('token_configured'):
            raise SystemExit('CUDO_GITHUB_ACTIONS_TOKEN no detectado en Script Properties')

          install=run('installCudoReviewEventBridge')
          install_result=((install.get('response') or {}).get('result') or {})
          status_after=run('cudoReviewEventBridgeStatus')
          result_after=((status_after.get('response') or {}).get('result') or {})
          report={
            'ok': bool(install_result.get('ok')) and result_after.get('trigger_count')==1,
            'token_configured': bool(result_after.get('token_configured')),
            'trigger_count': result_after.get('trigger_count'),
            'deleted_previous': install_result.get('deleted_previous')
          }
          print(json.dumps(report,indent=2))
          if not report['ok']:
            raise SystemExit('Event bridge activation verification failed')
          PY

name: Certify CUDO Shared Object Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'qa-v8-google/contracts/cudo-shared-object-contract-v1.json'
      - 'qa-v8-google/contracts/cudo-shared-object-fixture-v1.json'
      - 'qa-v8-google/tools/certify_shared_object_contract.mjs'
      - '.github/workflows/certify-cudo-shared-object-contract.yml'
  push:
    branches:
      - 'feat/cudo-shared-object-contract-v1'
    paths:
      - 'qa-v8-google/contracts/cudo-shared-object-contract-v1.json'
      - 'qa-v8-google/contracts/cudo-shared-object-fixture-v1.json'
      - 'qa-v8-google/tools/certify_shared_object_contract.mjs'
      - '.github/workflows/certify-cudo-shared-object-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate certification syntax
        run: node --check qa-v8-google/tools/certify_shared_object_contract.mjs
      - name: Certify shared object contract
        run: node qa-v8-google/tools/certify_shared_object_contract.mjs

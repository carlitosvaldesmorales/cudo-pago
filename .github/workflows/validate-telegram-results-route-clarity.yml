name: Validate Telegram Results Route Clarity

on:
  pull_request:
    branches: [feature/sports-event-bus-v1]
    paths:
      - 'sports-bus/telegram-route-clarity-entry.js'
      - 'sports-bus/worker/public-results-table-view.js'
      - 'sports-bus/wrangler.toml'
      - 'qa/telegram/results-route-clarity-harness.mjs'
      - '.github/workflows/validate-telegram-results-route-clarity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          node --check sports-bus/telegram-route-clarity-entry.js
          node --check sports-bus/worker/public-results-table-view.js
          node --check qa/telegram/results-route-clarity-harness.mjs
      - name: Validate complete aligned public-results view
        run: |
          set -euo pipefail
          node qa/telegram/results-route-clarity-harness.mjs | tee /tmp/route-clarity.log
          grep -q 'PASS next /resultados uses approved public matrix' /tmp/route-clarity.log
          grep -q 'PASS primary /resultados uses the same approved public matrix' /tmp/route-clarity.log
          grep -q 'PASS secondary search navigation works on primary without changing semantics' /tmp/route-clarity.log
          grep -q 'PASS secondary search navigation works on next' /tmp/route-clarity.log
          grep -q 'PASS bot/slot no longer changes RESULTS-READ semantics' /tmp/route-clarity.log
          grep -q 'RESULT: PASS' /tmp/route-clarity.log

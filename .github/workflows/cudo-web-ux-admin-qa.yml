name: CUDO Web UX Admin QA

on:
  push:
    branches:
      - cudo-web-ux-01-v8
    paths:
      - 'preview-v8/admin/**'
      - 'preview-v8/tools/qa_admin_entry.mjs'
      - '.github/workflows/cudo-web-ux-admin-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate human admin entry
        run: node preview-v8/tools/qa_admin_entry.mjs

name: Validate Telegram Global Admin Results

on:
  pull_request:
    branches:
      - feature/sports-event-bus-v1
    paths:
      - 'sports-bus/worker/global-admin-results-entry.js'
      - 'sports-bus/cors-entry.js'
      - 'qa/telegram/global-admin-results-harness.mjs'
      - '.github/workflows/validate-global-admin-results.yml'
  push:
    branches:
      - feature/sports-event-bus-v1
      - fix/telegram-global-admin-results-01
    paths:
      - 'sports-bus/worker/global-admin-results-entry.js'
      - 'sports-bus/cors-entry.js'
      - 'qa/telegram/global-admin-results-harness.mjs'
      - '.github/workflows/validate-global-admin-results.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          set -euo pipefail
          node --check sports-bus/worker/global-admin-results-entry.js
          node --check sports-bus/cors-entry.js
          node --check qa/telegram/global-admin-results-harness.mjs
      - name: Validate global result registration contract
        run: |
          set -euo pipefail
          node qa/telegram/global-admin-results-harness.mjs | tee /tmp/global-admin-results.log
          grep -q 'PASS SUPER_ADMIN without club_id reaches global result registration through existing dashboard' /tmp/global-admin-results.log
          grep -q 'PASS global date view exposes all matches instead of one club scope' /tmp/global-admin-results.log
          grep -q 'PASS choosing a missing series stages capture without premature mutation' /tmp/global-admin-results.log
          grep -q 'PASS command escape clears staged global capture without mutation' /tmp/global-admin-results.log
          grep -q 'PASS first global official result is VERIFIED with actor, audit and null club scope' /tmp/global-admin-results.log
          grep -q 'PASS existing governed result cannot be silently overwritten and redirects to governance' /tmp/global-admin-results.log
          grep -q 'PASS legacy /mispartidos bridges SUPER_ADMIN to global registration' /tmp/global-admin-results.log
          grep -q 'PASS CLUB_ADMIN remains on its existing club-scoped surface' /tmp/global-admin-results.log
          grep -q 'RESULT: PASS' /tmp/global-admin-results.log

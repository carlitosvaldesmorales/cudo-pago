name: Validate Telegram Global Admin Results

on:
  pull_request:
    branches:
      - feature/sports-event-bus-v1
    paths:
      - 'sports-bus/worker/global-admin-results-entry.js'
      - 'sports-bus/cors-entry.js'
      - 'qa/telegram/global-admin-results-harness.mjs'
      - '.github/workflows/validate-global-admin-results.yml'
  push:
    branches:
      - feature/sports-event-bus-v1
      - fix/telegram-global-admin-label-01
    paths:
      - 'sports-bus/worker/global-admin-results-entry.js'
      - 'sports-bus/cors-entry.js'
      - 'qa/telegram/global-admin-results-harness.mjs'
      - '.github/workflows/validate-global-admin-results.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          set -euo pipefail
          node --check sports-bus/worker/global-admin-results-entry.js
          node --check sports-bus/cors-entry.js
          node --check qa/telegram/global-admin-results-harness.mjs
      - name: Validate global all-results administration contract
        run: |
          set -euo pipefail
          node qa/telegram/global-admin-results-harness.mjs | tee /tmp/global-admin-results.log
          grep -q 'PASS SUPER_ADMIN dashboard exposes Administrar todos los resultados and no club-scoped wording' /tmp/global-admin-results.log
          grep -q 'PASS global result administration spans every match in the selected date' /tmp/global-admin-results.log
          grep -q 'PASS missing series can be registered without premature mutation' /tmp/global-admin-results.log
          grep -q 'PASS leaving staged capture clears it without mutation' /tmp/global-admin-results.log
          grep -q 'PASS first official result is VERIFIED with SUPER_ADMIN actor and audit' /tmp/global-admin-results.log
          grep -q 'PASS existing official result exposes correct/dispute/annul/history from the same global surface' /tmp/global-admin-results.log
          grep -q 'PASS existing governed result cannot be silently overwritten' /tmp/global-admin-results.log
          grep -q 'PASS legacy /mispartidos remains a compatibility bridge to global administration' /tmp/global-admin-results.log
          grep -q 'PASS CLUB_ADMIN remains on its club-scoped surface' /tmp/global-admin-results.log
          grep -q 'RESULT: PASS' /tmp/global-admin-results.log

name: Certify CUDO Event Resource Governed Persistence

on:
  pull_request:
    branches: [main]
    paths:
      - 'qa-v8-google/state/event-resource-state.json'
      - 'qa-v8-google/data/event-resource-qa.json'
      - 'qa-v8-google/tools/process_event_resource_requests.mjs'
      - 'qa-v8-google/tools/event_resource_requests_fixture_harness.mjs'
      - 'qa-v8-google/tools/event_resource_google_adapter_fixture_harness.mjs'
      - '.github/workflows/certify-cudo-event-resource-governed-persistence.yml'
  push:
    branches:
      - 'agent/match-full-club-day-roundtrip-20260921'
    paths:
      - 'qa-v8-google/state/event-resource-state.json'
      - 'qa-v8-google/data/event-resource-qa.json'
      - 'qa-v8-google/tools/process_event_resource_requests.mjs'
      - 'qa-v8-google/tools/event_resource_requests_fixture_harness.mjs'
      - '.github/workflows/certify-cudo-event-resource-governed-persistence.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate governed event persistence syntax
        run: |
          node --check qa-v8-google/tools/process_event_resource_requests.mjs
          node --check qa-v8-google/tools/event_resource_requests_fixture_harness.mjs
          node --check qa-v8-google/tools/event_resource_google_adapter_fixture_harness.mjs
      - name: Re-certify canonical dependencies used by the event processor
        run: |
          node qa-v8-google/tools/certify_dependency_rule_registry.mjs
          node qa-v8-google/tools/certify_generic_propagation_executor.mjs
          node qa-v8-google/tools/certify_transaction_override_contract.mjs
          node qa-v8-google/tools/certify_projection_persistence_adapters.mjs
      - name: Certify Match and Bingo governed persistence roundtrip
        run: node qa-v8-google/tools/event_resource_requests_fixture_harness.mjs
      - name: Certify Google QA request adapter plan
        run: node qa-v8-google/tools/event_resource_google_adapter_fixture_harness.mjs

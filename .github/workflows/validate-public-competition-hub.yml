name: Validate Public Competition Hub

on:
  pull_request:
    branches: [feature/sports-event-bus-v1]
  push:
    branches:
      - feature/public-competition-hub-v1
      - feature/standings-2026-official-rules
      - refactor/championship-adn-canonical-bot
      - feature/sports-event-bus-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          set -euo pipefail
          node --check sports-bus/canonical-entry.js
          node --check sports-bus/telegram-migration-entry.js
          node --check sports-bus/worker/telegram-channel-contract.js
          node --check sports-bus/worker/competition-domain.js
          node --check sports-bus/worker/public-competition-hub-entry.js
          node --check sports-bus/worker/public-standings-entry.js
          node --check qa/telegram/public-competition-hub-harness.mjs
          node --check qa/web/public-standings-harness.mjs
      - name: Competition Hub contract
        run: node qa/telegram/public-competition-hub-harness.mjs
      - name: Championship domain contract
        run: node qa/web/public-standings-harness.mjs
      - name: ADN source contract
        run: |
          set -euo pipefail
          grep -q 'CAMPEONATO_PRINCIPAL_MAX_9_PUNTOS_POR_JORNADA' docs/architecture/competition-domain-adn-v2.md
          grep -q 'SENIOR_ES_CAMPEONATO_INDEPENDIENTE' docs/architecture/competition-domain-adn-v2.md
          grep -q '@FutbolChepicaBot' docs/architecture/telegram-canonical-channel-v1.md
          grep -q 'CANONICAL_TELEGRAM_BOT_EQ_FUTBOLCHEPICABOT' docs/product/module-registry.json
          grep -q 'PRINCIPAL_MATCHDAY_MAX_POINTS_EQ_9' docs/product/module-registry.json
          grep -q "goal_difference_is_tiebreaker:false" sports-bus/worker/public-standings-entry.js

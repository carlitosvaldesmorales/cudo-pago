name: Validate Public Competition Hub

on:
  pull_request:
    branches: [feature/sports-event-bus-v1]
  push:
    branches:
      - feature/public-competition-hub-v1
      - feature/sports-event-bus-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          set -euo pipefail
          node --check sports-bus/canonical-entry.js
          node --check sports-bus/worker/public-competition-hub-entry.js
          node --check qa/telegram/public-competition-hub-harness.mjs
      - name: Competition Hub contract
        run: node qa/telegram/public-competition-hub-harness.mjs
      - name: Standings source gap remains explicit
        run: |
          set -euo pipefail
          grep -q 'NO IMPLEMENTAR TABLA HASTA RESOLVER' ops/STANDINGS-RULES-GAP-01.md
          grep -q 'No calcularemos una tabla usando supuestos' sports-bus/worker/public-competition-hub-entry.js
          ! grep -Eq 'victoria.{0,20}=.{0,20}3|empate.{0,20}=.{0,20}1' sports-bus/worker/public-competition-hub-entry.js

name: Validate Public Competition Hub

on:
  pull_request:
    branches: [feature/sports-event-bus-v1]
  push:
    branches:
      - feature/public-competition-hub-v1
      - feature/standings-2026-official-rules
      - refactor/championship-adn-canonical-bot
      - refactor/standings-presentation-model-v1
      - fix/standings-telegram-v3
      - feature/sports-event-bus-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          set -euo pipefail
          node --check sports-bus/canonical-entry.js
          node --check sports-bus/telegram-migration-entry.js
          node --check sports-bus/worker/telegram-channel-contract.js
          node --check sports-bus/worker/competition-domain.js
          node --check sports-bus/worker/public-competition-hub-entry.js
          node --check sports-bus/worker/public-standings-entry.js
          node --check sports-bus/worker/public-presentation-model.js
          node --check sports-bus/worker/telegram-presentation-renderer.js
          node --check qa/telegram/public-competition-hub-harness.mjs
          node --check qa/web/public-standings-harness.mjs
      - name: Competition Hub + Presentation Model contract
        run: node qa/telegram/public-competition-hub-harness.mjs
      - name: Championship domain contract
        run: node qa/web/public-standings-harness.mjs
      - name: ADN source contract
        run: |
          set -euo pipefail
          grep -q 'CAMPEONATO_PRINCIPAL_MAX_9_PUNTOS_POR_JORNADA' docs/architecture/competition-domain-adn-v2.md
          grep -q 'SENIOR_ES_CAMPEONATO_INDEPENDIENTE' docs/architecture/competition-domain-adn-v2.md
          grep -q 'HUMAN_OUTPUT_REQUIRES_PRESENTATION_MODEL' docs/architecture/human-presentation-adn-v1.md
          grep -q 'DATA_CORRECT_NEQ_CONSUMABLE_UX' docs/architecture/human-presentation-adn-v1.md
          grep -q 'CHANNEL_FORMAT_MUST_FIT_TARGET_DEVICE' docs/architecture/human-presentation-adn-v1.md
          grep -q 'ONE_CHAMPIONSHIP_SCREEN_CONTAINS_ALL_GROUPS' docs/product/standings-read-telegram-presentation-contract-v3.md
          grep -q 'NO_GROUP_NAVIGATION_IN_PUBLIC_STANDINGS' docs/product/standings-read-telegram-presentation-contract-v3.md
          grep -q 'NO_HORIZONTAL_SCROLL_IN_TELEGRAM_STANDINGS' docs/product/standings-read-telegram-presentation-contract-v3.md
          grep -q 'IMPLEMENTED_PENDING_HUMAN_APPROVAL' docs/product/standings-read-telegram-presentation-contract-v3.md
          grep -q '@FutbolChepicaBot' docs/architecture/telegram-canonical-channel-v1.md
          grep -q 'CANONICAL_TELEGRAM_BOT_EQ_FUTBOLCHEPICABOT' docs/product/module-registry.json
          grep -q 'STANDINGS_PUBLIC_VIEW_EQ_ONE_CHAMPIONSHIP_ALL_GROUPS' docs/product/module-registry.json
          grep -q 'NO_HORIZONTAL_SCROLL_IN_TELEGRAM_STANDINGS' docs/product/module-registry.json
          grep -q '"module_id": "STANDINGS-READ"' docs/product/module-registry.json
          grep -q 'REAL_TELEGRAM_STANDINGS_PRESENTATION_V3_APPROVAL_ON_FUTBOLCHEPICABOT' docs/product/module-registry.json
          grep -q "goal_difference_is_tiebreaker:false" sports-bus/worker/public-standings-entry.js

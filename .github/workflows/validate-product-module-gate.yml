name: Validate Product Module Gate

on:
  pull_request:
    branches:
      - feature/sports-event-bus-v1
  push:
    branches:
      - feature/sports-event-bus-v1
      - fix/product-module-consumption-gate-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate registry schema and maturity evidence
        run: |
          set -euo pipefail
          node --check qa/architecture/product-module-gate.mjs
          node qa/architecture/product-module-gate.mjs
      - name: Self-test blocking behavior
        run: |
          set -euo pipefail
          if CHANGED_FILES='sports-bus/worker/contributor-observation-entry.js' node qa/architecture/product-module-gate.mjs; then
            echo 'Gate failed to block implementation ahead of PRODUCT_VALIDATED' >&2
            exit 1
          fi
          CHANGED_FILES='docs/architecture/product-module-consumption-gate-v1.md' node qa/architecture/product-module-gate.mjs
          echo 'PASS gate blocks protected runtime work and allows non-runtime architecture work'
      - name: Block implementation ahead of product validation
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED_FILES="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          printf '%s\n' "$CHANGED_FILES"
          CHANGED_FILES="$CHANGED_FILES" node qa/architecture/product-module-gate.mjs

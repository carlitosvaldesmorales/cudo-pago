name: Validate Product Module Gate

on:
  pull_request:
    branches:
      - feature/sports-event-bus-v1
  push:
    branches:
      - feature/sports-event-bus-v1
      - fix/product-module-consumption-gate-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate registry schema and maturity evidence
        run: |
          set -euo pipefail
          node --check qa/architecture/product-module-gate.mjs
          node qa/architecture/product-module-gate.mjs
      - name: Block implementation ahead of product validation
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED_FILES="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          printf '%s\n' "$CHANGED_FILES"
          CHANGED_FILES="$CHANGED_FILES" node qa/architecture/product-module-gate.mjs

name: CUDO Admin Pipeline Readonly Audit

on:
  push:
    paths:
      - '.github/workflows/cudo-admin-pipeline-readonly-audit.yml'
      - 'qa-v8-google/tools/admin_pipeline_readonly_audit.mjs'
      - 'qa-v8-google/tools/apps_script_formapp_source_probe.mjs'
      - 'qa-v8-google/tools/execute_existing_form_audit.mjs'
      - 'qa-v8-google/apps-script/CudoAdminReadonlyAudit.gs'
      - 'qa-v8-google/contracts/**'
      - 'preview-v8/admin/**'
      - 'qa-v8-google/tools/process_review_decisions.mjs'
      - 'preview-v8/tools/sync_google_publico.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CUDO_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_ID }}
      CUDO_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_SECRET }}
      CUDO_GOOGLE_REFRESH_TOKEN: ${{ secrets.CUDO_GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate audit syntax
        run: |
          node --check qa-v8-google/tools/admin_pipeline_readonly_audit.mjs
          node --check qa-v8-google/tools/apps_script_formapp_source_probe.mjs
          node --check qa-v8-google/tools/execute_existing_form_audit.mjs

      - name: Probe existing Apps Script FormApp capabilities read-only
        run: node qa-v8-google/tools/apps_script_formapp_source_probe.mjs

      - name: Execute existing Apps Script FormAudit read-only
        run: node qa-v8-google/tools/execute_existing_form_audit.mjs

      - name: Execute temporary FormApp destination audit and restore Apps Script source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-admin-audit
          python3 - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          sid='1NI73jgr_PFvrsHy27ejE_kLbTWwLbM1Y8Nyc6mRaWlcCaLlZrpEB3Ud8'
          helper=pathlib.Path('qa-v8-google/apps-script/CudoAdminReadonlyAudit.gs').read_text()
          body=urllib.parse.urlencode({
            'client_id':os.environ['CUDO_GOOGLE_OAUTH_CLIENT_ID'],
            'client_secret':os.environ['CUDO_GOOGLE_OAUTH_CLIENT_SECRET'],
            'refresh_token':os.environ['CUDO_GOOGLE_REFRESH_TOKEN'],
            'grant_type':'refresh_token'
          }).encode()
          with urllib.request.urlopen(urllib.request.Request('https://oauth2.googleapis.com/token',data=body,headers={'Content-Type':'application/x-www-form-urlencoded'})) as r:
            access=json.load(r)['access_token']
          content_url=f'https://script.googleapis.com/v1/projects/{sid}/content'
          def call_content(method='GET',payload=None):
            req=urllib.request.Request(content_url,data=None if payload is None else json.dumps(payload).encode(),headers={'Authorization':'Bearer '+access,'Content-Type':'application/json'},method=method)
            with urllib.request.urlopen(req) as r:
              raw=r.read(); return json.loads(raw) if raw else {}
          current=call_content()
          original=[{'name':f['name'],'type':f['type'],'source':f.get('source','')} for f in current.get('files',[])]
          if any(f['name']=='CudoAdminReadonlyAudit' for f in original):
            raise SystemExit('Temporary helper unexpectedly already present before audit')
          modified=original+[{'name':'CudoAdminReadonlyAudit','type':'SERVER_JS','source':helper}]
          try:
            call_content('PUT',{'files':modified})
            run_req=urllib.request.Request(
              f'https://script.googleapis.com/v1/scripts/{sid}:run',
              data=json.dumps({'function':'cudoAdminReadonlyAudit','devMode':True}).encode(),
              headers={'Authorization':'Bearer '+access,'Content-Type':'application/json'},
              method='POST')
            with urllib.request.urlopen(run_req) as r:
              execution=json.load(r)
            if execution.get('error'):
              raise RuntimeError(json.dumps(execution['error']))
            result=((execution.get('response') or {}).get('result') or {})
            pathlib.Path('qa-admin-audit/formapp-destination-audit.json').write_text(json.dumps({'ok':True,'mode':'TEMPORARY_READONLY_FORMAPP_AUDIT','result':result},indent=2)+'\n')
            print(json.dumps({'ok':True,'mode':'TEMPORARY_READONLY_FORMAPP_AUDIT','result':result},indent=2))
          finally:
            call_content('PUT',{'files':original})
            verify=call_content()
            names=[f.get('name') for f in verify.get('files',[])]
            if 'CudoAdminReadonlyAudit' in names:
              raise RuntimeError('Temporary helper was not removed')
            print(json.dumps({'apps_script_source_restored':True,'file_count':len(names)},indent=2))
          PY

      - name: Audit eight live Administration entry points read-only
        run: node qa-v8-google/tools/admin_pipeline_readonly_audit.mjs

      - name: Print sanitized read-only report
        run: cat qa-admin-audit/admin-pipeline-readonly-report.json

      - name: Re-run real Google PUBLICO_EXPORT sync only in runner workspace
        run: node preview-v8/tools/sync_google_publico.mjs

      - name: Validate public V8 contracts after live sync
        run: python3 preview-v8/tools/validate_data.py preview-v8/data

      - name: Require zero tracked or untracked drift in public data/media
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(git status --porcelain --untracked-files=all -- preview-v8/data preview-v8/media)"
          if [ -n "$STATUS" ]; then
            echo "$STATUS"
            echo 'Live Google PUBLICO_EXPORT is not aligned with versioned V8 output.' >&2
            exit 1
          fi
          echo 'V8 public data/media aligned with live Google output.'

      - name: Upload sanitized read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cudo-admin-pipeline-readonly-${{ github.run_id }}
          path: qa-admin-audit/*.json
          if-no-files-found: warn
          retention-days: 14

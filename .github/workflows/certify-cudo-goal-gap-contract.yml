name: Certify CUDO Goal Gap Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'qa-v8-google/contracts/cudo-shared-object-contract-v1.json'
      - 'qa-v8-google/tools/certify_shared_object_contract.mjs'
      - 'qa-v8-google/contracts/cudo-goal-gap-contract-v1.json'
      - 'qa-v8-google/tools/goal_gap_contract.mjs'
      - 'qa-v8-google/tools/certify_goal_gap_contract.mjs'
      - '.github/workflows/certify-cudo-goal-gap-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Re-certify shared object contract
        run: node qa-v8-google/tools/certify_shared_object_contract.mjs
      - name: Validate goal gap syntax
        run: node --check qa-v8-google/tools/goal_gap_contract.mjs
      - name: Validate goal gap certification syntax
        run: node --check qa-v8-google/tools/certify_goal_gap_contract.mjs
      - name: Certify goal gap contract
        run: node qa-v8-google/tools/certify_goal_gap_contract.mjs

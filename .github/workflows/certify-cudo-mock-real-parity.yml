name: Certify CUDO Mock Real Contract Parity

on:
  pull_request:
    branches: [main, qa-v8-mock]
    paths:
      - 'preview-v8/contracts/cudo-mock-real-contract-parity-v1.json'
      - 'preview-v8/tools/certify_mock_real_contract_parity.mjs'
      - 'preview-v8/shared/mock-admin-engine.mjs'
      - 'preview-v8/data/mock-manifest.json'
      - 'preview-v8/data/operacion.json'
      - 'qa-v8-google/contracts/cudo-work-item-contract-v1.json'
      - 'qa-v8-google/tools/work_item_engine.mjs'
      - 'qa-v8-google/data/operacion.json'
      - '.github/workflows/certify-cudo-mock-real-parity.yml'
  push:
    branches: [main, qa-v8-mock]
    paths:
      - 'preview-v8/contracts/cudo-mock-real-contract-parity-v1.json'
      - 'preview-v8/tools/certify_mock_real_contract_parity.mjs'
      - 'preview-v8/shared/mock-admin-engine.mjs'
      - 'preview-v8/data/mock-manifest.json'
      - 'preview-v8/data/operacion.json'
      - 'qa-v8-google/contracts/cudo-work-item-contract-v1.json'
      - 'qa-v8-google/tools/work_item_engine.mjs'
      - 'qa-v8-google/data/operacion.json'
      - '.github/workflows/certify-cudo-mock-real-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical comparison branches
        run: |
          git fetch origin main:refs/remotes/origin/main --force
          git fetch origin qa-v8-mock:refs/remotes/origin/qa-v8-mock --force
      - name: Resolve parity direction
        shell: bash
        run: |
          BASE="${{ github.base_ref }}"
          REF="${{ github.ref_name }}"
          if [[ "$BASE" == "main" || "$REF" == "main" ]]; then
            echo "CUDO_REAL_REF=HEAD" >> "$GITHUB_ENV"
            echo "CUDO_MOCK_REF=origin/qa-v8-mock" >> "$GITHUB_ENV"
          else
            echo "CUDO_REAL_REF=origin/main" >> "$GITHUB_ENV"
            echo "CUDO_MOCK_REF=HEAD" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate parity certifier syntax
        run: node --check preview-v8/tools/certify_mock_real_contract_parity.mjs
      - name: Certify governed Mock Real QA parity
        run: node preview-v8/tools/certify_mock_real_contract_parity.mjs

name: Validate Chépica Play Audience

on:
  pull_request:
    branches: [feature/sports-event-bus-v1]
  push:
    branches:
      - fix/chepica-play-audience-gate-v1
      - fix/admin-chepica-play-context-v1
      - feature/sports-event-bus-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          set -euo pipefail
          node --check sports-bus/canonical-entry.js
          node --check sports-bus/worker/telegram-chepica-play-home-entry.js
          node --check sports-bus/worker/telegram-entry-context.js
          node --check qa/telegram/chepica-play-audience-harness.mjs
          node --check qa/telegram/chepica-play-admin-context-harness.mjs
      - name: Chépica Play audience contract
        run: node qa/telegram/chepica-play-audience-harness.mjs
      - name: Chépica Play actor-context audit contract
        run: node qa/telegram/chepica-play-admin-context-harness.mjs
      - name: Preserve existing two-capability contract
        run: |
          set -euo pipefail
          grep -q "PARTNER_CAPABILITIES=\[CAPABILITY.READ_COMPETITION,CAPABILITY.OBSERVE_RESULT\]" sports-bus/worker/media-partner-enrollment-entry.js
          grep -q "Ingresar resultados" sports-bus/worker/telegram-chepica-play-home-entry.js
          grep -q "Consultar resultados" sports-bus/worker/telegram-chepica-play-home-entry.js
          grep -q "callback_data:'cp:observe'" sports-bus/worker/telegram-chepica-play-home-entry.js
          grep -q "prepareTelegramEntryContext" sports-bus/canonical-entry.js
          grep -q "telegram:chepica_play" sports-bus/migrations/0025_telegram_entry_context.sql

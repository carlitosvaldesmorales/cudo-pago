name: CUDO Review Response Column Discovery

on:
  push:
    paths:
      - '.github/workflows/cudo-review-response-column-discovery.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CUDO_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_ID }}
      CUDO_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_SECRET }}
      CUDO_GOOGLE_REFRESH_TOKEN: ${{ secrets.CUDO_GOOGLE_REFRESH_TOKEN }}
    steps:
      - name: Map synthetic response columns safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,urllib.parse,urllib.request
          sid='1KnC56IWf2hRxrGU4ksdO-JlzWyl2XJbhbOHKkdx4vms'
          target='CUDO-QA-SYNTH-TABLA-35027786202'
          event_id='CUDO-REVIEW-E2E-20260916-001'
          reviewer='CUDO QA Automation'
          expected=['Tabla de posiciones',target,'Rechazar publicación','NO','NO APLICA',reviewer]
          body=urllib.parse.urlencode({'client_id':os.environ['CUDO_GOOGLE_OAUTH_CLIENT_ID'],'client_secret':os.environ['CUDO_GOOGLE_OAUTH_CLIENT_SECRET'],'refresh_token':os.environ['CUDO_GOOGLE_REFRESH_TOKEN'],'grant_type':'refresh_token'}).encode()
          with urllib.request.urlopen(urllib.request.Request('https://oauth2.googleapis.com/token',data=body,headers={'Content-Type':'application/x-www-form-urlencoded'})) as r: token=json.load(r)['access_token']
          q=urllib.parse.quote("'Respuestas de formulario 1'!A1:Q5",safe='')
          with urllib.request.urlopen(urllib.request.Request(f'https://sheets.googleapis.com/v4/spreadsheets/{sid}/values/{q}?majorDimension=ROWS&valueRenderOption=FORMATTED_VALUE',headers={'Authorization':'Bearer '+token})) as r: rows=json.load(r).get('values',[])
          headers=rows[0] if rows else []
          def col(n):
            s=''
            while n:
              n,r=divmod(n-1,26); s=chr(65+r)+s
            return s
          out=[]
          for rn,row in enumerate(rows[1:],start=2):
            joined=' | '.join(str(v) for v in row)
            if target not in joined and event_id not in joined and reviewer not in joined: continue
            cols=[]
            for i in range(max(len(headers),len(row))):
              h=str(headers[i] if i<len(headers) else '').strip()
              v=str(row[i] if i<len(row) else '').strip()
              matched=next((x for x in expected if v==x),None)
              cols.append({
                'column':col(i+1),
                'header':h,
                'nonempty':bool(v),
                'expected_value':matched,
                'has_event_id':event_id in v,
                'has_target':target in v,
                'reviewer_match':v==reviewer,
                'value_length':len(v),
                'value_hash':hashlib.sha256(v.encode()).hexdigest()[:10] if v else None
              })
            out.append({'row':rn,'columns':cols})
          print(json.dumps({'ok':True,'header_count':len(headers),'matching_rows':out,'write_performed':False},ensure_ascii=False,indent=2))
          PY

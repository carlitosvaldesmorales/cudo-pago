name: CUDO Review Form Preflight

on:
  push:
    branches:
      - qa/review-event-no-prod-20260915
    paths:
      - '.github/workflows/cudo-review-form-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    if: github.ref == 'refs/heads/qa/review-event-no-prod-20260915'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CUDO_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_ID }}
      CUDO_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_SECRET }}
      CUDO_GOOGLE_REFRESH_TOKEN: ${{ secrets.CUDO_GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Read-only Form and synthetic target preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request

          form_id='1YHuKTdApT0dawISYNAolVjn1HlpI7cuBQOs8T7cRgnw'
          tabla_id='1evGNco6Si1BYUAdwsBxLGiSMsYEmmojVWlx04NgPodY'
          marker='CUDO-QA-SYNTH-TABLA-35027786202'

          body=urllib.parse.urlencode({
              'client_id':os.environ['CUDO_GOOGLE_OAUTH_CLIENT_ID'],
              'client_secret':os.environ['CUDO_GOOGLE_OAUTH_CLIENT_SECRET'],
              'refresh_token':os.environ['CUDO_GOOGLE_REFRESH_TOKEN'],
              'grant_type':'refresh_token'
          }).encode()
          with urllib.request.urlopen(urllib.request.Request(
              'https://oauth2.googleapis.com/token', data=body,
              headers={'Content-Type':'application/x-www-form-urlencoded'}
          )) as r:
              token=json.load(r)['access_token']

          def get_json(url):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token})
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          form=get_json(f'https://forms.googleapis.com/v1/forms/{form_id}')
          questions=[]
          for item in form.get('items',[]):
              q=item.get('questionItem',{}).get('question',{})
              if not q:
                  continue
              entry={'item_id':item.get('itemId'),'question_id':q.get('questionId'),'title':item.get('title',''),'required':bool(q.get('required'))}
              if 'choiceQuestion' in q:
                  entry['type']='CHOICE'
                  entry['choice_type']=q['choiceQuestion'].get('type')
                  entry['options']=[opt.get('value','') for opt in q['choiceQuestion'].get('options',[])]
              elif 'textQuestion' in q:
                  entry['type']='TEXT'
                  entry['paragraph']=bool(q['textQuestion'].get('paragraph'))
              else:
                  entry['type']='OTHER'
              questions.append(entry)

          # Read only the synthetic QA row from Tabla CONTROL; redact all unrelated rows.
          rng=urllib.parse.quote("CONTROL!A:Z",safe='')
          sheet=get_json(f'https://sheets.googleapis.com/v4/spreadsheets/{tabla_id}/values/{rng}?majorDimension=ROWS&valueRenderOption=FORMATTED_VALUE')
          values=sheet.get('values',[])
          headers=values[0] if values else []
          matches=[]
          for idx,row in enumerate(values[1:],start=2):
              obj={headers[i]:row[i] if i<len(row) else '' for i in range(len(headers))}
              if marker in [str(v).strip() for v in obj.values()]:
                  matches.append({'row':idx,'ID_TABLA':obj.get('ID_TABLA',''),'EQUIPO':obj.get('EQUIPO',''),'CATEGORIA':obj.get('CATEGORIA',''),'COMPETENCIA':obj.get('COMPETENCIA','')})

          decisions=[]
          for q in questions:
              if 'Decisión' in q['title'] or 'decision' in q['title'].lower():
                  decisions=q.get('options',[])

          result={
              'ok':True,
              'form_id':form_id,
              'form_title':form.get('info',{}).get('title'),
              'responder_uri_present':bool(form.get('responderUri')),
              'questions':questions,
              'synthetic_marker':marker,
              'synthetic_target_matches':matches,
              'synthetic_target_unique':len(matches)==1,
              'reject_publication_option_present':'Rechazar publicación' in decisions,
              'write_performed':False,
          }
          print(json.dumps(result,ensure_ascii=False,indent=2))
          if len(matches)!=1:
              raise SystemExit('synthetic target is not uniquely resolvable')
          if 'Rechazar publicación' not in decisions:
              raise SystemExit('required reject decision not available in live Form')
          PY

name: Validate Telegram Results Table UX Open Source

on:
  pull_request:
    branches: [feature/sports-event-bus-v1]
    paths:
      - 'sports-bus/worker/public-results-table-view.js'
      - 'ops/ux-validator/evidence-results-table.md'
      - 'ops/ux-validator/run-open-validator-results-table.mjs'
      - '.github/workflows/validate-telegram-results-table-ux-open-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Pin Istara open-source personas
        env:
          ISTARA_SHA: fa6a1a391b5a1089690eb8fed5d179ce146ec9e9
        run: |
          set -euo pipefail
          rm -rf /tmp/istara
          git init /tmp/istara
          git -C /tmp/istara remote add origin https://github.com/henrique-simoes/Istara.git
          git -C /tmp/istara fetch --depth 1 origin "$ISTARA_SHA"
          git -C /tmp/istara checkout --detach FETCH_HEAD
          test -f /tmp/istara/backend/app/agents/personas/istara-ux-eval/CORE.md
          test -f /tmp/istara/backend/app/agents/personas/istara-ui-audit/CORE.md

      - name: Install Ollama local runtime
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ollama.log || true
          exit 1

      - name: Pull independent open models
        run: |
          set -euo pipefail
          ollama pull qwen2.5:1.5b
          ollama pull granite3.1-dense:2b

      - name: Run Sage and Pixel independent gate
        env:
          ISTARA_ROOT: /tmp/istara
        run: |
          set -euo pipefail
          node ops/ux-validator/run-open-validator-results-table.mjs | tee /tmp/ux-table.log
          grep -q 'DESIGN_GATE=PASS' /tmp/ux-table.log

      - name: Upload UX evidence
        uses: actions/upload-artifact@v4
        with:
          name: telegram-results-table-ux-open-source-report
          path: artifacts/ux-validator-results-table/
          if-no-files-found: error
          retention-days: 30

name: Validate Telegram Results Table UX Contract

on:
  pull_request:
    branches: [feature/sports-event-bus-v1]
    paths:
      - 'sports-bus/worker/public-results-table-view.js'
      - 'ops/ux-validator/evidence-results-table.md'
      - 'ops/ux-validator/run-open-validator-results-table.mjs'
      - '.github/workflows/validate-telegram-results-table-ux-open-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate approved human UX contract without external AI
        run: |
          set -euo pipefail
          node --check ops/ux-validator/run-open-validator-results-table.mjs
          node ops/ux-validator/run-open-validator-results-table.mjs | tee /tmp/ux-table.log
          grep -q 'REGRESSION_GATE=PASS' /tmp/ux-table.log
          grep -q 'Human product authority: RECOVERED_APPROVED' /tmp/ux-table.log

      - name: Upload regression evidence
        uses: actions/upload-artifact@v4
        with:
          name: telegram-results-table-ux-contract-report
          path: artifacts/ux-validator-results-table/
          if-no-files-found: error
          retention-days: 30

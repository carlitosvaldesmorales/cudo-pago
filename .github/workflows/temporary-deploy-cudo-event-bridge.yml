name: Temporary Deploy CUDO Event Bridge

on:
  push:
    paths:
      - '.github/workflows/temporary-deploy-cudo-event-bridge.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CUDO_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_ID }}
      CUDO_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_SECRET }}
      CUDO_GOOGLE_REFRESH_TOKEN: ${{ secrets.CUDO_GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy current bridge source and preserve all other Apps Script files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,urllib.parse,urllib.request
          sid='1NI73jgr_PFvrsHy27ejE_kLbTWwLbM1Y8Nyc6mRaWlcCaLlZrpEB3Ud8'
          bridge=pathlib.Path('qa-v8-google/apps-script/CudoReviewEventBridge.gs').read_text()
          body=urllib.parse.urlencode({'client_id':os.environ['CUDO_GOOGLE_OAUTH_CLIENT_ID'],'client_secret':os.environ['CUDO_GOOGLE_OAUTH_CLIENT_SECRET'],'refresh_token':os.environ['CUDO_GOOGLE_REFRESH_TOKEN'],'grant_type':'refresh_token'}).encode()
          with urllib.request.urlopen(urllib.request.Request('https://oauth2.googleapis.com/token',data=body,headers={'Content-Type':'application/x-www-form-urlencoded'})) as r: access=json.load(r)['access_token']
          url=f'https://script.googleapis.com/v1/projects/{sid}/content'
          def req(method='GET',payload=None):
            q=urllib.request.Request(url,data=None if payload is None else json.dumps(payload).encode(),headers={'Authorization':'Bearer '+access,'Content-Type':'application/json'},method=method)
            with urllib.request.urlopen(q) as r:
              raw=r.read(); return json.loads(raw) if raw else {}
          current=req()
          files=[{'name':f['name'],'type':f['type'],'source':f.get('source','')} for f in current.get('files',[]) if f.get('name')!='CudoReviewEventBridge']
          files.append({'name':'CudoReviewEventBridge','type':'SERVER_JS','source':bridge})
          req('PUT',{'files':files})
          verify=req(); found=[f for f in verify.get('files',[]) if f.get('name')=='CudoReviewEventBridge']
          if len(found)!=1 or found[0].get('source')!=bridge: raise SystemExit('Bridge verification failed')
          print(json.dumps({'ok':True,'bridge_source_matches_main':True,'file_count':len(verify.get('files',[])),'other_files_preserved':len(verify.get('files',[]))-1},indent=2))
          PY

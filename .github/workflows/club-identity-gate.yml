name: Club Identity Gate

on:
  push:
    paths:
      - 'preview-v8/media/clubes/**'
      - 'tools/validate-club-identity.mjs'
      - '.github/workflows/club-identity-gate.yml'
  pull_request:
    paths:
      - 'preview-v8/media/clubes/**'
      - 'tools/validate-club-identity.mjs'
      - '.github/workflows/club-identity-gate.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate approved club identities
        run: node tools/validate-club-identity.mjs

name: CUDO V8 - validar producción cudo.cl
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['preview-v8/**','.github/workflows/validate-v8-production.yml']
permissions:
  contents: read
jobs:
  production-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Esperar propagación V8 en cudo.cl
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://cudo.cl/preview-v8/partidos/?v=20260908-2115'
          for i in $(seq 1 50); do
            if curl -LfsS "$PAGE" -o /tmp/cudo-page.html && grep -q '20260908-2115' /tmp/cudo-page.html; then exit 0; fi
            sleep 6
          done
          exit 1
      - name: Reconstruir y validar sprite publicado
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/crests.b64
          for i in 0 1 2a 2b; do curl -LfsS "https://cudo.cl/preview-v8/media/crest-base64/$i.txt?v=20260908-2030" >> /tmp/crests.b64; done
          test "$(wc -c < /tmp/crests.b64)" -eq 42332
          base64 -d /tmp/crests.b64 > /tmp/crests.webp
          test "$(wc -c < /tmp/crests.webp)" -eq 31748
          file /tmp/crests.webp | grep -q 'Web/P image'
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Instalar QA visual open source
        run: |
          npm install --no-save playwright@1.55.0 sharp@0.34.3
          npx playwright install --with-deps chromium
      - name: Medir los 11 escudos
        shell: bash
        run: |
          mkdir -p qa-prod-v8/logos
          cat > logo-quality.mjs <<'NODE'
          import sharp from 'sharp';import fs from 'node:fs';
          const names=['Juventud de Chépica','Santa Elena La Ruda','Independiente','Unión Orilla','San Juan','Peñarol La Mina','Huracán','San Agustín','San Ramón','Las Palmeras','Las Cruces'];
          const input='/tmp/crests.webp',meta=await sharp(input).metadata();if(meta.width!==224||meta.height!==168)throw new Error(`Sprite ${meta.width}x${meta.height}`);
          const metrics=[];for(let i=0;i<11;i++){const left=(i%4)*56,top=Math.floor(i/4)*56;const cell=sharp(input).extract({left,top,width:56,height:56});await cell.png().toFile(`qa-prod-v8/logos/source-${String(i+1).padStart(2,'0')}.png`);metrics.push({index:i+1,name:names[i],cell:'56x56'});}fs.writeFileSync('qa-prod-v8/logo-metrics.json',JSON.stringify({sprite:{width:224,height:168,format:meta.format},logos:metrics},null,2));
          NODE
          node logo-quality.mjs
      - name: QA visual Playwright móvil y escritorio
        shell: bash
        run: |
          cat > check-prod.mjs <<'NODE'
          import {chromium} from 'playwright';import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});const errors=[];
          for(const vp of [{name:'mobile',width:390,height:844,dpr:2},{name:'desktop',width:1440,height:1000,dpr:1}]){
            const page=await browser.newPage({viewport:{width:vp.width,height:vp.height},deviceScaleFactor:vp.dpr});page.on('console',m=>{if(m.type()==='error')errors.push(`${vp.name}: ${m.text()}`)});page.on('pageerror',e=>errors.push(`${vp.name}: ${e.message}`));
            await page.goto('https://cudo.cl/preview-v8/equipos/?v=20260908-2115',{waitUntil:'networkidle',timeout:90000});await page.locator('.club-card').first().waitFor({state:'visible'});await page.waitForFunction(()=>document.documentElement.classList.contains('crests-ready'),null,{timeout:30000});
            const clubs=await page.evaluate(()=>[...document.querySelectorAll('.club-card')].map((c,i)=>{const el=c.querySelector('.champ-crest'),s=getComputedStyle(el),r=el.getBoundingClientRect();return {i,name:c.querySelector('.club-name').textContent.trim(),bg:s.backgroundImage,pos:s.backgroundPosition,size:s.backgroundSize,w:r.width,h:r.height}}));if(clubs.length!==11)throw new Error(`${vp.name} clubs ${clubs.length}`);for(const c of clubs){if(!c.bg.includes('data:image/webp;base64,UklGR'))throw new Error(`${c.name} missing sprite`);if(c.w<70||c.h<70)throw new Error(`${c.name} too small ${c.w}x${c.h}`)}
            await page.screenshot({path:`qa-prod-v8/clubes-${vp.name}.png`,fullPage:true});for(let i=0;i<11;i++)await page.locator('.club-card').nth(i).screenshot({path:`qa-prod-v8/logos/card-${vp.name}-${String(i+1).padStart(2,'0')}.png`});
            await page.goto('https://cudo.cl/preview-v8/partidos/?v=20260908-2115',{waitUntil:'networkidle',timeout:90000});await page.locator('.champ-match-card').first().waitFor({state:'visible'});await page.waitForFunction(()=>document.documentElement.classList.contains('crests-ready'),null,{timeout:30000});const champ=await page.evaluate(()=>({matches:document.querySelectorAll('.champ-match-card').length,crests:document.querySelectorAll('.champ-match-card .champ-crest').length,seriesRows:document.querySelectorAll('.champ-series-row').length,verified:document.querySelectorAll('.champ-verified').length,tabs:[...document.querySelectorAll('.champ-date-btn')].map(x=>x.textContent.trim())}));if(champ.matches!==3||champ.crests!==6||champ.seriesRows!==12||champ.verified!==3||champ.tabs.length!==5)throw new Error(`${vp.name} championship ${JSON.stringify(champ)}`);await page.screenshot({path:`qa-prod-v8/partidos-${vp.name}.png`,fullPage:true});await page.close();
          }
          fs.writeFileSync('qa-prod-v8/browser-errors.json',JSON.stringify(errors,null,2));await browser.close();if(errors.length)throw new Error(errors.join(' | '));
          NODE
          node check-prod.mjs
      - name: Evidencia visual producción
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cudo-v8-open-source-visual-qa
          path: qa-prod-v8/
          if-no-files-found: warn
          retention-days: 14

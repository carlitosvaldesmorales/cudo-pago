name: CUDO V8 - validar producción cudo.cl

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'preview-v8/**'
      - '.github/workflows/validate-v8-production.yml'

permissions:
  contents: read

jobs:
  production-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Esperar propagación V8 en cudo.cl
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://cudo.cl/preview-v8/partidos/?v=20260908-1825'
          for i in $(seq 1 40); do
            if curl -LfsS --connect-timeout 10 --max-time 20 "$PAGE" -o /tmp/cudo-page.html \
              && grep -q '20260908-1825' /tmp/cudo-page.html; then
              echo 'Producción ya sirve la versión esperada.'
              exit 0
            fi
            echo "Esperando propagación ($i/40)..."
            sleep 6
          done
          echo 'cudo.cl no propagó la versión esperada dentro de la ventana.'
          exit 1

      - name: Reconstruir y validar WebP desde chunks públicos
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/crests.b64
          for i in 0 1 2; do
            curl -LfsS --connect-timeout 10 --max-time 30 "https://cudo.cl/preview-v8/media/crest-base64/$i.txt?v=20260908-1825" >> /tmp/crests.b64
          done
          CHARS=$(wc -c < /tmp/crests.b64)
          echo "crest_base64_chars=$CHARS"
          test "$CHARS" -eq 13296
          base64 -d /tmp/crests.b64 > /tmp/crests.webp
          BYTES=$(wc -c < /tmp/crests.webp)
          echo "crest_asset_bytes=$BYTES"
          test "$BYTES" -eq 9972
          MAGIC=$(head -c 12 /tmp/crests.webp | od -An -tx1 | tr -d ' \n')
          echo "crest_magic=$MAGIC"
          echo "$MAGIC" | grep -Eq '^52494646[0-9a-f]{8}57454250$'
          file /tmp/crests.webp

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validar render real de escudos
        shell: bash
        run: |
          mkdir -p qa-prod-v8
          cat > check-prod.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:2});
          const errors=[];
          page.on('console',m=>{if(m.type()==='error')errors.push(`console:${m.text()}`)});
          page.on('pageerror',e=>errors.push(`pageerror:${e.message}`));
          await page.goto('https://cudo.cl/preview-v8/partidos/?v=20260908-1825',{waitUntil:'networkidle',timeout:90000});
          await page.locator('.champ-match').first().waitFor({state:'visible',timeout:30000});
          const result=await page.evaluate(()=>{
            const crests=[...document.querySelectorAll('.champ-match .champ-crest')];
            const styles=crests.map(el=>{const r=el.getBoundingClientRect();const s=getComputedStyle(el);return{className:el.className,bg:s.backgroundImage,w:r.width,h:r.height,position:s.backgroundPosition}});
            const cssVar=getComputedStyle(document.documentElement).getPropertyValue('--champ-crest-image');
            return{matchCount:document.querySelectorAll('.champ-match').length,crestCount:crests.length,styles,cssVar,roundButtons:[...document.querySelectorAll('.champ-date-btn')].map(x=>x.textContent.trim())};
          });
          fs.writeFileSync('qa-prod-v8/result.json',JSON.stringify({result,errors},null,2));
          await page.screenshot({path:'qa-prod-v8/partidos-mobile.png',fullPage:true});
          const fixture=page.locator('#champFixture');
          await fixture.screenshot({path:'qa-prod-v8/fixture-mobile.png'});
          await browser.close();
          console.log(JSON.stringify({result,errors},null,2));
          if(result.matchCount!==3)throw new Error(`Expected 3 Fecha I Grupo A matches, got ${result.matchCount}`);
          if(result.crestCount!==6)throw new Error(`Expected 6 crests, got ${result.crestCount}`);
          if(!result.cssVar.includes('data:image/webp;base64,UklGR'))throw new Error('Crest data URL CSS variable missing');
          if(!result.styles.every(x=>x.bg.includes('data:image/webp;base64,UklGR')))throw new Error('Not all crest elements use decoded data URL');
          if(!result.styles.every(x=>x.w>=49&&x.h>=49))throw new Error('Crest dimensions invalid');
          if(JSON.stringify(result.roundButtons)!==JSON.stringify(['Fecha I','Fecha II','Fecha III','Fecha IV','Fecha V']))throw new Error('Round tabs invalid');
          if(errors.length)throw new Error(`Browser errors: ${errors.join(' | ')}`);
          NODE
          node check-prod.mjs

      - name: Evidencia producción
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cudo-v8-production-crests
          path: qa-prod-v8/
          if-no-files-found: warn
          retention-days: 14

name: CUDO V8 - certificar producción cudo.cl
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'preview-v8/**'
      - '.github/workflows/validate-v8-production.yml'
permissions:
  contents: read
jobs:
  production-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Preparar carpeta de evidencia
        run: mkdir -p qa-prod-v8/http qa-prod-v8/logos
      - name: Esperar publicación actual de Clubes
        shell: bash
        run: |
          set -euo pipefail
          PAGE="https://cudo.cl/preview-v8/equipos/?qa=${GITHUB_SHA}"
          for i in $(seq 1 50); do
            if curl -LfsS "$PAGE" -o /tmp/cudo-page.html \
              && grep -q '20260909-logos02' /tmp/cudo-page.html \
              && grep -q '../media/clubes/union-orilla.png' /tmp/cudo-page.html; then
              exit 0
            fi
            sleep 6
          done
          echo 'La publicación actual de Clubes no apareció dentro de la ventana de espera.' >&2
          exit 1
      - name: Node 20 compatible con QA V8 existente
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Playwright sin tocar apt
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Validar transporte de los 11 PNG individuales
        shell: bash
        run: |
          set -euo pipefail
          files=(
            juventud-chepica.png santa-elena-la-ruda.png independiente.png
            union-orilla.png san-juan.png penarol-la-mina.png huracan.png
            san-agustin.png san-ramon.png las-palmeras.png las-cruces.png
          )
          for f in "${files[@]}"; do
            curl -LfsS "https://cudo.cl/preview-v8/media/clubes/$f?qa=${GITHUB_SHA}" -o "qa-prod-v8/http/$f"
            file "qa-prod-v8/http/$f" | grep -q 'PNG image data'
          done
          sha256sum qa-prod-v8/http/union-orilla.png > qa-prod-v8/http/union-orilla.sha256
          grep -q '^2d3388c3567923006c06d57947ecc39eb418c6608cf79f98e0aee7aaa879ba53 ' qa-prod-v8/http/union-orilla.sha256
      - name: QA visual Clubes móvil y escritorio
        shell: bash
        run: |
          cat > check-prod.mjs <<'NODE'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN});
          const report={source:'https://cudo.cl/preview-v8/equipos/',expectedCudoSha256:'2d3388c3567923006c06d57947ecc39eb418c6608cf79f98e0aee7aaa879ba53',viewports:{}};
          for(const vp of [{name:'mobile',width:390,height:844,dpr:2},{name:'desktop',width:1440,height:1000,dpr:1}]){
            const page=await browser.newPage({viewport:{width:vp.width,height:vp.height},deviceScaleFactor:vp.dpr});
            const warnings=[];page.on('console',m=>{if(m.type()==='error')warnings.push(m.text())});page.on('pageerror',e=>warnings.push(e.message));
            await page.goto(`https://cudo.cl/preview-v8/equipos/?qa=${Date.now()}`,{waitUntil:'networkidle',timeout:90000});
            await page.locator('.club-card').first().waitFor({state:'visible'});
            const clubs=await page.evaluate(()=>[...document.querySelectorAll('.club-card')].map(c=>{const img=c.querySelector('img.club-crest');return {name:c.querySelector('.club-name')?.textContent.trim(),src:img?.getAttribute('src'),naturalWidth:img?.naturalWidth,naturalHeight:img?.naturalHeight,complete:img?.complete};}));
            if(clubs.length!==11) throw new Error(`${vp.name}: se esperaban 11 clubes y hay ${clubs.length}`);
            for(const c of clubs){if(!c.complete||!c.naturalWidth||!c.src?.includes('../media/clubes/'))throw new Error(`${vp.name}: escudo inválido ${c.name}`)}
            const cudo=clubs.find(c=>c.name==='Unión Orilla');
            if(!cudo||!cudo.src.endsWith('/union-orilla.png'))throw new Error(`${vp.name}: Unión Orilla no usa union-orilla.png`);
            await page.screenshot({path:`qa-prod-v8/clubes-${vp.name}.png`,fullPage:true});
            await page.locator('.club-card').filter({hasText:'Unión Orilla'}).first().screenshot({path:`qa-prod-v8/logos/cudo-${vp.name}.png`});
            report.viewports[vp.name]={clubs,cudo,warnings};
            await page.close();
          }
          fs.writeFileSync('qa-prod-v8/visual-report.json',JSON.stringify(report,null,2));
          await browser.close();
          NODE
          node check-prod.mjs
      - name: Generar certificado legible
        shell: bash
        run: |
          cat > qa-prod-v8/CERTIFICADO.txt <<EOF
          CUDO V8 — CERTIFICACIÓN PRODUCCIÓN CLUBES
          Sitio: https://cudo.cl/preview-v8/equipos/
          Commit QA: ${GITHUB_SHA}
          Estado: CONFORME
          CUDO / Unión Orilla SHA-256 publicado:
          2d3388c3567923006c06d57947ecc39eb418c6608cf79f98e0aee7aaa879ba53
          Evidencia: clubes-mobile.png, clubes-desktop.png, logos/cudo-mobile.png, logos/cudo-desktop.png, visual-report.json
          EOF
      - name: Publicar evidencia certificable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cudo-v8-certificacion-clubes-${{ github.run_number }}
          path: qa-prod-v8/
          if-no-files-found: error
          retention-days: 30

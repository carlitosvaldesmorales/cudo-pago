name: CUDO V8 - validar producción cudo.cl

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'preview-v8/**'
      - '.github/workflows/validate-v8-production.yml'

permissions:
  contents: read

jobs:
  production-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Esperar propagación V8 en cudo.cl
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://cudo.cl/preview-v8/partidos/?v=20260908-1818'
          for i in $(seq 1 40); do
            if curl -LfsS --connect-timeout 10 --max-time 20 "$PAGE" -o /tmp/cudo-page.html \
              && grep -q '20260908-1818' /tmp/cudo-page.html; then
              echo 'Producción ya sirve la versión esperada.'
              exit 0
            fi
            echo "Esperando propagación ($i/40)..."
            sleep 6
          done
          echo 'cudo.cl no propagó la versión esperada dentro de la ventana.'
          exit 1

      - name: Validar recurso WebP de escudos servido
        shell: bash
        run: |
          set -euo pipefail
          URL='https://cudo.cl/preview-v8/media/anfa-chepica-2026-crests-v4.webp?v=20260908-1818'
          curl -LfsS --connect-timeout 10 --max-time 30 "$URL" -o /tmp/crests.webp
          BYTES=$(wc -c < /tmp/crests.webp)
          echo "crest_asset_bytes=$BYTES"
          test "$BYTES" -gt 8000
          MAGIC=$(head -c 12 /tmp/crests.webp | od -An -tx1 | tr -d ' \n')
          echo "crest_magic=$MAGIC"
          echo "$MAGIC" | grep -Eq '^52494646[0-9a-f]{8}57454250$'
          file /tmp/crests.webp

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validar render real de escudos
        shell: bash
        run: |
          mkdir -p qa-prod-v8
          cat > check-prod.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:390,height:844}, deviceScaleFactor:2});
          const errors=[];
          page.on('console', m => { if (m.type()==='error') errors.push(`console:${m.text()}`); });
          page.on('pageerror', e => errors.push(`pageerror:${e.message}`));
          await page.goto('https://cudo.cl/preview-v8/partidos/?v=20260908-1818',{waitUntil:'networkidle',timeout:90000});
          await page.locator('.champ-match').first().waitFor({state:'visible',timeout:30000});
          const result = await page.evaluate(async()=>{
            const crests=[...document.querySelectorAll('.champ-match .champ-crest')];
            const visible=crests.filter(el=>{const r=el.getBoundingClientRect();return r.width>0&&r.height>0});
            const styles=visible.map(el=>({className:el.className,bg:getComputedStyle(el).backgroundImage,w:el.getBoundingClientRect().width,h:el.getBoundingClientRect().height}));
            const imageUrl=styles[0]?.bg.match(/url\(["']?(.*?)["']?\)/)?.[1]||'';
            let assetOk=false, assetStatus=null, imageDecoded=false, naturalWidth=0, naturalHeight=0;
            if(imageUrl){
              const r=await fetch(imageUrl,{cache:'no-store'});assetStatus=r.status;const b=await r.arrayBuffer();assetOk=r.ok&&b.byteLength>8000;
              const probe=new Image();
              const done=new Promise(resolve=>{probe.onload=()=>{imageDecoded=true;naturalWidth=probe.naturalWidth;naturalHeight=probe.naturalHeight;resolve();};probe.onerror=()=>resolve();});
              probe.src=imageUrl+(imageUrl.includes('?')?'&':'?')+'decode=1';
              await done;
            }
            return {matchCount:document.querySelectorAll('.champ-match').length,crestCount:crests.length,visibleCount:visible.length,styles,imageUrl,assetOk,assetStatus,imageDecoded,naturalWidth,naturalHeight};
          });
          fs.writeFileSync('qa-prod-v8/result.json',JSON.stringify({result,errors},null,2));
          await page.screenshot({path:'qa-prod-v8/partidos-mobile.png',fullPage:true});
          const fixture=page.locator('#champFixture');
          if(await fixture.count()) await fixture.screenshot({path:'qa-prod-v8/fixture-mobile.png'});
          await browser.close();
          console.log(JSON.stringify({result,errors},null,2));
          if(result.matchCount!==3) throw new Error(`Expected 3 Fecha I Grupo A matches, got ${result.matchCount}`);
          if(result.crestCount!==6||result.visibleCount!==6) throw new Error(`Expected 6 visible crests, got ${result.visibleCount}/${result.crestCount}`);
          if(!result.styles.every(x=>x.bg.includes('anfa-chepica-2026-crests-v4.webp'))) throw new Error('Not all crests use v4 real asset');
          if(!result.styles.every(x=>x.w>=49&&x.h>=49)) throw new Error('Crest dimensions invalid');
          if(!result.assetOk) throw new Error(`Crest asset fetch failed: status=${result.assetStatus}`);
          if(!result.imageDecoded||result.naturalWidth!==224||result.naturalHeight!==168) throw new Error(`Crest image did not decode as 224x168 WebP: ${result.naturalWidth}x${result.naturalHeight}`);
          NODE
          node check-prod.mjs

      - name: Evidencia producción
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cudo-v8-production-crests
          path: qa-prod-v8/
          if-no-files-found: warn
          retention-days: 14

name: Temporary dispatch CUDO Review Engine

on:
  push:
    paths:
      - '.github/workflows/temporary-dispatch-cudo-review-engine.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch real Review Engine through official apply gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPO}/actions/workflows/cudo-review-engine.yml/dispatches" \
            -d '{"ref":"main","inputs":{"apply_changes":"true"}}')
          if [ "$code" != "204" ]; then
            cat /tmp/dispatch.json
            echo "workflow dispatch failed HTTP $code"
            exit 1
          fi
          echo 'CUDO Review Engine workflow_dispatch accepted'

name: Certify CUDO Causal Partial Order Arbitration

on:
  pull_request:
    branches: [main]
    paths:
      - 'qa-v8-google/contracts/cudo-shared-object-contract-v1.json'
      - 'qa-v8-google/tools/certify_shared_object_contract.mjs'
      - 'qa-v8-google/contracts/cudo-causal-partial-order-arbitration-v1.json'
      - 'qa-v8-google/tools/causal_partial_order_arbitration.mjs'
      - 'qa-v8-google/tools/certify_causal_partial_order_arbitration.mjs'
      - '.github/workflows/certify-cudo-causal-partial-order-arbitration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Re-certify shared object contract
        run: node qa-v8-google/tools/certify_shared_object_contract.mjs
      - name: Validate arbitration syntax
        run: node --check qa-v8-google/tools/causal_partial_order_arbitration.mjs
      - name: Validate arbitration certification syntax
        run: node --check qa-v8-google/tools/certify_causal_partial_order_arbitration.mjs
      - name: Certify causal partial order arbitration
        run: node qa-v8-google/tools/certify_causal_partial_order_arbitration.mjs

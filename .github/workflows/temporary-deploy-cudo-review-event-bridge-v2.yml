name: Temporary deploy CUDO Review Event Bridge v2

on:
  push:
    paths:
      - '.github/workflows/temporary-deploy-cudo-review-event-bridge-v2.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CUDO_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_ID }}
      CUDO_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_SECRET }}
      CUDO_GOOGLE_REFRESH_TOKEN: ${{ secrets.CUDO_GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy bridge source to existing Apps Script project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          sid='1NI73jgr_PFvrsHy27ejE_kLbTWwLbM1Y8Nyc6mRaWlcCaLlZrpEB3Ud8'
          bridge=pathlib.Path('qa-v8-google/apps-script/CudoReviewEventBridge.gs').read_text()
          token_req=urllib.request.Request(
            'https://oauth2.googleapis.com/token',
            data=urllib.parse.urlencode({
              'client_id':os.environ['CUDO_GOOGLE_OAUTH_CLIENT_ID'],
              'client_secret':os.environ['CUDO_GOOGLE_OAUTH_CLIENT_SECRET'],
              'refresh_token':os.environ['CUDO_GOOGLE_REFRESH_TOKEN'],
              'grant_type':'refresh_token'
            }).encode(),
            headers={'Content-Type':'application/x-www-form-urlencoded'}
          )
          with urllib.request.urlopen(token_req) as r:
            access=json.load(r)['access_token']
          url=f'https://script.googleapis.com/v1/projects/{sid}/content'
          def call(method='GET',payload=None):
            req=urllib.request.Request(
              url,
              data=None if payload is None else json.dumps(payload).encode(),
              headers={'Authorization':'Bearer '+access,'Content-Type':'application/json'},
              method=method
            )
            with urllib.request.urlopen(req) as r:
              raw=r.read()
              return json.loads(raw) if raw else {}
          current=call()
          clean=[{'name':f['name'],'type':f['type'],'source':f.get('source','')} for f in current.get('files',[]) if f.get('name')!='CudoReviewEventBridge']
          clean.append({'name':'CudoReviewEventBridge','type':'SERVER_JS','source':bridge})
          call('PUT',{'files':clean})
          verify=call()
          found=[f for f in verify.get('files',[]) if f.get('name')=='CudoReviewEventBridge']
          ok=len(found)==1 and found[0].get('source')==bridge
          print(json.dumps({'ok':ok,'bridge_present':len(found)==1,'file_count':len(verify.get('files',[])),'manifest_changed':False,'trigger_created':False},indent=2))
          if not ok:
            raise SystemExit(1)
          PY

name: CUDO Private Event Assignment Auth Probe

on:
  push:
    branches:
      - feat/event-assignment-private-20260923
    paths:
      - '.github/workflows/cudo-private-event-assignment-auth-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CUDO_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_ID }}
      CUDO_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.CUDO_GOOGLE_OAUTH_CLIENT_SECRET }}
      CUDO_GOOGLE_REFRESH_TOKEN: ${{ secrets.CUDO_GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Probe private assignment web app with existing OAuth identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.parse,urllib.request,urllib.error
          cfg=json.load(open('preview-v8/admin/forms-config.json'))
          url=cfg['event_assignment_url']+'&activity=QA-ACTIVITY-MATCH-PR219-001'
          body=urllib.parse.urlencode({
            'client_id':os.environ['CUDO_GOOGLE_OAUTH_CLIENT_ID'],
            'client_secret':os.environ['CUDO_GOOGLE_OAUTH_CLIENT_SECRET'],
            'refresh_token':os.environ['CUDO_GOOGLE_REFRESH_TOKEN'],
            'grant_type':'refresh_token'
          }).encode()
          with urllib.request.urlopen(urllib.request.Request('https://oauth2.googleapis.com/token',data=body,headers={'Content-Type':'application/x-www-form-urlencoded'}),timeout=30) as r:
            token=json.load(r)['access_token']
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'User-Agent':'CUDO-Private-Assignment-Certifier'})
          opener=urllib.request.build_opener()
          try:
            with opener.open(req,timeout=30) as r:
              html=r.read().decode('utf-8','replace')
              final=r.geturl()
              result={
                'http_status':r.status,
                'final_host':urllib.parse.urlparse(final).netloc,
                'assignment_ui_visible':'Revisar y asignar trabajo' in html or 'Revisar responsabilidades y asignar personas válidas' in html,
                'login_interstitial':('accounts.google.com' in final) or ('Sign in' in html and 'Google' in html),
                'real_actor_name_visible':any(x in html for x in ['Maximiliano Figueroa','Mario Díaz','Cecilia','Sandra Salinas'])
              }
          except urllib.error.HTTPError as e:
            result={'http_status':e.code,'assignment_ui_visible':False,'login_interstitial':False,'real_actor_name_visible':False}
          print(json.dumps(result,indent=2,ensure_ascii=False))
          if not result['assignment_ui_visible']:
            raise SystemExit(2)
          if not result['real_actor_name_visible']:
            raise SystemExit(3)
          PY
